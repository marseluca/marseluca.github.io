{ id: "trasformatore", level: "inter", min: 10,
  title: "Il trasformatore",
  sub: "Alzare e abbassare la tensione senza parti in movimento",
  goals: ["Capire il principio di funzionamento", "Usare il rapporto spire", "Capire perché si trasporta energia in alta tensione"],
  body: `
<h2>Com'è fatto</h2>
<p>Un [[trasformatore]] è formato da due bobine avvolte sullo stesso [[nucleo]] di ferro. La bobina collegata alla sorgente si chiama [[primario]], quella collegata al carico secondario. Le due bobine non si toccano: l'energia passa dall'una all'altra attraverso il campo magnetico.</p>
<figure class="fig"><svg viewBox="0 0 320 140" aria-label="Schema di un trasformatore">
  <rect x="95" y="15" width="130" height="110" rx="6" fill="none" stroke="var(--muted)" stroke-width="14" opacity="0.35"/>
  <g fill="none" stroke="var(--accent)" stroke-width="3">
    <path d="M95 35 h-16 M95 50 h-16 M95 65 h-16 M95 80 h-16 M95 95 h-16 M95 110 h-16"/>
  </g>
  <g fill="none" stroke="var(--volt)" stroke-width="3">
    <path d="M225 50 h16 M225 70 h16 M225 90 h16"/>
  </g>
  <path class="wire" d="M79 35 H30 M79 110 H30 M241 50 H290 M241 90 H290"/>
  <text class="lbl" x="18" y="77">V<tspan dy="4" font-size="9">1</tspan></text><text class="lbl" x="292" y="77">V<tspan dy="4" font-size="9">2</tspan></text>
  <text class="lbl-m" x="62" y="132" text-anchor="middle">N₁ spire</text><text class="lbl-m" x="258" y="132" text-anchor="middle">N₂ spire</text>
  <text class="lbl-m" x="160" y="74" text-anchor="middle">nucleo</text>
</svg></figure>

<h2>Come funziona</h2>
<ol>
<li>La tensione alternata sul primario fa circolare una corrente alternata.</li>
<li>Questa crea nel nucleo un flusso magnetico che varia continuamente.</li>
<li>Il flusso variabile attraversa anche il secondario e, per la [[faraday|legge di Faraday]], vi induce una tensione.</li>
</ol>
<p>Ne segue una cosa importante: <b>il trasformatore funziona solo in alternata</b>. Con una tensione continua il flusso non varia e sul secondario non arriva nulla.</p>

<h2>Il rapporto spire</h2>
<p>In un trasformatore ideale le tensioni stanno nello stesso rapporto del numero di [[spira|spire]], mentre le correnti stanno nel rapporto inverso (la potenza in ingresso è uguale a quella in uscita):</p>
<div class="f">V<sub>1</sub> / V<sub>2</sub> = N<sub>1</sub> / N<sub>2</sub> = I<sub>2</sub> / I<sub>1</sub></div>
<div class="box ex"><b>Esempio</b><p>Un trasformatore per una lampada alogena ha 1150 spire al primario e 60 al secondario. Collegato a 230 V dà V<sub>2</sub> = 230 · 60 / 1150 = <b>12 V</b>. Se la lampada assorbe 2 A, dalla rete si preleva solo I<sub>1</sub> = 2 · 60 / 1150 ≈ <b>0,10 A</b>.</p></div>

<div data-w="trasf"></div>

<h2>Perché le linee sono ad alta tensione</h2>
<p>Le perdite in una linea sono P<sub>perdita</sub> = R · I². A parità di potenza trasportata (P = V · I), alzando la tensione si abbassa la corrente, e le perdite scendono con il quadrato.</p>
<div class="box ex"><b>Esempio</b><p>Trasportare 10 MW a 10 kV richiede 1000 A; a 400 kV ne bastano 25. La corrente è 40 volte più piccola e le perdite 40² = <b>1600 volte</b> più piccole.</p></div>
<p>Per questo l'energia esce dalle centrali, viene alzata a centinaia di migliaia di volt per il trasporto e poi abbassata a gradini fino ai 400/230 V delle nostre case.</p>

<h2>Perdite e rendimento</h2>
<p>Un trasformatore reale perde un po' di energia in calore:</p>
<ul>
<li><b>Perdite nel rame</b>: effetto Joule negli avvolgimenti, crescono con il carico.</li>
<li><b>Perdite nel ferro</b>: dovute alle [[parassite|correnti parassite]] e alla continua magnetizzazione del nucleo. Per ridurle il nucleo è fatto di lamierini sottili isolati tra loro.</li>
</ul>
<p>Nonostante questo i trasformatori sono macchine molto efficienti: quelli grandi hanno un [[rendimento]] superiore al 98%.</p>`,
  quiz: [
    { q: "Un trasformatore ha N1 = 1000 e N2 = 100. Con 230 V al primario, quanto vale V2?", o: ["2300 V", "23 V", "2,3 V", "230 V"], a: 1, w: "V2 = V1 · N2/N1 = 230 · 100/1000 = 23 V." },
    { q: "Cosa succede se alimenti un trasformatore con una tensione continua?", o: ["Funziona normalmente", "Sul secondario non si induce tensione", "Raddoppia la tensione", "Inverte la polarità"], a: 1, w: "Senza variazione di flusso non c'è induzione. In più, il primario si comporterebbe quasi come un corto e si scalderebbe." },

const KEY = "luca_elettrotecnica";

/* ===========================================================
   UTILITÀ
   =========================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = (n, d = 2) => Number(n).toLocaleString("it-IT", { maximumFractionDigits: d });
// formatta con prefisso: 0.005 A -> "5 mA"
function eng(v, unit, d = 3) {
  if (!isFinite(v)) return "∞ " + unit;
  if (v === 0) return "0 " + unit;
  const P = [[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"]];
  const a = Math.abs(v);
  const [f, p] = P.find(([f]) => a >= f * 0.9995) || P[P.length - 1];
  return Number((v / f).toPrecision(d)).toLocaleString("it-IT") + " " + p + unit;
}
const linkTerms = html => html.replace(/\[\[([a-z_]+)(?:\|([^\]]+))?\]\]/g, (m, k, t) => {
  const e = GLOSSARY[k];
  return e ? `<a class="g" href="#" data-g="${k}">${t || e[0].split(" (")[0].toLowerCase()}</a>` : (t || k);
});

/* ===========================================================
   GRAFICI SVG
   =========================================================== */
function ticks(a, b, n = 5) {
  const span = b - a, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function plot(o) {
  const W = 340, H = o.h || 190, pl = 40, pr = 10, pt = 10, pb = 30;
  const sx = x => pl + (x - o.x[0]) / (o.x[1] - o.x[0]) * (W - pl - pr);
  const sy = y => pt + (o.y[1] - y) / (o.y[1] - o.y[0]) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="${esc(o.label || "grafico")}"><g class="grid">`;
  const xt = ticks(o.x[0], o.x[1], 5), yt = ticks(o.y[0], o.y[1], 4);
  xt.forEach(v => s += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${pt}" y2="${H - pb}"/>`);
  yt.forEach(v => s += `<line x1="${pl}" x2="${W - pr}" y1="${sy(v)}" y2="${sy(v)}"/>`);
  s += `</g>`;
  const y0 = o.y[0] <= 0 && o.y[1] >= 0 ? sy(0) : H - pb;
  s += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${y0}" y2="${y0}"/><line class="axis" x1="${pl}" x2="${pl}" y1="${pt}" y2="${H - pb}"/>`;
  xt.forEach(v => s += `<text x="${sx(v)}" y="${H - pb + 13}" text-anchor="middle">${num(v, 2)}</text>`);
  yt.forEach(v => s += `<text x="${pl - 5}" y="${sy(v) + 3}" text-anchor="end">${num(v, 2)}</text>`);
  if (o.xl) s += `<text x="${W - pr}" y="${H - 3}" text-anchor="end">${esc(o.xl)}</text>`;
  if (o.yl) s += `<text x="${pl + 4}" y="${pt + 9}">${esc(o.yl)}</text>`;
  (o.marks || []).forEach(m => {
    if (m.x < o.x[0] || m.x > o.x[1]) return;
    s += `<line class="mk" x1="${sx(m.x)}" x2="${sx(m.x)}" y1="${pt}" y2="${H - pb}"/><text class="mk-t" x="${sx(m.x) + 4}" y="${pt + 20}">${esc(m.t)}</text>`;
  });
  (o.lines || []).forEach(l => {
    const d = l.pts.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(Math.max(o.y[0], Math.min(o.y[1], p[1]))).toFixed(1)).join("");
    s += `<path class="ln ${l.c}" d="${d}"/>`;
  });
  (o.dots || []).forEach(p => s += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4" fill="var(--${p[2]})"/>`);
  return s + `</svg>`;
}
const sample = (a, b, f, n = 160) => Array.from({ length: n + 1 }, (_, i) => { const x = a + (b - a) * i / n; return [x, f(x)]; });

/* ===========================================================
   SIMULATORI
   ctrl: { k, l (etichetta), min, max, step, v, u (unità), t: "num" per input numerico }

function makeWidget(el, title, ctrls, update, extra = "") {
  const rows = ctrls.map(c => c.t === "num"
    ? `<div class="ctl"><div class="lb"><label for="w-${c.k}">${c.l}</label></div><input type="number" id="w-${c.k}" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.v}" inputmode="decimal"></div>`
    : `<div class="ctl"><div class="lb"><label for="w-${c.k}">${c.l}</label><output data-o="${c.k}"></output></div><input type="range" id="w-${c.k}" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.v}"></div>`).join("");
  el.innerHTML = `<div class="wdg"><div class="wdg-h"><span class="tag">Prova tu</span>${title}</div>${extra}<div class="ctls-2">${rows}</div><div class="out"></div><div class="viz"></div><p class="note"></p></div>`;
  const run = () => {
    const v = {};
    ctrls.forEach(c => {
      const inp = el.querySelector(`[data-k="${c.k}"]`);
      v[c.k] = parseFloat(String(inp.value).replace(",", ".")) || 0;
      const o = el.querySelector(`[data-o="${c.k}"]`);
      if (o) o.textContent = (c.f ? c.f(v[c.k]) : num(v[c.k], 2)) + (c.u ? " " + c.u : "");
    });
    update(v, el.querySelector(".out"), el.querySelector(".viz"), el.querySelector(".note"), el);
  };
  el.addEventListener("input", run);
  run();
  return run;
}

    ], (v, out, viz, note) => {
      const vm = 230 * Math.SQRT2, w = 2 * Math.PI * 50;
      const fs = [0, -120, -240].map(d => t => vm * Math.sin(w * t / 1000 + d * Math.PI / 180));
      const vals = fs.map(f => f(v.t));
      out.innerHTML = outs([["L1", num(vals[0], 0) + " V"], ["L2", num(vals[1], 0) + " V"], ["L3", num(vals[2], 0) + " V"], ["Somma", num(Math.abs(vals[0] + vals[1] + vals[2]) < 0.5 ? 0 : vals[0] + vals[1] + vals[2], 0) + " V", 1]]);
      viz.innerHTML = plot({ x: [0, 20], y: [-350, 350], xl: "tempo (ms)", yl: "v (V)", label: "Tensioni trifase",
        lines: fs.map((f, i) => ({ pts: sample(0, 20, f, 200), c: ["c-a", "c-b", "c-d"][i] })),
        marks: [{ x: v.t, t: "" }], dots: vals.map((y, i) => [v.t, y, ["accent", "volt", "lvl2"][i]]) })
        + legend([["accent", "L1"], ["volt", "L2 (−120°)"], ["lvl2", "L3 (−240°)"]]);
      note.textContent = "Muovi il cursore: in qualsiasi istante la somma delle tre tensioni è zero.";
    });
  },

  trasf(el) {
    makeWidget(el, "Trasformatore ideale", [
      { k: "V1", l: "Tensione primario V1 (V)", min: 1, max: 400000, step: 1, v: 230, t: "num" },
      { k: "N1", l: "Spire primario N1", min: 1, max: 100000, step: 1, v: 1150, t: "num" },
      { k: "N2", l: "Spire secondario N2", min: 1, max: 100000, step: 1, v: 60, t: "num" },
      { k: "I2", l: "Corrente del carico I2 (A)", min: 0, max: 10000, step: 0.1, v: 2, t: "num" }
    ], (v, out, viz, note) => {
      if (!v.N1 || !v.N2) { out.innerHTML = ""; note.textContent = "Inserisci un numero di spire maggiore di zero."; return; }
      const k = v.N1 / v.N2, V2 = v.V1 / k, I1 = v.I2 / k;
      out.innerHTML = outs([["Rapporto N1/N2", num(k, 2)], ["V2", eng(V2, "V"), 1], ["I1", eng(I1, "A"), 1], ["Potenza", eng(V2 * v.I2, "W")]]);
      note.textContent = k > 1 ? "Trasformatore abbassatore: la tensione scende, la corrente sul secondario è più alta." : k < 1 ? "Trasformatore elevatore: la tensione sale, la corrente sul secondario è più bassa." : "Rapporto 1:1: è un trasformatore di isolamento.";
    });
  }
};

/* ===========================================================
   VISTE
   =========================================================== */
const app = $("#app");
const lessonIndex = id => LESSONS.findIndex(l => l.id === id);

function updateProgress() {
  const n = LESSONS.filter(l => isDone(l.id)).length, pct = Math.round(n / LESSONS.length * 100);
  $("#bar").style.width = pct + "%";
  $("#mini-prog").textContent = `${n}/${LESSONS.length} lezioni`;
}

function viewHome() {
  const n = LESSONS.filter(l => isDone(l.id)).length, pct = Math.round(n / LESSONS.length * 100);
  const next = LESSONS.find(l => !isDone(l.id));
  const lvl = key => {
    const L = LEVELS[key], ls = LESSONS.filter(l => l.level === key), d = ls.filter(l => isDone(l.id)).length;
    return `<section class="level">
      <div class="level-h"><span class="pill" style="background:${L.color}">Livello ${L.n}</span><h2>${L.name}</h2><span class="cnt">${d}/${ls.length}</span></div>
      <p class="level-d">${L.desc}</p>
      ${ls.map(l => {
        const i = lessonIndex(l.id), sc = state.quiz[l.id];
        return `<a class="lcard${isDone(l.id) ? " is-done" : ""}" href="#l/${l.id}">
          <span class="num">${isDone(l.id) ? "✓" : i + 1}</span>
          <span class="txt"><b>${esc(l.title)}</b><span>${esc(l.sub)}</span></span>
          <span class="meta">${l.min} min${sc != null ? `<span class="sc">quiz ${sc}/${l.quiz.length}</span>` : ""}</span>
        </a>`;
      }).join("")}
    </section>`;
  };
  app.innerHTML = `<div class="view">
    <section class="hero">
      <p class="k">Corso di elettrotecnica</p>
      <h1>Dalla legge di Ohm al trifase</h1>
      <p>${LESSONS.length} lezioni brevi con esempi svolti, simulatori interattivi e un quiz alla fine di ognuna. I termini <a class="g" href="#" data-g="corrente">sottolineati</a> si toccano per leggerne la spiegazione.</p>
      <div class="prog-row">
        <div class="prog"><div class="t"><span>I tuoi progressi</span><span>${pct}%</span></div><div class="track"><i style="width:${pct}%"></i></div></div>
        ${next ? `<a class="btn primary" href="#l/${next.id}">${n ? "Continua" : "Inizia"}: lezione ${lessonIndex(next.id) + 1} →</a>` : `<span class="btn done">Corso completato 🎉</span>`}
      </div>
    </section>
    ${lvl("base")}${lvl("inter")}
    ${n ? `<p style="text-align:center"><button class="btn" id="reset">Azzera i progressi</button></p>` : ""}
  </div>`;
  const r = $("#reset");
  if (r) r.onclick = () => { if (confirm("Vuoi davvero azzerare progressi e risultati dei quiz?")) { state = { done: [], quiz: {} }; store.save(state); updateProgress(); viewHome(); } };
}

function viewLesson(id) {
  const i = lessonIndex(id), l = LESSONS[i];
  if (!l) return viewHome();
  const L = LEVELS[l.level], prev = LESSONS[i - 1], next = LESSONS[i + 1];
  app.innerHTML = `<article class="view">
    <header class="l-head">
      <p class="k" style="color:${L.color}">Lezione ${i + 1} · ${L.name} · ${l.min} min</p>
      <h1>${esc(l.title)}</h1>
      <p>${esc(l.sub)}</p>
      <div class="goals"><b>In questa lezione</b><ul>${l.goals.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>
    </header>
    <div class="content">${linkTerms(l.body)}</div>
    <section class="quiz content" id="quiz"><h2>Verifica</h2><div id="qres"></div>${l.quiz.map((q, qi) => `
      <div class="q" data-q="${qi}"><p class="qt"><span>${qi + 1}.</span>${esc(q.q)}</p>
      <div class="opts">${q.o.map((o, oi) => `<button class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    </section>
    <div class="l-foot">
      <button class="btn${isDone(id) ? " done" : ""}" id="mark">${isDone(id) ? "✓ Completata" : "Segna come completata"}</button>
      <span class="sp"></span>
      ${next ? `<a class="btn primary" href="#l/${next.id}">Lezione successiva →</a>` : `<a class="btn primary" href="#">Torna alle lezioni</a>`}
    </div>
    <nav class="pn">
      ${prev ? `<a href="#l/${prev.id}"><span>← Precedente</span><b>${esc(prev.title)}</b></a>` : ""}
      ${next ? `<a class="nx" href="#l/${next.id}"><span>Successiva →</span><b>${esc(next.title)}</b></a>` : ""}
    </nav>
  </article>`;

  app.querySelectorAll("[data-w]").forEach(el => WIDGETS[el.dataset.w] && WIDGETS[el.dataset.w](el));

  const mark = $("#mark");
  const paintMark = () => { mark.className = "btn" + (isDone(id) ? " done" : ""); mark.textContent = isDone(id) ? "✓ Completata" : "Segna come completata"; };
  mark.onclick = () => { setDone(id, !isDone(id)); paintMark(); };

  let answered = 0, right = 0;
  $("#quiz").addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b) return;
    const box = b.closest(".q"), q = l.quiz[+box.dataset.q], pick = +b.dataset.o, ok = pick === q.a;
    box.querySelectorAll(".opt").forEach((o, oi) => { o.disabled = true; if (oi === q.a) o.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    box.insertAdjacentHTML("beforeend", `<p class="why${ok ? "" : " no"}"><b>${ok ? "Esatto!" : "Non proprio."}</b> ${esc(q.w)}</p>`);
    answered++; if (ok) right++;
    if (answered === l.quiz.length) {
      state.quiz[id] = Math.max(state.quiz[id] || 0, right);
      if (right === l.quiz.length && !isDone(id)) { setDone(id, true); paintMark(); }
      store.save(state);
      $("#qres").innerHTML = `<div class="qres"><b>${right} / ${l.quiz.length}</b>${right === l.quiz.length ? "Perfetto: lezione completata!" : "Rileggi le parti che ti hanno messo in difficoltà e riprova."}
        <div style="margin-top:.6rem"><button class="btn" id="retry">Rifai il quiz</button></div></div>`;
      $("#retry").onclick = () => { viewLesson(id); $("#quiz").scrollIntoView(); };
      $("#qres").scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });
}

function viewFormule() {
  const title = id => LESSONS[lessonIndex(id)].title;
  app.innerHTML = `<div class="view">
    <header class="page-h"><h1>Formulario</h1><p>Tutte le formule del corso in un posto solo. Tocca «lezione» per ripassare da dove vengono.</p></header>
    ${FORMULAS.map(gr => `<section class="fgroup"><h2>${gr.g}</h2>${gr.items.map(([f, d, id]) => `
      <div class="frow"><span class="fx">${esc(f)}</span><span class="fd">${esc(d)} · <a href="#l/${id}" title="${esc(title(id))}">lezione ${lessonIndex(id) + 1}</a></span></div>`).join("")}</section>`).join("")}
  </div>`;
}

function viewGlossario() {
  const keys = Object.keys(GLOSSARY).sort((a, b) => GLOSSARY[a][0].localeCompare(GLOSSARY[b][0], "it"));
  app.innerHTML = `<div class="view">
    <header class="page-h"><h1>Glossario</h1><p>${keys.length} termini spiegati in parole semplici.</p></header>
    <input class="search" id="gq" type="search" placeholder="Cerca un termine…" aria-label="Cerca nel glossario">
    <div id="gl"></div>
  </div>`;
  const draw = q => {
    const n = q.trim().toLowerCase();
    const ks = keys.filter(k => !n || GLOSSARY[k][0].toLowerCase().includes(n) || GLOSSARY[k][1].toLowerCase().includes(n));
    $("#gl").innerHTML = ks.length ? ks.map(k => `<div class="gi"><b>${esc(GLOSSARY[k][0])}</b><p>${esc(GLOSSARY[k][1])}</p></div>`).join("") : `<div class="empty">Nessun termine trovato.</div>`;
  };
  $("#gq").addEventListener("input", e => draw(e.target.value));
  draw("");
}

/* ===========================================================
   FOGLIO DEL GLOSSARIO E ROUTING
   =========================================================== */
function openSheet(k) {
  const e = GLOSSARY[k]; if (!e) return;
  $("#sheet-t").textContent = e[0]; $("#sheet-d").textContent = e[1];
  $("#sheet").classList.add("open"); $("#sheet-bg").classList.add("open");
  $("#sheet-x").focus();
}
function closeSheet() { $("#sheet").classList.remove("open"); $("#sheet-bg").classList.remove("open"); }
document.addEventListener("click", e => {
  const g = e.target.closest(".g[data-g]");
  if (g) { e.preventDefault(); openSheet(g.dataset.g); }
});
$("#sheet-x").onclick = closeSheet;
$("#sheet-bg").onclick = closeSheet;
$("#sheet-all").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function route() {
  const h = location.hash.replace(/^#/, "");
  const inLesson = h.startsWith("l/");
  document.body.classList.toggle("in-lesson", inLesson);
  const tab = inLesson || !h ? "lezioni" : h;
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (inLesson) viewLesson(h.slice(2));
  else if (h === "formule") viewFormule();
  else if (h === "glossario") viewGlossario();
  else viewHome();
  const l = inLesson && LESSONS[lessonIndex(h.slice(2))];
  document.title = l ? l.title + " — Elettrotecnica" : "Elettrotecnica";
  closeSheet();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
updateProgress();
route();
</script>
</body>
</html>
