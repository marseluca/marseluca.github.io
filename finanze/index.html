<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Finanze personali</title>
<meta name="description" content="Patrimonio, conti e andamento mese per mese." />
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="finanze.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Finanze" />
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png" />
<link rel="icon" href="icone/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icone/icon-192.png" sizes="192x192" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --sfondo: #f7f8fa;
    --superficie: #ffffff;
    --superficie-2: #f2f4f7;
    --testo: #0f1419;
    --tenue: #5f6b7a;
    --fioco: #677283;
    --linea: #e7eaef;
    --linea-forte: #d6dbe3;
    --ombra: 0 1px 2px rgba(15,20,25,.04), 0 8px 24px -16px rgba(15,20,25,.22);
    --ombra-alta: 0 2px 6px rgba(15,20,25,.06), 0 18px 40px -22px rgba(15,20,25,.3);
    --positivo: #0f8a4d;
    --negativo: #c4382c;

    --c-tutto: #334155;
    --c-liquidita: #2563eb;
    --c-immobilizzato: #0d9488;
    --c-debito: #dc2626;
    --c-btc: #ef8f1c;

    --su-tinta: #ffffff;

    --r: 14px;
    --r-g: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --sfondo: #101418;
      --superficie: #181d23;
      --superficie-2: #212830;
      --testo: #e9edf2;
      --tenue: #9aa6b4;
      --fioco: #8b97a6;
      --linea: #262d36;
      --linea-forte: #333c47;
      --ombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
      --ombra-alta: 0 2px 6px rgba(0,0,0,.4), 0 18px 40px -22px rgba(0,0,0,.7);
      --positivo: #3ddc84;
      --negativo: #ff8a7a;

      --c-tutto: #94a3b8;
      --c-liquidita: #60a5fa;
      --c-immobilizzato: #2dd4bf;
      --c-debito: #f87171;
      --c-btc: #fbbf24;
      --su-tinta: #0f1419;
    }
  }

  * { box-sizing: border-box; }
  /* l'attributo hidden perde contro qualunque display dichiarato nel foglio:
     senza questa riga i chip nascosti restano in pagina */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sfondo);
    color: var(--testo);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-variant-numeric: tabular-nums; }

  /* I saldi complessivi non si vedono finché non si chiede: la pagina si apre
     spesso dove qualcuno può guardare. La scelta resta registrata. */
  .fila-cifrone { display: flex; align-items: center; gap: 10px; }
  .occhio {
    flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--linea); background: var(--superficie); color: var(--tenue);
  }
  .occhio svg { width: 19px; height: 19px; }
  .occhio:hover { color: var(--testo); border-color: var(--fioco); }
  .occhio:focus-visible { outline: 2px solid var(--tinta, var(--testo)); outline-offset: 2px; }
  .occhio[aria-pressed="true"] .sbarra { display: none; }
  .nascosto { letter-spacing: .08em; color: var(--tenue); }

  /* ---------- barra in alto ---------- */
  .barra {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--sfondo) 86%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--linea);
    padding: max(10px, env(safe-area-inset-top)) 0 10px;
  }
  .barra-dentro {
    max-width: 720px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; gap: 10px; position: relative;
  }
  .marchio {
    display: flex; align-items: center; gap: 9px;
    font-weight: 600; font-size: 15px; letter-spacing: -.01em; flex: 1; min-width: 0;
  }
  .marchio .segno {
    width: 26px; height: 26px; flex: none; border-radius: 8px;
    background: linear-gradient(140deg, var(--c-liquidita), var(--c-immobilizzato));
    color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700;
  }
  .marchio .riassunto {
    font-weight: 600; font-size: 14px; margin-left: 2px;
    opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s;
  }
  .barra.compatta .marchio .riassunto { opacity: 1; transform: none; }
  .marchio .nome-app { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra.compatta .marchio .nome-app { display: none; }

  .passi { display: flex; align-items: center; gap: 2px; flex: none; }
  .passi button {
    width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--tenue);
    font-size: 17px; line-height: 1; display: grid; place-items: center;
  }
  .passi button:hover:not(:disabled) { background: var(--superficie-2); color: var(--testo); }
  .passi button:disabled { opacity: .3; cursor: default; }
  .passi .mese-ora {
    min-width: 136px; white-space: nowrap; text-align: center; font-weight: 600; font-size: 14px;
    padding: 5px 8px; border-radius: 9px; cursor: pointer; position: relative;
    border: 1px solid transparent; background: transparent; color: var(--testo);
    text-transform: capitalize;
  }
  .passi .mese-ora:hover { background: var(--superficie-2); }
  .passi .mese-ora input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; border: 0;
  }

  main { max-width: 720px; margin: 0 auto; padding: 18px 16px 72px; }

  /* ---------- sommario ---------- */
  .sommario { margin: 6px 0 20px; }
  .occhiello {
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--fioco); margin-bottom: 6px;
  }
  .cifrone {
    font-size: clamp(34px, 9vw, 46px); font-weight: 700; letter-spacing: -.03em;
    line-height: 1.05; word-break: break-word;
  }
  .riga-chip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 999px;
    background: var(--superficie-2); color: var(--tenue); border: 1px solid transparent;
  }
  .chip.su { color: var(--positivo); background: color-mix(in srgb, var(--positivo) 12%, transparent); }
  .chip.giu { color: var(--negativo); background: color-mix(in srgb, var(--negativo) 12%, transparent); }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: var(--linea-forte); }
  .chip.azione { color: var(--testo); background: var(--superficie); box-shadow: var(--ombra); }

  /* ---------- torta della composizione ---------- */
  .torta-zona {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 18px 18px 16px; justify-content: center;
  }
  .torta { width: 190px; flex: none; }
  .torta svg { display: block; width: 100%; height: auto; overflow: visible; }
  .torta .fetta { cursor: pointer; transition: opacity .15s; }
  .torta .fetta:hover { opacity: .78; }
  /* le scritte al centro non devono rubare il clic alle fette */
  .torta .centro-eti, .torta .centro-val { pointer-events: none; }
  .torta .centro-eti { fill: var(--fioco); font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .torta .centro-val { fill: var(--testo); font-size: 17px; font-weight: 700; }
  .torta-nota { flex: 1; min-width: 180px; font-size: 13px; color: var(--tenue); line-height: 1.6; }
  .torta-nota b { color: var(--testo); font-weight: 600; }
  .torta-nota .debito { color: var(--c-debito); font-weight: 600; }

  /* ---------- tasto e tendina del nuovo conto ---------- */
  .tondo {
    width: 32px; height: 32px; flex: none; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--linea-forte); background: var(--superficie); color: var(--tenue);
    font-size: 19px; line-height: 1; display: grid; place-items: center; padding: 0;
  }
  .tondo:hover { color: var(--testo); border-color: var(--tenue); }
  .tondo[aria-expanded="true"] { background: var(--testo); border-color: var(--testo); color: var(--sfondo); }

  .tendina {
    position: absolute; top: calc(100% + 6px); left: 16px; z-index: 50;
    width: min(420px, calc(100vw - 32px));
    background: var(--superficie); border: 1px solid var(--linea);
    border-radius: var(--r-g); box-shadow: var(--ombra-alta);
  }
  .tendina[hidden] { display: none; }
  .tendina-dentro { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .tendina-titolo { font-size: 13px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--fioco); }
  .tendina .fila { display: flex; gap: 8px; }


  /* ---------- scelta della scheda ---------- */
  .pillole { display: flex; align-items: center; gap: 8px; margin: 20px 0 18px; flex-wrap: wrap; }

  /* La tendina è un <select> vero: tastiera, lettori di schermo e la rotella
     del telefono vengono con lui. Il pallino accanto porta il colore
     dell'etichetta scelta, che dentro un <option> non si può disegnare. */
  .tendina-scheda {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--linea); background: var(--superficie);
    border-radius: 999px; padding: 0 30px 0 14px; cursor: pointer;
  }
  .tendina-scheda:hover { border-color: var(--linea-forte); }
  .tendina-scheda:focus-within { border-color: var(--tinta); }
  .tendina-scheda .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--tinta); flex: none; }
  .tendina-scheda select {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--testo);
    padding: 9px 0; max-width: 60vw; text-overflow: ellipsis;
  }
  .tendina-scheda select:focus { outline: none; }
  .tendina-scheda .freccia-giu {
    position: absolute; right: 13px; color: var(--fioco); font-size: 12px; pointer-events: none;
  }
  /* quando comanda il wallet, la tendina non è quella che decide cosa si vede */
  .tendina-scheda.spenta { opacity: .5; }

  .pillole button {
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--linea); background: var(--superficie); color: var(--tenue);
    font: inherit; font-size: 13.5px; font-weight: 500;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
  }
  .pillole button .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--tinta); flex: none; }
  .pillole button:hover { color: var(--testo); border-color: var(--linea-forte); }
  .pillole button.on {
    color: var(--su-tinta); background: var(--tinta); border-color: var(--tinta); font-weight: 600;
  }
  .pillole button.on .punto { background: color-mix(in srgb, var(--su-tinta) 85%, transparent); }

  /* ---------- schede ---------- */
  .scheda {
    background: var(--superficie); border: 1px solid var(--linea);
    border-radius: var(--r-g); box-shadow: var(--ombra); margin-bottom: 14px;
  }
  .scheda > .intestazione {
    display: flex; align-items: center; gap: 10px;
    padding: 15px 18px; border-bottom: 1px solid var(--linea);
  }
  .scheda > .intestazione h2 {
    margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; color: var(--fioco); flex: 1;
  }
  .corpo { padding: 16px 18px; }
  .corpo.stretto { padding: 10px 14px 14px; }

  /* ---------- elenco delle categorie ---------- */
  .gruppo-eti + .gruppo-eti { border-top: 1px solid var(--linea); }
  .gruppo-eti .voce-cat { border-top: 0; padding-bottom: 6px; }
  .sotto-cat { padding: 0 18px 12px 42px; }
  .riga-cat {
    display: flex; align-items: baseline; gap: 10px;
    padding: 4px 0; font-size: 13.5px; color: var(--tenue);
  }
  .riga-cat .nome { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .riga-cat .valore { flex: none; color: var(--testo); font-weight: 600; }

  .voce-cat {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 18px; background: transparent; border: 0; border-top: 1px solid var(--linea);
    font: inherit; color: inherit; cursor: pointer; text-align: left;
  }
  .voce-cat:first-child { border-top: 0; }
  .voce-cat:hover { background: var(--superficie-2); }
  .voce-cat .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--tinta); flex: none; }
  .voce-cat .testo { flex: 1; min-width: 0; }
  .voce-cat .titolo-cat { font-weight: 500; }
  .voce-cat .sotto { font-size: 12.5px; color: var(--fioco); }
  .voce-cat .valore { font-weight: 600; white-space: nowrap; }
  .voce-cat .freccia { color: var(--fioco); font-size: 15px; }

  /* ---------- conti ---------- */
  /* Più strette in verticale delle altre schede: di queste ce n'è una fila, e
     ogni riga porta già il nome sopra e l'importo sotto. */
  .scheda.conto { margin-bottom: 10px; }
  .conto > .intestazione { padding-top: 10px; padding-bottom: 10px; }
  .conto .riga { padding-top: 6px; padding-bottom: 6px; row-gap: 0; }
  .conto .riga .soldi { padding-top: 4px; padding-bottom: 4px; }
  .conto .indirizzo { padding-top: 8px; padding-bottom: 8px; }
  .conto .piede-scheda { padding-top: 9px; padding-bottom: 9px; }
  .conto .stato { padding: 18px; }
  .conto > .intestazione { border-bottom: 1px solid var(--linea); flex-wrap: wrap; row-gap: 2px; }

  .conto > .intestazione .nome-conto { order: 2; flex: 1 1 auto; }
  .conto > .intestazione .etichetta-tipo { order: 2; }
  /* l'a capo serve a mandare la cifra sotto il nome, liberandogli tutta la
     riga. Senza cifra non c'è niente da mandare giù, e l'unico effetto
     sarebbe lasciare il cestino da solo su una riga vuota. */
  .conto > .intestazione.con-cifra::after { content: ""; flex: 1 0 100%; height: 0; order: 3; }
  .conto > .intestazione .tot-conto { order: 4; margin-left: auto; }
  .conto > .intestazione .soldi { order: 4; margin-left: auto; }
  .conto > .intestazione .valuta { order: 5; }
  .conto > .intestazione .bottoncino { order: 6; }
  /* scheda di una riga sola: sotto non c'è niente, il bordo resterebbe appeso */
  .conto > .intestazione:last-child { border-bottom: 0; }
  /* il colore della categoria come striscia a sinistra. Disegnata come sfondo e
     non come bordo: il bordo seguirebbe l'arrotondamento e verrebbe una
     mezzaluna, e in più toglierebbe larghezza al nome del conto. */
  .scheda.conto {
    background-image: linear-gradient(var(--tinta), var(--tinta));
    background-size: 3px 100%;
    background-repeat: no-repeat;
    background-position: left top;
  }
  .conto .nome-conto {
    flex: 1; min-width: 60px; border: 0; background: transparent; color: var(--testo);
    font: inherit; font-size: 16px; font-weight: 600; letter-spacing: -.01em;
    padding: 3px 6px; margin-left: -6px; border-radius: 7px;
  }
  /* il titolo del wallet: stessa riga e stesso peso del campo che sostituisce */
  .conto .nome-conto.fisso {
    border: 0; background: transparent; text-align: left;
    display: inline-flex; align-items: center; gap: 6px;
  }
  /* stretto sul testo: allargato a tutta la riga, l'alone del passaggio del
     mouse diventava una barra grigia larga quanto la scheda */
  .conto .nome-conto.apre { cursor: pointer; flex: 0 1 auto; }
  .conto .nome-conto.apre .freccia { color: var(--fioco); font-size: 15px; }
  .conto .nome-conto.apre:hover { color: var(--tinta); }
  .conto .nome-conto.apre:hover .freccia { color: var(--tinta); }
  .conto .nome-conto:hover { background: var(--superficie-2); }
  .conto .nome-conto:focus { outline: 2px solid var(--tinta); outline-offset: 0; background: var(--superficie); }
  .conto .tot-conto { font-weight: 700; white-space: nowrap; font-size: 16px; }
  .conto > .intestazione .soldi { margin-right: -4px; }
  .conto.negativo .tot-conto { color: var(--negativo); }
  .etichetta-tipo {
    font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    color: var(--tinta); background: color-mix(in srgb, var(--tinta) 13%, transparent);
    padding: 3px 8px; border-radius: 6px; flex: none;
  }

  /* nome su una riga e importo su quella sotto, allineato a destra: in fila
     i nomi lunghi venivano tagliati dall'importo */
  .riga {
    display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap;
    padding: 11px 18px; border-top: 1px solid var(--linea);
  }
  .riga .etichetta, .riga .etichetta-fissa { flex: 1 1 auto; order: 1; }
  .riga::after { content: ""; flex: 1 0 100%; height: 0; order: 2; }
  .riga .soldi { order: 3; margin-left: auto; }
  .riga .valuta { order: 4; }
  .riga .tot-conto { order: 3; margin-left: auto; }
  .riga .bottoncino { order: 5; }
  .riga:first-child { border-top: 0; }
  .riga .etichetta {
    flex: 1; min-width: 50px; border: 0; background: transparent; color: var(--testo);
    font: inherit; padding: 5px 6px; margin-left: -6px; border-radius: 7px;
  }
  .riga .etichetta:hover { background: var(--superficie-2); }
  .riga .etichetta:focus { outline: 2px solid var(--tinta); background: var(--superficie); }
  .riga .etichetta-fissa { flex: 1; color: var(--tenue); }

  /* l'importo sembra testo finché non lo tocchi: meno rumore sullo schermo */
  .soldi {
    width: 132px; flex: none; text-align: right; font: inherit; font-size: 16px;
    font-weight: 600; font-variant-numeric: tabular-nums; color: var(--testo);
    border: 1px solid transparent; background: transparent;
    border-radius: 9px; padding: 7px 10px;
  }
  .soldi:hover { background: var(--superficie-2); }
  .soldi:focus { outline: none; border-color: var(--tinta); background: var(--superficie); }
  .soldi::placeholder { color: var(--fioco); font-weight: 500; }
  .soldi.riportato { color: var(--fioco); font-weight: 500; }
  .valuta { color: var(--fioco); font-size: 13px; flex: none; width: 10px; }

  .segna {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--tinta); opacity: .55;
  }
  .segna.vuoto { background: transparent; }

  .bottoncino {
    width: 30px; height: 30px; flex: none; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--fioco);
    font-size: 16px; line-height: 1; display: grid; place-items: center;
  }
  .bottoncino:hover { background: var(--superficie-2); color: var(--negativo); }

  /* conferma di eliminazione al posto della finestra del browser */
  .conferma {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 18px; border-top: 1px solid var(--linea);
    background: color-mix(in srgb, var(--negativo) 7%, transparent);
    font-size: 13.5px;
  }
  .conferma .dice { flex: 1; min-width: 150px; color: var(--testo); }
  .conferma button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .conferma .annulla { border: 1px solid var(--linea-forte); background: var(--superficie); color: var(--testo); }
  .conferma .via { border: 1px solid var(--negativo); background: var(--negativo); color: var(--su-tinta); font-weight: 600; }

  .piede-scheda {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 12px 18px; border-top: 1px solid var(--linea);
  }
  .mini {
    font: inherit; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 9px;
    border: 1px solid var(--linea); background: var(--superficie); color: var(--tenue); cursor: pointer;
  }
  .mini:hover { color: var(--tinta); border-color: var(--tinta); }
  .mini.pieno { background: var(--tinta); border-color: var(--tinta); color: var(--su-tinta); }
  .mini.pieno:hover { filter: brightness(1.08); color: var(--su-tinta); }

  .avvertenza {
    font-size: 12.5px; color: var(--tenue); line-height: 1.55;
    padding: 0 18px 14px;
  }
  .avvertenza.attenzione { color: var(--c-btc); }

  /* ---------- indirizzi bitcoin ---------- */

  .mesi-mano { padding: 10px 18px 12px; border-top: 1px solid var(--linea); }

  .riga-mese { display: flex; align-items: center; gap: 10px; padding: 3px 0; }

  /* ---------- grafici ---------- */

  .periodi { display: flex; flex-wrap: wrap; gap: 5px; padding: 12px 18px 0; }

  /* su telefono i campi sotto i 16px fanno ingrandire la pagina a ogni tocco */

    /* il padding serve all'alone del fuoco, i margini negativi lo restituiscono

</style>

<body>

<script>
const $ = id => document.getElementById(id);
const G = 86400e3;

/* Solo investimenti e wallet digitali hanno sottoconti: un conto in banca è
   già di per sé un conto, e sta su una riga sola. */
/* Le categorie le scrive chi usa la pagina: qui restano solo le tre etichette
   con cui si raggruppano, e il segno che portano nei totali. */
const ETICHETTE = {
  liquidita:     { nome: "Liquidità" },
  immobilizzato: { nome: "Immobilizzato" },
  debito:        { nome: "Debito", segno: -1 }
};
const ORDINE = Object.keys(ETICHETTE);
const ETICHETTA_PREDEFINITA = "liquidita";
// il wallet bitcoin ha un nome fisso: è l'unico conto che non si rinomina
const NOME_BTC = "Wallet BTC";
const nomeEtichetta = e => (ETICHETTE[e] || ETICHETTE[ETICHETTA_PREDEFINITA]).nome;
const segnoEtichetta = e => (ETICHETTE[e] || {}).segno || 1;
// la tinta segue l'etichetta; il wallet bitcoin tiene la sua, come scheda a parte
/* Una "scheda" è "tutto", un'etichetta, o un conto per id: quest'ultimo è la
   pagina del singolo conto, col suo saldo e il suo andamento. */
const tintaConto = c => c.btc ? "var(--c-btc)" : `var(--c-${ETICHETTE[c.etichetta] ? c.etichetta : ETICHETTA_PREDEFINITA})`;
const tintaDi = t => {
  const c = stato.conti && stato.conti.find(x => x.id === t);
  if (c) return tintaConto(c);
  return `var(--c-${ETICHETTE[t] ? t : ETICHETTA_PREDEFINITA})`;
};

/* ---------- stato ---------- */
/* Tutto resta nel browser: i saldi sono dati personali e non hanno motivo di
   uscire da questo dispositivo. Struttura:
     conti: [{ id, nome, etichetta, voci: [{id, nome}], btc: true, indirizzi: [{addr}] }]
     saldi: { "2026-11": { "<idVoce>": importo } }
   La chiave si chiama ancora "conti" per i dati già salvati, ma dentro ci sono
   le categorie: ognuna ha un'etichetta fra le tre e i suoi sottoconti, e il
   saldo sta sempre su un sottoconto, mai sulla categoria. Quella del wallet
   bitcoin fa eccezione: porta btc:true, non ha sottoconti e il saldo lo legge
   dalla blockchain.
     previsioni: [...]
   Le previsioni non si vedono più in pagina: la scheda che le mostrava è stata
   tolta per ripensarla, e i dati restano dove sono perché tornino con lei.
   Un mese senza un importo per una voce eredita l'ultimo inserito prima di
   quel mese: in un registro mensile un conto che non cambia non si riscrive. */
const CHIAVE_STATO = "finanze_v1";
let stato = carica();

function carica() {
  try {
    const s = JSON.parse(localStorage.getItem(CHIAVE_STATO));
    if (s && Array.isArray(s.conti)) {
      return { conti: s.conti, saldi: s.saldi || {}, previsioni: s.previsioni || [] };
    }
  } catch (_) { /* stato illeggibile: si riparte puliti */ }
  return { conti: [], saldi: {}, previsioni: [] };
}
function salva() {
  try { localStorage.setItem(CHIAVE_STATO, JSON.stringify(stato)); }
  catch (_) { avvisa("Non riesco a salvare: lo spazio del browser è pieno o bloccato."); }
}
const nuovoId = () => "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* Due migrazioni dei dati già salvati, entrambe eseguite una volta sola.

   I titoli del MOT erano sottoconti speciali con nominale e prezzo sotto le
   chiavi "<id>#n" e "<id>#p": diventano sottoconti normali che portano il
   valore già calcolato, mese per mese.

   Banca, contanti, cauzione e debiti avevano sottoconti e ora no: i loro saldi
   vengono sommati nel conto, sempre mese per mese, prima di buttare via le
   vecchie chiavi. Senza questi passaggi i numeri già inseriti resterebbero
   nello storage senza più nessuno che li legge. */
function migraTitoli() {
  let toccati = 0;
  for (const c of stato.conti) {
    if (!Array.isArray(c.titoli) || !c.titoli.length) continue;
    c.voci = c.voci || [];
    for (const t of c.titoli) {
      const chiaveN = t.id + "#n", chiaveP = t.id + "#p";
      const mesi = Object.keys(stato.saldi)
        .filter(m => typeof stato.saldi[m][chiaveN] === "number" || typeof stato.saldi[m][chiaveP] === "number")
        .sort();
      for (const m of mesi) {
        stato.saldi[m][t.id] = valoreVoce(chiaveN, m).valore * valoreVoce(chiaveP, m).valore / 100;
      }
      for (const m of Object.keys(stato.saldi)) {
        delete stato.saldi[m][chiaveN];
        delete stato.saldi[m][chiaveP];
        if (!Object.keys(stato.saldi[m]).length) delete stato.saldi[m];
      }
      c.voci.push({ id: t.id, nome: t.nome });
      toccati++;
    }
    delete c.titoli;
  }
  delete stato.catalogo;
  return toccati;
}


/* I sette tipi fissi diventano categorie con un'etichetta. Nomi e saldi non si
   toccano: il conto che prima stava dentro "Banca" adesso è lui la categoria,
   e quello che prima era il suo importo diventa il suo primo sottoconto, con lo
   stesso id, così tutti i mesi già scritti continuano a valere. */
const ETICHETTA_DEL_TIPO = {
  banca: "liquidita", contanti: "liquidita", digitale: "liquidita", btc: "liquidita",
  cauzione: "immobilizzato", investimenti: "immobilizzato",
  debiti: "debito"
};

function migraEtichette() {
  let toccati = 0;
  for (const c of stato.conti) {
    if (ETICHETTE[c.etichetta] && !("tipo" in c)) continue;
    const vecchio = c.tipo;
    if (!ETICHETTE[c.etichetta]) c.etichetta = ETICHETTA_DEL_TIPO[vecchio] || ETICHETTA_PREDEFINITA;
    if (vecchio === "btc") c.btc = true;
    // i tipi senza sottoconti portavano l'importo sotto l'id della categoria
    if (!c.btc && !(Array.isArray(c.voci) && c.voci.length)) c.voci = [{ id: c.id, nome: c.nome }];
    delete c.tipo;
    toccati++;
  }
  return toccati;
}

/* Migrando i vecchi tipi ho dato al primo sottoconto il nome della categoria:
   adesso che la riga si vede sempre, quel nome compariva due volte di seguito.
   Lo cambio solo dove è esattamente quel caso, cioè dove l'ho scritto io. */
function sganciaNomiRipetuti() {
  let toccati = 0;
  for (const c of stato.conti) {
    if (c.btc || !Array.isArray(c.voci) || c.voci.length !== 1) continue;
    if (c.voci[0].nome !== c.nome) continue;
    c.voci[0].nome = "Saldo";
    toccati++;
  }
  return toccati;
}

/* Un'etichetta che non esiste farebbe sbagliare ogni totale e lascerebbe la
   pagina bianca, senza modo di rimediare: i dati sono solo qui dentro. */
function sanaTipi() {
  let toccati = 0;
  for (const c of stato.conti) {
    if (ETICHETTE[c.etichetta]) continue;
    c.etichetta = ETICHETTA_PREDEFINITA;
    toccati++;
  }
  return toccati;
}

function migra() {

/* ---------- mesi ---------- */
const chiaveMese = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const dataMese = k => { const [a, m] = k.split("-").map(Number); return new Date(a, m - 1, 1); };
const fineMese = k => { const [a, m] = k.split("-").map(Number); return new Date(a, m, 1).getTime() - 1; };
const spostaMese = (k, n) => { const d = dataMese(k); d.setMonth(d.getMonth() + n); return chiaveMese(d); };
const etichettaMese = k => dataMese(k).toLocaleDateString("it-IT", { month: "long", year: "numeric" });
const etichettaBreve = k => dataMese(k).toLocaleDateString("it-IT", { month: "short", year: "numeric" });

/* La scelta di mostrare i saldi vive fuori dai dati: è una preferenza di questo
   dispositivo, non un numero da conservare. Alla prima apertura sono nascosti. */
const CHIAVE_OCCHIO = "finanze_occhio";
let saldiVisibili = false;
try { saldiVisibili = localStorage.getItem(CHIAVE_OCCHIO) === "1"; } catch (e) {}
const PALLINI = "••••";

/* ---------- importi ---------- */
// accetta sia "1.234,56" sia "1234.56": l'ultimo separatore è quello decimale
function leggiImporto(testo) {
  let t = String(testo).trim().replace(/[^\d.,-]/g, "");
  if (!t || t === "-") return null;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "");
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, "");
  const v = parseFloat(t.replace(",", "."));
  return isFinite(v) ? Math.round(v) : null;
}
/* Gli euro si scrivono senza centesimi: a queste cifre i decimali sono rumore.
   Per l'italiano il CLDR non raggruppa le quattro cifre (1234): sui soldi però
   si scrive 1.234, come su qualsiasi estratto conto, quindi forzo il separatore. */
const SOLDI = {
  style: "currency", currency: "EUR", useGrouping: "always",
  minimumFractionDigits: 0, maximumFractionDigits: 0
};
const fmtEur = v => v.toLocaleString("it-IT", SOLDI);
const fmtEur0 = fmtEur;
const fmtNum = v => Math.round(v).toLocaleString("it-IT", { maximumFractionDigits: 0, useGrouping: "always" });
const fmtBtc = sats => (sats / 1e8).toLocaleString("it-IT", { minimumFractionDigits: 8, maximumFractionDigits: 8 });
// l'ultimo separatore è il decimale, come per gli euro, ma qui non si arrotonda
function leggiBtc(testo) {
  let t = String(testo).trim().replace(/[^\d.,]/g, "");
  if (!t) return null;
  const ultimo = Math.max(t.lastIndexOf(","), t.lastIndexOf("."));
  if (ultimo >= 0) t = t.slice(0, ultimo).replace(/[.,]/g, "") + "." + t.slice(ultimo + 1).replace(/[.,]/g, "");
  const v = parseFloat(t);
  return isFinite(v) && v >= 0 ? Math.round(v * 1e8) : null;
}
const fmtAsse = v => Math.abs(v) >= 1000
  ? "€ " + (v / 1000).toLocaleString("it-IT", { maximumFractionDigits: 1 }) + "k"
  : "€ " + Math.round(v);

/* ---------- lettura dei saldi ---------- */
const mesiConDati = () => Object.keys(stato.saldi).sort();

/* Il saldo sta sempre su un sottoconto, mai sulla categoria: così aggiungerne
   un secondo non sposta da nessuna parte l'importo già scritto. La categoria
   del wallet bitcoin non ne ha: il suo saldo arriva dalla blockchain. */
function vociDi(c) {
  return c.btc ? [] : (c.voci || []);
}

function valoreVoce(voceId, m) {
  const riga = stato.saldi[m];
  if (riga && typeof riga[voceId] === "number") return { valore: riga[voceId], ereditato: false };
  const prima = mesiConDati().filter(k => k < m);
  for (let i = prima.length - 1; i >= 0; i--) {
    const v = stato.saldi[prima[i]][voceId];
    if (typeof v === "number") return { valore: v, ereditato: true };
  }
  return { valore: 0, ereditato: false, vuoto: true };
}

function totaleConto(c, m) {
  if (c.btc) return segnoEtichetta(c.etichetta) * valoreBtc(c, m);
  const somma = vociDi(c).reduce((s, v) => s + valoreVoce(v.id, m).valore, 0);
  return segnoEtichetta(c.etichetta) * somma;
}

/* "tutto" sono tutte le categorie, un'etichetta sono le sue, un id è il
   singolo conto di quell'id. */
function contiDi(t) {
  if (t === "tutto") return stato.conti;
  const solo = stato.conti.find(c => c.id === t);
  if (solo) return [solo];
  return stato.conti.filter(c => c.etichetta === t);
}
const contoDelTab = () => stato.conti.find(c => c.id === tab) || null;
const totaleDi = (t, m) => contiDi(t).reduce((s, c) => s + totaleConto(c, m), 0);
const totaleMese = m => totaleDi("tutto", m);

const distanzaMesi = (a, b) => {
  const [aa, am] = a.split("-").map(Number), [ba, bm] = b.split("-").map(Number);
  return (ba - aa) * 12 + (bm - am);
};

/* I mesi che il grafico può disegnare: dal primo in cui questa scheda ha un
   saldo scritto fino a oggi. I wallet bitcoin portano anche i mesi che hanno
   ricostruito da soli dalla catena. */
function mesiDelGrafico(scopo) {
  const conti = contiDi(scopo);
  const chiavi = new Set();
  conti.forEach(c => {
    vociDi(c).forEach(v => chiavi.add(v.id));
    if (c.btc) chiavi.add(chiaveBtc(c.id));
  });

  let primo = mesiConDati().find(m => Object.keys(stato.saldi[m]).some(k => chiavi.has(k))) || null;
  conti.forEach(c => {
    const d = btcDati[c.id];
    if (!d) return;
    const suoi = Object.keys(d.satsMensile).sort();
    if (suoi.length && (!primo || suoi[0] < primo)) primo = suoi[0];
  });
  if (!primo) return [];

  const out = [];
  for (let k = primo; k <= MESE_OGGI && out.length < 240; k = spostaMese(k, 1)) out.push(k);
  return out;
}

/* ---------- motore dei grafici ---------- */
/* Uno solo per entrambi: patrimonio e prezzo cambiano solo nei dati e nelle
   etichette. Il viewBox segue la larghezza reale del contenitore, altrimenti
   su telefono le scritte dentro l'SVG verrebbero rimpicciolite dalla scalatura. */
const grafici = [];

let contatoreGrafici = 0;

function creaGrafico(contenitore) {
  const idSfuma = "sfuma" + (++contatoreGrafici);
  const TIP_W = 152, TIP_H = 38;
  let W = 720, H = 280, PX0 = 4, PX1 = 662, PY0 = 18, PY1 = 254;
  let punti = [], opt = {}, X = null, Y = null, bloccato = false;

  function dimensiona() {
    W = Math.round(Math.min(Math.max(contenitore.clientWidth || 620, 300), 720));
    H = W < 480 ? 215 : 275;
    PX0 = 4; PX1 = W - (W < 480 ? 46 : 58); PY0 = 18; PY1 = H - 26;
  }

  function taccheY(min, max, n = 4) {
    const campo = (max - min) || Math.abs(max) || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(campo / n)));
    const norm = campo / n / mag;
    const passo = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    const t = [];
    for (let v = Math.ceil(min / passo) * passo; v <= max; v += passo) t.push(v);
    return t;
  }

  // tacche temporali su confini leggibili: ore, giorni, primi del mese o anni
  function taccheX(t0, t1) {
    const campo = t1 - t0, out = [];
    const ora = t => new Date(t).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    const giorno = t => new Date(t).toLocaleDateString("it-IT", { day: "numeric", month: "short" });
    const mesetto = t => new Date(t).toLocaleDateString("it-IT", { month: "short", year: "2-digit" });

    if (campo <= 2.5 * G) {
      const passo = Math.max(1, Math.round(campo / 3600e3 / 6)) * 3600e3;
      for (let t = Math.ceil(t0 / passo) * passo; t <= t1; t += passo) out.push([t, ora(t)]);
    } else if (campo <= 70 * G) {
      const passo = Math.max(1, Math.round(campo / G / 6));
      const d = new Date(t0); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 1);
      for (; +d <= t1; d.setDate(d.getDate() + passo)) out.push([+d, giorno(+d)]);
    } else if (campo <= 800 * G) {
      const passo = Math.max(1, Math.round(campo / G / 30.4 / 6));
      const d = new Date(t0); d.setDate(1); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() + 1);
      for (; +d <= t1; d.setMonth(d.getMonth() + passo)) out.push([+d, mesetto(+d)]);
    } else {
      const passo = Math.max(1, Math.round(campo / G / 365.25 / 6));
      const d = new Date(new Date(t0).getFullYear() + 1, 0, 1);
      for (; +d <= t1; d.setFullYear(d.getFullYear() + passo)) out.push([+d, String(d.getFullYear())]);
    }
    return out;
  }

  function messaggio(html, classe) {
    contenitore.innerHTML = `<div class="stato ${classe || ""}">${html}</div>`;
    punti = [];
  }

  function disegna(nuovi, opzioni) {
    opt = opzioni || {};
    punti = (nuovi || []).filter(p => isFinite(p[0]) && isFinite(p[1]));
    if (punti.length < 2) {
      messaggio(opt.vuoto || "Servono almeno due mesi per disegnare una linea.");
      return;
    }
    dimensiona();
    bloccato = false;

    const t0 = punti[0][0], t1 = punti[punti.length - 1][0];
    const lo = Math.min(...punti.map(p => p[1])), hi = Math.max(...punti.map(p => p[1]));
    const margine = (hi - lo) * .12 || Math.abs(hi) * .1 || 1;
    const yLo = lo >= 0 ? Math.max(0, lo - margine) : lo - margine;
    const yHi = hi + margine;

    X = t => PX0 + (t - t0) / ((t1 - t0) || 1) * (PX1 - PX0);
    Y = v => PY1 - (v - yLo) / ((yHi - yLo) || 1) * (PY1 - PY0);
    const r = n => Math.round(n * 10) / 10;

    const xy = punti.map(p => [r(X(p[0])), r(Y(p[1]))]);
    const linea = xy.map((p, i) => `${i ? "L" : "M"}${p[0]} ${p[1]}`).join(" ");
    // con valori sotto zero l'area va riempita fino alla linea dello zero,
    // non fino al fondo del riquadro
    const base = yLo <= 0 && yHi >= 0 ? r(Y(0)) : PY1;
    const area = `${linea} L${xy[xy.length - 1][0]} ${base} L${xy[0][0]} ${base} Z`;

    const griglia = taccheY(yLo, yHi).map(v => `
      <line class="${Math.abs(v) < 1e-9 ? "zero" : "grid"}" x1="${PX0}" y1="${r(Y(v))}" x2="${PX1}" y2="${r(Y(v))}" stroke-dasharray="2 4"/>
      <text x="${PX1 + 7}" y="${r(Y(v)) + 4}">${fmtAsse(v)}</text>`).join("");

    // una tacca sul bordo verrebbe tagliata a metà: lì il testo si ancora al lato
    const assi = (opt.tacche ? opt.tacche(t0, t1) : taccheX(t0, t1)).map(([t, testo]) => {
      const x = r(X(t));
      const ancora = x - PX0 < 24 ? "start" : PX1 - x < 24 ? "end" : "middle";
      return `
      <line class="grid" x1="${x}" y1="${PY0}" x2="${x}" y2="${PY1}"/>
      <text x="${x}" y="${H - 8}" text-anchor="${ancora}">${testo}</text>`;
    }).join("");

    const fine = xy[xy.length - 1];
    contenitore.style.setProperty("--tinta", opt.tinta || "var(--c-tutto)");
    contenitore.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.titolo || "Grafico"}">
        <defs>
          <linearGradient id="${idSfuma}" x1="0" y1="0" x2="0" y2="1">
            <stop class="stop-a" offset="0%"/><stop class="stop-b" offset="100%"/>
          </linearGradient>
        </defs>
        ${assi}${griglia}
        <path d="${area}" fill="url(#${idSfuma})"/>
        <path class="curve" d="${linea}" stroke-linejoin="round" stroke-linecap="round"/>
        <circle class="dot" cx="${fine[0]}" cy="${fine[1]}" r="3.5"/>
        <g class="cross" style="display:none" pointer-events="none">
          <line class="cross-line" y1="${PY0}" y2="${PY1}" stroke-dasharray="3 3"/>
          <circle class="cross-dot" r="4"/>
          <rect class="tip-bg" rx="6" height="${TIP_H}" width="${TIP_W}"/>
          <text class="tip-v"></text>
          <text class="tip-d"></text>
          <text class="pin">📌</text>
        </g>
        <rect x="${PX0}" y="${PY0}" width="${PX1 - PX0}" height="${PY1 - PY0}" fill="transparent"/>
      </svg>`;

    collega();
  }

  /* L'etichetta segue il puntatore; con un clic resta ferma sul punto e si
     toglie cliccando altrove nella pagina o con Esc. */
  function collega() {
    const svg = contenitore.querySelector("svg");
    const g = contenitore.querySelector(".cross");
    const linea = g.querySelector(".cross-line");
    const dot = g.querySelector(".cross-dot");
    const box = g.querySelector(".tip-bg");
    const testoV = g.querySelector(".tip-v");
    const testoD = g.querySelector(".tip-d");
    const pin = g.querySelector(".pin");

    const punta = e => {
      const rect = svg.getBoundingClientRect();
      const vx = (e.clientX - rect.left) / rect.width * W;
      let i = 0, best = Infinity;
      punti.forEach((p, k) => { const d = Math.abs(X(p[0]) - vx); if (d < best) { best = d; i = k; } });
      const [t, v] = punti[i], x = X(t), y = Y(v);

      linea.setAttribute("x1", x); linea.setAttribute("x2", x);
      dot.setAttribute("cx", x); dot.setAttribute("cy", y);
      const bx = Math.min(Math.max(x - TIP_W / 2, PX0), Math.max(PX0, PX1 - TIP_W));
      box.setAttribute("x", bx); box.setAttribute("y", PY0 - 4);
      testoV.setAttribute("x", bx + 10); testoV.setAttribute("y", PY0 + 12);
      testoV.textContent = (opt.valore || fmtEur0)(v);
      testoD.setAttribute("x", bx + 10); testoD.setAttribute("y", PY0 + 27);
      testoD.textContent = (opt.quando || (q => new Date(q).toLocaleDateString("it-IT")))(t, i);
      pin.setAttribute("x", bx + TIP_W - 22); pin.setAttribute("y", PY0 + 12);
      g.style.display = "";
    };

    svg.addEventListener("pointermove", e => { if (!bloccato) punta(e); });
    svg.addEventListener("pointerleave", () => { if (!bloccato) g.style.display = "none"; });
    svg.addEventListener("click", e => { punta(e); bloccato = true; g.classList.add("bloccato"); });
  }

  const api = {
    disegna,
    messaggio,
    ridisegna: () => { if (punti.length) disegna(punti, opt); },
    sblocca() {
      bloccato = false;
      const g = contenitore.querySelector(".cross");
      if (g) { g.style.display = "none"; g.classList.remove("bloccato"); }
    },
    contiene: nodo => contenitore.contains(nodo)
  };
  grafici.push(api);
  return api;
}

document.addEventListener("pointerdown", e => grafici.forEach(g => { if (!g.contiene(e.target)) g.sblocca(); }));
document.addEventListener("keydown", e => { if (e.key === "Escape") grafici.forEach(g => g.sblocca()); });

let toastTimer = null;
function avvisa(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
}

/* Tre livelli di dettaglio con la stessa cascata di sorgenti: vince la prima che
   risponde con abbastanza punti. CoinGecko resta ultima perché il piano gratuito
   si ferma a un anno di storico. Il livello lungo serve anche a rivalutare i
   saldi dei mesi passati. */
const daKraken = j => {
  if (j.error && j.error.length) throw new Error(j.error[0]);
  const k = Object.keys(j.result || {}).find(x => x !== "last");
  return (j.result[k] || []).map(r => [r[0] * 1000, +r[4]]);
};
const daBitstamp = j => (j.data.ohlc || []).map(c => [+c.timestamp * 1000, +c.close]);
const daGecko = j => (j.prices || []).map(p => [p[0], p[1]]);

const kraken = i => ({ label: "Kraken (XBT/EUR)", url: `https://api.kraken.com/0/public/OHLC?pair=XBTEUR&interval=${i}`, parse: daKraken });
const bitstamp = (passo, n) => ({ label: "Bitstamp (BTC/EUR)", url: `https://www.bitstamp.net/api/v2/ohlc/btceur/?step=${passo}&limit=${n}`, parse: daBitstamp });
const gecko = (q, nota) => ({ label: "CoinGecko" + (nota || ""), url: `https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=eur&${q}`, parse: daGecko });

const LIVELLI = {
  breve: { ttl: 30 * 60e3,   fonti: [kraken(240),   bitstamp(14400, 1000), gecko("days=90")] },
  medio: { ttl: 6 * 3600e3,  fonti: [kraken(1440),  bitstamp(86400, 1000), gecko("days=365&interval=daily", " (solo 1 anno)")] },
  lungo: { ttl: 24 * 3600e3, fonti: [kraken(10080), bitstamp(259200, 700), gecko("days=365&interval=daily", " (solo 1 anno)")] }
};

const PERIODI = [
  { id: "1m", label: "1M", desc: "1 mese",  giorni: 30,   livello: "breve" },
  { id: "6m", label: "6M", desc: "6 mesi",  giorni: 183,  livello: "medio" },
  { id: "1a", label: "1A", desc: "1 anno",  giorni: 365,  livello: "medio" },
  { id: "2a", label: "2A", desc: "2 anni",  giorni: 730,  livello: "lungo" },
  { id: "5a", label: "5A", desc: "5 anni",  giorni: 1826, livello: "lungo" }
];

const datiPrezzi = {};
let periodo = PERIODI.find(p => p.id === "1a");
let prezzoOra = null;
let richiestaPrezzo = 0;

async function caricaLivello(liv) {
  if (datiPrezzi[liv]) return datiPrezzi[liv];
  const chiave = "btc_prezzi_" + liv;
  let vecchia = null;
  try {
    const c = JSON.parse(localStorage.getItem(chiave));
    if (c && Array.isArray(c.serie) && c.serie.length > 20) {
      vecchia = c;
      if (Date.now() - c.ts < LIVELLI[liv].ttl) return (datiPrezzi[liv] = { serie: c.serie, fonte: c.fonte });
    }
  } catch (_) { /* cache illeggibile: si riparte dalla rete */ }

  for (const fonte of LIVELLI[liv].fonti) {
    try {
      const r = await fetch(fonte.url);
      if (!r.ok) continue;
      const punti = (fonte.parse(await r.json()) || [])
        .filter(p => isFinite(p[0]) && isFinite(p[1]) && p[1] > 0)
        .sort((a, b) => a[0] - b[0]);
      if (punti.length < 20) continue;
      try { localStorage.setItem(chiave, JSON.stringify({ ts: Date.now(), fonte: fonte.label, serie: punti })); } catch (_) { /* spazio esaurito */ }
      return (datiPrezzi[liv] = { serie: punti, fonte: fonte.label });
    } catch (_) { /* sorgente muta: si prova la prossima */ }
  }

  // rete giù: meglio dati vecchi dichiarati che una scheda vuota
  if (vecchia) return (datiPrezzi[liv] = { serie: vecchia.serie, fonte: vecchia.fonte + " · dati del " + new Date(vecchia.ts).toLocaleDateString("it-IT") });
  return null;
}

function prezzoAlMese(m) {
  const d = datiPrezzi.lungo;
  if (!d || !d.serie.length) return null;
  const limite = fineMese(m);
  let p = null;
  for (const punto of d.serie) { if (punto[0] <= limite) p = punto[1]; else break; }
  return p !== null ? p : d.serie[0][1];
}

async function caricaPrezzoOra() {
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur");
    if (r.ok) { prezzoOra = (await r.json()).bitcoin.eur; return; }
  } catch (_) { /* si ripiega sull'ultima quotazione dello storico */ }
  const d = datiPrezzi.lungo || datiPrezzi.medio || datiPrezzi.breve;
  if (d && d.serie.length) prezzoOra = d.serie[d.serie.length - 1][1];
}

/* ---------- Bitcoin: saldi on-chain ---------- */
const API_BS = "https://blockstream.info/api";
const SAT = 1e8;
const btcDati = {};      // idConto -> { sats, perIndirizzo, satsMensile, troncato, errore }

const deltaTx = (tx, addr) => {
  let v = 0;
  for (const o of tx.vout || []) if (o.scriptpubkey_address === addr) v += o.value;
  for (const i of tx.vin || []) if (i.prevout && i.prevout.scriptpubkey_address === addr) v -= i.prevout.value;
  return v;
};

// Blockstream pagina a 25 transazioni per volta: si risale finché la pagina è vuota
async function tutteLeTx(addr) {
  const out = [];
  let url = `${API_BS}/address/${addr}/txs`;
  for (let p = 0; p < 20; p++) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const lotto = await r.json();
    if (!lotto.length) return { tx: out, completo: true };
    out.push(...lotto);
    url = `${API_BS}/address/${addr}/txs/chain/${lotto[lotto.length - 1].txid}`;
  }
  return { tx: out, completo: false };
}

// dal saldo cumulato nel tempo al saldo a fine di ogni mese
function satsPerMese(eventi) {
  const out = {};
  if (!eventi.length) return out;
  eventi.sort((a, b) => a.t - b.t);
  let k = chiaveMese(new Date(eventi[0].t)), i = 0, cum = 0;
  while (k <= MESE_OGGI) {
    const limite = fineMese(k);
    while (i < eventi.length && eventi[i].t <= limite) cum += eventi[i++].delta;
    out[k] = cum;
    k = spostaMese(k, 1);
  }
  return out;
}

async function caricaConto(conto) {
  const indirizzi = (conto.indirizzi || []).map(i => i.addr);
  const d = { sats: 0, perIndirizzo: {}, satsMensile: {}, troncato: false, errore: null, pronto: false };
  btcDati[conto.id] = d;
  if (!indirizzi.length) { d.pronto = true; return; }

  const eventi = [];
  for (const addr of indirizzi) {
    try {
      const r = await fetch(`${API_BS}/address/${addr}`);
      if (r.status === 400 || r.status === 404) { d.perIndirizzo[addr] = null; continue; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      const s = await r.json();
      const saldo = (s.chain_stats.funded_txo_sum - s.chain_stats.spent_txo_sum)
                  + (s.mempool_stats.funded_txo_sum - s.mempool_stats.spent_txo_sum);
      d.perIndirizzo[addr] = saldo;
      d.sats += saldo;

      const { tx, completo } = await tutteLeTx(addr);
      if (!completo) d.troncato = true;
      for (const t of tx) {
        if (!t.status || !t.status.confirmed || !t.status.block_time) continue;
        eventi.push({ t: t.status.block_time * 1000, delta: deltaTx(t, addr) });
      }
    } catch (e) {
      d.errore = e.message;
      d.perIndirizzo[addr] = d.perIndirizzo[addr] ?? null;
    }
  }
  d.satsMensile = satsPerMese(eventi);
  d.pronto = true;
}

// sats di un conto a fine mese: dal mese ricostruito, o dall'ultimo noto prima
function satsAlMese(d, m) {
  if (!d) return 0;
  if (m >= MESE_OGGI) return d.sats;
  if (typeof d.satsMensile[m] === "number") return d.satsMensile[m];
  const prima = Object.keys(d.satsMensile).filter(k => k < m).sort();
  return prima.length ? d.satsMensile[prima[prima.length - 1]] : 0;
}

/* Quando la catena non arriva — storico troppo lungo per leggerlo tutto,
   lettura fallita, wallet più vecchio di quello che l'API restituisce — il
   mese si può scrivere a mano. Vale solo per il mese in cui è scritto: non si
   riporta avanti, o coprirebbe letture buone. Sta nei saldi come gli altri
   importi, sotto una chiave sua, e in satoshi perché è una quantità di
   bitcoin, non euro. */
const chiaveBtc = id => id + "#btc";
/* Quali pannelli sono aperti: ogni importo scritto ridisegna la scheda, e senza
   memoria il pannello si richiuderebbe sotto le dita a ogni riga compilata. */
const manoAperta = new Set();
function satsAMano(conto, m) {
  const riga = stato.saldi[m];
  const v = riga && riga[chiaveBtc(conto.id)];
  return typeof v === "number" ? v : null;
}

/* Dal mese scorso fino ad agosto 2025, dal più vicino al più lontano: prima di
   lì non si scrive, perché prima di lì non si ricorda. */
const PRIMO_MESE_A_MANO = "2025-08";
function mesiDaScrivere() {
  const out = [];
  for (let k = spostaMese(MESE_OGGI, -1); k >= PRIMO_MESE_A_MANO; k = spostaMese(k, -1)) out.push(k);
  return out;
}

function valoreBtc(conto, m) {
  const d = btcDati[conto.id];
  const aMano = satsAMano(conto, m);
  if (aMano === null && !d) return 0;
  const sats = aMano !== null ? aMano : satsAlMese(d, m);
  if (!sats) return 0;
  const prezzo = m >= MESE_OGGI ? (prezzoOra ?? prezzoAlMese(m)) : prezzoAlMese(m);
  return prezzo ? sats / SAT * prezzo : 0;
}

    vociDi(c).forEach(v => { const d = valoreVoce(v.id, mese); if (d.ereditato || d.vuoto) n++; });

function renderSommario() {
  const quali = contiDi(tab);
  $("occhiello").textContent = nomeScheda(tab);
  const tot = totaleDi(tab, mese);
  scriviCifrone(quali.length ? fmtEur(tot) : "—", tab === "tutto" ? "" : tintaDi(tab));

  /* I chip si aggiornano nel testo e non si ricreano. Ricostruirli qui li
     distruggerebbe mentre un campo perde il focus, e il clic che ha causato
     quel blur andrebbe perso fra mousedown e mouseup. */
  const delta = $("chip-delta"), conta = $("chip-conta");
  if (!quali.length) {
    delta.hidden = conta.hidden = true;
    return;
  }

  const prec = spostaMese(mese, -1);
  const diff = tot - totaleDi(tab, prec);
  delta.hidden = !saldiVisibili;
  if (Math.abs(diff) < 0.005) {
    delta.className = "chip";
    delta.textContent = "Invariato su " + etichettaBreve(prec);
  } else {
    delta.className = "chip num " + (diff > 0 ? "su" : "giu");
    delta.textContent = `${diff > 0 ? "↑" : "↓"} ${diff > 0 ? "+" : "−"}${fmtEur(Math.abs(diff))} su ${etichettaBreve(prec)}`;
  }

  const n = daAggiornare(tab);
  conta.hidden = !n;
  if (n) conta.textContent = `${n} ${n === 1 ? "voce da aggiornare" : "voci da aggiornare"}`;
}

  return conti.map((c, i) => ({
    nome: c.nome, v: totaleConto(c, mese),
    tinta: tintaDi(tab), opacita: 1 - Math.min(i, 4) * 0.17

function renderComposizione(parti) {
  const su = parti.filter(p => p.v > 0);
  const giu = parti.filter(p => p.v < 0);
  const attivo = su.reduce((s, p) => s + p.v, 0);
  const passivo = -giu.reduce((s, p) => s + p.v, 0);
  const torta = $("torta"), nota = $("torta-nota");

  if (!su.length || attivo <= 0) {
    torta.innerHTML = "";
    nota.textContent = passivo ? `Per ora ci sono solo debiti: ${fmtEur(passivo)}.` : "Inserisci un saldo per vedere la composizione.";
    return;
  }

  const R = 88, RI = 56, C = 100;
  const sulCerchio = (ang, r) => [(C + r * Math.cos(ang)).toFixed(2), (C + r * Math.sin(ang)).toFixed(2)];
  const centro = `
    <text class="centro-eti" x="${C}" y="${C - 8}" text-anchor="middle">${passivo ? "Attività" : "Totale"}</text>
    <text class="centro-val" x="${C}" y="${C + 14}" text-anchor="middle">${esc(velato(fmtEur(attivo)))}</text>`;

  let disegno;
  if (su.length === 1) {
    // una fetta sola: un arco da 360 gradi degenera, qui serve un anello pieno
    disegno = `<circle class="fetta" cx="${C}" cy="${C}" r="${(R + RI) / 2}" fill="none"
        stroke="${su[0].tinta}" stroke-width="${R - RI}" ${su[0].id ? `data-tab="${su[0].id}"` : ""}
      ><title>${esc(su[0].nome)} · ${esc(fmtEur(su[0].v))} · 100%</title></circle>`;
  } else {
    let ang = -Math.PI / 2;
    disegno = su.map(p => {
      const quota = p.v / attivo;
      const fine = ang + quota * Math.PI * 2;
      const grande = quota > .5 ? 1 : 0;
      const [x0, y0] = sulCerchio(ang, R), [x1, y1] = sulCerchio(fine, R);
      const [x2, y2] = sulCerchio(fine, RI), [x3, y3] = sulCerchio(ang, RI);
      ang = fine;
      return `<path class="fetta" ${p.id ? `data-tab="${p.id}"` : ""}
          d="M${x0} ${y0} A${R} ${R} 0 ${grande} 1 ${x1} ${y1} L${x2} ${y2} A${RI} ${RI} 0 ${grande} 0 ${x3} ${y3} Z"
          fill="${p.tinta}" opacity="${p.opacita || 1}" stroke="var(--superficie)" stroke-width="2"
        ><title>${esc(p.nome)} · ${esc(fmtEur(p.v))} · ${Math.round(quota * 100)}%</title></path>`;
    }).join("");
  }

  torta.innerHTML = `<svg viewBox="0 0 200 200" role="img"
      aria-label="Composizione: ${esc(su.map(x => `${x.nome} ${fmtEur(x.v)}`).join(", "))}">
      ${disegno}${centro}</svg>`;

  const massima = su.reduce((x, y) => y.v > x.v ? y : x);
  const primo = mesiDelGrafico("tutto")[0];
  nota.innerHTML =
    `<div>La fetta più grande è <b>${esc(massima.nome)}</b>, il ${Math.round(massima.v / attivo * 100)}% di quanto possiedi.</div>` +
    (passivo ? `<div style="margin-top:7px">Hai <span class="debito">${esc(fmtEur(passivo))}</span> di debiti, pari al ${Math.round(passivo / attivo * 100)}% delle attività.</div>` : "") +
    (primo ? `<div style="margin-top:7px">Mese di partenza dei dati: <b>${esc(etichettaMese(primo))}</b>.</div>` : "");
}

function cartaConto(c) {
  const neg = segnoEtichetta(c.etichetta) < 0;
  const righe = vociDi(c);
  /* Il totale in testa solo quando somma più righe: con un sottoconto solo
     sarebbe la stessa cifra scritta due volte nella stessa scheda. Ma la riga
     c'è comunque, anche da sola: la categoria non ha un saldo suo. */
  const mostraTotale = c.btc || righe.length > 1;

  /* Il cestino della categoria sta nel piede, con gli altri comandi che la
     riguardano: nell'intestazione rubava al nome la fine della riga, e sotto
     un nome senza cifra restava da solo su una riga vuota. */
  /* Il titolo non è un campo: è la porta della pagina del conto, dove stanno
     il suo saldo e il suo andamento. I nomi si cambiano dal menu in alto a
     sinistra, perché qui il clic serve ad aprire. */
  const titolo = tab === c.id
    ? `<span class="nome-conto fisso">${esc(c.nome)}</span>`
    : `<button type="button" class="nome-conto fisso apre" data-tab="${c.id}"
               aria-label="Apri ${esc(c.nome)}">${esc(c.nome)}<span class="freccia">›</span></button>`;

  const testa = dentro => `
    <div class="intestazione ${dentro ? "con-cifra" : ""}">
      ${titolo}
      ${dentro}
    </div>`;

  const sceltaEtichetta = `
    <label class="scelta-eti">
      <select class="mini-campo" data-etichetta="${c.id}" aria-label="Etichetta di ${esc(c.nome)}">
        ${ORDINE.map(e => `<option value="${e}" ${e === c.etichetta ? "selected" : ""}>${esc(nomeEtichetta(e))}</option>`).join("")}
      </select>
    </label>`;

  // nel piede un cestino senza parole non direbbe se butta via il sottoconto
  // o tutta la categoria: qui ci vuole la parola
  const viaCategoria = `<button class="mini via-categoria" ${chiedo("conto", c.id)}
      aria-label="Elimina la categoria ${esc(c.nome)}">Elimina</button>`;

  const piede = dentro => `<div class="piede-scheda">${sceltaEtichetta}${dentro}${viaCategoria}</div>`;

  const guscio = (intestazione, corpo) =>
    `<section class="scheda conto ${neg ? "negativo" : ""}" style="--tinta:${tintaConto(c)}">
       ${intestazione}${quiConferma("conto", c.id)}${corpo}
     </section>`;

  if (c.btc) {
    return guscio(testa(`<span class="tot-conto num" data-tot="${c.id}">${fmtEur(totaleConto(c, mese))}</span>`),
      corpoBtc(c) + piede(""));
  }

  const elenco = righe.map(v => `
    <div class="riga">
      <input class="etichetta" data-rinomina="${v.id}" value="${esc(v.nome)}" aria-label="Nome sottoconto" />
      ${campoSoldi(v.id, v.nome)}
      <span class="valuta">€</span>
      <button class="bottoncino" ${chiedo("voce", v.id)} aria-label="Elimina ${esc(v.nome)}">×</button>
    </div>${quiConferma("voce", v.id)}`).join("");

  return guscio(
    testa(mostraTotale ? `<span class="tot-conto num" data-tot="${c.id}">${fmtEur(totaleConto(c, mese))}</span>` : ""),
    `${elenco || `<div class="stato">Nessun sottoconto.</div>`}
     ${neg ? `<div class="avvertenza" style="padding-top:12px">Scrivi quanto devi, con il segno più: nei totali entra in negativo.</div>` : ""}
     ${piede(`<button class="mini" data-nuova-voce="${c.id}">+ Sottoconto</button>`)}`);
}

function corpoBtc(c) {
  const d = btcDati[c.id];
  const indirizzi = c.indirizzi || [];

  const righe = indirizzi.map(i => {
    const sats = d && d.pronto ? satsAlMese(d, mese) : null;
    const quanto = !d || !d.pronto ? `<small>lettura…</small>`
      : d.perIndirizzo[i.addr] == null ? `<small>non leggibile</small>`
      : `<b>${fmtBtc(sats)} BTC</b>${mese < MESE_OGGI ? `<small>a fine ${etichettaBreve(mese)}</small>` : ""}`;
    return `<div class="indirizzo">
        <span class="codice" title="${esc(i.addr)}">${esc(i.addr)}</span>
        <span class="quanto">${quanto}</span>
        <button class="bottoncino" ${chiedo("indirizzo", i.addr)} aria-label="Rimuovi indirizzo">×</button>
      </div>${quiConferma("indirizzo", i.addr)}`;
  }).join("");

  // un indirizzo per conto: quando c'è, il campo per aggiungerne sparisce
  const modulo = indirizzi.length ? "" : `
    <div class="modulo">
      <div class="fila">
        <input class="campo largo" data-nuovo-addr="${c.id}" placeholder="bc1q… · 3… · 1…"
               spellcheck="false" aria-label="Indirizzo del wallet" />
        <button class="mini pieno" data-aggiungi-addr="${c.id}">Aggiungi</button>
      </div>
      <div class="brindello">Incolla l'indirizzo del wallet: il saldo lo legge dalla blockchain, non si scrive a mano.</div>
    </div>`;

  const note = [];
  if (indirizzi.length) {
    if (d && d.troncato) note.push("Storico molto lungo: ho letto solo le transazioni più recenti, i mesi lontani possono essere imprecisi.");
    if (d && d.errore) note.push("La lettura non è riuscita (" + esc(d.errore) + "): il saldo può essere parziale.");
  }

  const aMano = indirizzi.length || mesiDaScrivere().some(m => satsAMano(c, m) !== null) ? `
    <details class="mesi-mano" data-mano="${c.id}" ${manoAperta.has(c.id) ? "open" : ""}>
      <summary>Mesi scritti a mano</summary>
      <div class="brindello" style="padding:0 0 8px">
        Dove la catena non arriva, scrivi quanti bitcoin avevi a fine mese. Vale
        solo per quel mese, e si torna indietro fino ad agosto 2025.
      </div>
      ${mesiDaScrivere().map(m => {
        const mio = satsAMano(c, m);
        const letto = d && d.pronto ? satsAlMese(d, m) : null;
        return `<div class="riga-mese">
          <span class="quando">${esc(etichettaBreve(m))}</span>
          <input class="mini-campo num" data-btc-mano="${c.id}" data-mese="${m}"
                 type="text" inputmode="decimal" spellcheck="false"
                 aria-label="Bitcoin a fine ${esc(etichettaBreve(m))}"
                 value="${mio === null ? "" : esc(fmtBtc(mio))}"
                 placeholder="${letto === null ? "0,00000000" : esc(fmtBtc(letto))}" />
          <span class="unita">BTC</span>
        </div>`;
      }).join("")}
    </details>` : "";

  return `${righe}${modulo}
    ${note.map(t => `<div class="avvertenza attenzione">${t}</div>`).join("")}
    ${aMano}`;
}

/* ---------- grafici ---------- */
/* Il segno davanti serve: "1.400" e "−1.400" sono due mesi opposti, e la riga
   si legge di sfuggita. Lo zero resta senza segno. */
const conSegno = v => (v > 0 ? "+" : v < 0 ? "−" : "") + fmtEur(Math.abs(v));
const classeSegno = v => v > 0 ? " su" : v < 0 ? " giu" : "";

function renderGrafico() {
  const aperto = contoDelTab();
  const btc = !!(aperto && aperto.btc);
  $("scheda-prezzo").hidden = !btc;
  $("scheda-grafico").hidden = btc;
  if (btc) return;

  $("titolo-grafico").textContent = tab === "tutto" ? "Andamento del patrimonio" : "Andamento · " + nomeScheda(tab);
  const mesi = mesiDelGrafico(tab);
  if (mesi.length < 2 || !contiDi(tab).length) {
    graficoPatrimonio.messaggio(stato.conti.length
      ? "Serve il saldo di almeno due mesi per disegnare l'andamento."
      : "Qui comparirà l'andamento, appena ci sono due mesi di saldi.");
    return;
  }
  const punti = mesi.map(m => [dataMese(m).getTime(), totaleDi(tab, m)]);
  const valori = punti.map(p => p[1]);

  graficoPatrimonio.disegna(punti, {
    titolo: `Andamento da ${etichettaBreve(mesi[0])} a ${etichettaBreve(mesi[mesi.length - 1])}`,
    tinta: tintaDi(tab),
    valore: fmtEur0,
    quando: (t, i) => etichettaMese(mesi[i]),
    tacche: () => {
      const passo = Math.max(1, Math.ceil(mesi.length / 6));
      return mesi.filter((_, i) => i % passo === 0 || i === mesi.length - 1)
        .map(m => [dataMese(m).getTime(), dataMese(m).toLocaleDateString("it-IT", { month: "short", year: "2-digit" })]);
    }
  });

}

$("periodi").innerHTML = PERIODI.map(p =>
  `<button type="button" data-periodo="${p.id}" aria-label="${p.desc}" aria-pressed="${p.id === periodo.id}"
           class="${p.id === periodo.id ? "on" : ""}">${p.label}</button>`).join("");

async function mostraPrezzo() {
  const mia = ++richiestaPrezzo;
  if (!datiPrezzi[periodo.livello]) graficoPrezzo.messaggio('<div class="rotella"></div>Carico lo storico…');
  const d = await caricaLivello(periodo.livello);
  if (mia !== richiestaPrezzo) return;
  if (!d) { graficoPrezzo.messaggio("Non riesco a scaricare lo storico dei prezzi. Riprova più tardi.", "errore"); return; }

  const dentro = d.serie.filter(p => p[0] >= Date.now() - periodo.giorni * G);
  const vista = dentro.length >= 2 ? dentro : d.serie.slice(-2);
  const primo = vista[0][1], ultimo = vista[vista.length - 1][1];
  const campo = vista[vista.length - 1][0] - vista[0][0];
  const varPct = (ultimo - primo) / primo * 100;
  const su = varPct >= 0;

  $("prezzo-btc").textContent = fmtEur0(ultimo);
  $("prezzo-btc").style.color = "var(--c-btc)";
  $("prezzo-chip").innerHTML =
    `<span class="chip ${su ? "su" : "giu"} num">${su ? "↑" : "↓"} ${su ? "+" : "−"}${Math.abs(varPct).toLocaleString("it-IT", { maximumFractionDigits: 1 })}% · ${periodo.desc}</span>`;

  graficoPrezzo.disegna(vista, {
    titolo: "Prezzo di Bitcoin in euro · " + periodo.desc,
    tinta: "var(--c-btc)",
    valore: fmtEur0,
    quando: t => new Date(t).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" })
  });

  $("prezzo-periodo").textContent = `min ${fmtEur0(Math.min(...vista.map(p => p[1])))} · max ${fmtEur0(Math.max(...vista.map(p => p[1])))}`;
  const parziale = campo < periodo.giorni * G * .85;
  $("prezzo-fonte").className = parziale ? "parziale" : "";
  $("prezzo-fonte").textContent = parziale
    ? `storico disponibile: ${Math.round(campo / G)} giorni · ${d.fonte}`
    : `fonte: ${d.fonte}`;
}

/* ---------- nuovo conto: solo dal menu in alto a sinistra ---------- */
function renderZonaNuovo() {
  const zona = $("zona-nuovo");
  zona.innerHTML = stato.conti.length ? "" : `
    <section class="scheda"><div class="benvenuto">
      <h2>Comincia da una categoria</h2>
      <p>Apri il menu <b>+</b> in alto a sinistra, dai un nome alla categoria e scegli se è liquidità, immobilizzato o debito. Ogni mese torni qui e aggiorni i numeri: il grafico si costruisce da solo.</p>
      <button class="mini pieno" style="--tinta:var(--c-liquidita)" id="apri-da-benvenuto">Aggiungi la prima categoria</button>
    </div></section>`;
}

let menuAperto = false;

function apriMenu(apri) {
  menuAperto = apri;
  $("pannello").hidden = !apri;
  $("apri-menu").setAttribute("aria-expanded", String(apri));
  if (apri) { renderSceltaTipi(); renderRinomina(); $("nuovo-nome").focus(); }
  else $("apri-menu").focus();
}

/* L'elenco dei nomi da cambiare. Il wallet bitcoin non c'è: il suo nome è
   fisso, ed è l'unico conto che non si rinomina. */
function renderRinomina() {
  const zona = $("zona-rinomina");
  if (!stato.conti.length) { zona.innerHTML = ""; return; }
  zona.innerHTML = `<div class="rinomina-elenco">
      <div class="tendina-titolo">Rinomina</div>
      ${stato.conti.map(c => `<div class="rinomina-riga" style="--tinta:${tintaConto(c)}">
          <span class="punto"></span>
          ${c.btc
            ? `<span class="bloccato">${esc(c.nome)} · nome fisso</span>`
            : `<input class="campo" data-rinomina="${c.id}" value="${esc(c.nome)}"
                      aria-label="Nome di ${esc(c.nome)}" />`}
        </div>`).join("")}
    </div>`;
}

function renderSceltaTipi() {
  // il wallet bitcoin sta in fila con le etichette, ma non è un'etichetta: è il
  // tipo di conto. Ce n'è uno solo, quindi sparisce appena esiste
  const scelte = ORDINE.map(t => [t, nomeEtichetta(t)]);
  if (!cEBitcoin()) scelte.push(["btc", NOME_BTC]);
  if (tipoNuovo === "btc" && cEBitcoin()) tipoNuovo = ORDINE[0];

  $("scelta-tipi").innerHTML = scelte.map(([t, nome]) =>
    `<button type="button" data-tipo="${t}" style="--tinta:${tintaDi(t)}"
             class="${t === tipoNuovo ? "on" : ""}"><span class="punto"></span>${esc(nome)}</button>`).join("");

  // il wallet ha un nome fisso: il campo non serve
  const campo = $("nuovo-nome");
  campo.hidden = tipoNuovo === "btc";
  campo.placeholder = "Nome della categoria, es. " + esempioNome(tipoNuovo);
  $("dice-btc").hidden = tipoNuovo !== "btc";
  $("crea-conto").style.setProperty("--tinta", tintaDi(tipoNuovo));
}

const esempioNome = t => ({ liquidita: "Intesa", immobilizzato: "Degiro", debito: "Mutuo" }[t] || "");

/* ---------- azioni ---------- */
const trovaConto = id => stato.conti.find(c => c.id === id);
const contoDiVoce = id => stato.conti.find(c => (c.voci || []).some(v => v.id === id));


function scorda(chiave) {
  for (const m of Object.keys(stato.saldi)) {
    delete stato.saldi[m][chiave];
    if (!Object.keys(stato.saldi[m]).length) delete stato.saldi[m];
  }
}

function nomeDa(che, id) {
  if (che === "conto") return (trovaConto(id) || {}).nome;
  if (che === "voce") { const c = contoDiVoce(id); return c && c.voci.find(v => v.id === id).nome; }
  return "questo indirizzo";
}

function eliminaDavvero() {
  const { che, id } = daEliminare;
  if (che === "conto") {
    const c = trovaConto(id);
    vociDi(c).forEach(v => scorda(v.id));
    scorda(c.id);
    stato.conti = stato.conti.filter(x => x.id !== id);
    delete btcDati[id];
  } else if (che === "voce") {
    const c = contoDiVoce(id);
    c.voci = c.voci.filter(v => v.id !== id);
    scorda(id);
  } else {
    const c = trovaConto(daEliminare.conto);
    c.indirizzi = (c.indirizzi || []).filter(i => i.addr !== id);
    caricaConto(c).then(render);
  }
  daEliminare = null;
  salva(); renderPresto();
}

boxConti.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;

  if (b.dataset.chiedi) {
    const [che, ...resto] = b.dataset.chiedi.split(":");
    const id = resto.join(":");
    const scheda = b.closest(".conto");
    const titolare = scheda && scheda.querySelector("[data-rinomina]");
    daEliminare = { che, id, nome: nomeDa(che, id), conto: titolare && titolare.dataset.rinomina };
    renderPresto(); return;
  }
  if (b.hasAttribute("data-annulla")) { daEliminare = null; renderPresto(); return; }
  if (b.hasAttribute("data-conferma")) { eliminaDavvero(); return; }

  if (b.dataset.nuovaVoce) {
    const c = trovaConto(b.dataset.nuovaVoce);
    const v = { id: nuovoId(), nome: "Nuovo sottoconto" };
    (c.voci = c.voci || []).push(v);
    daMettereAFuoco = v.id;
    salva(); renderPresto(); return;
  }

  if (b.dataset.aggiungiAddr) {
    const c = trovaConto(b.dataset.aggiungiAddr);
    const campo = boxConti.querySelector(`[data-nuovo-addr="${c.id}"]`);
    const addr = campo.value.trim();
    if (!addr) { campo.focus(); return; }
    if ((c.indirizzi || []).length) { avvisa("Questo conto ha già il suo wallet: togli quello presente per cambiarlo."); return; }
    c.indirizzi = [{ addr }];
    salva(); renderPresto();
    caricaConto(c).then(render);
  }
});

boxConti.addEventListener("change", e => {
  const el = e.target;

  if (el.dataset.etichetta) {
    const c = trovaConto(el.dataset.etichetta);
    if (c) { c.etichetta = ETICHETTE[el.value] ? el.value : ETICHETTA_PREDEFINITA; salva(); renderPresto(); }
    return;
  }

  /* Qui dentro restano solo i sottoconti: il nome della categoria si cambia
     dal menu in alto a sinistra, perché nella scheda il titolo apre il conto. */
  if (el.dataset.rinomina) {
    const id = el.dataset.rinomina;
    const nome = el.value.trim() || "Senza nome";
    const padre = contoDiVoce(id);
    if (padre) padre.voci.find(v => v.id === id).nome = nome;
    el.value = nome;
    salva(); return;
  }

  if (el.dataset.btcMano) {
    const c = trovaConto(el.dataset.btcMano), m = el.dataset.mese;
    if (!c) return;
    const testo = el.value.trim();
    if (!testo && stato.saldi[m]) {
      delete stato.saldi[m][chiaveBtc(c.id)];
      if (!Object.keys(stato.saldi[m]).length) delete stato.saldi[m];
    }
    else if (testo) {
      const sats = leggiBtc(testo);
      if (sats === null) { avvisa("Non ho capito quella quantità. Scrivila come 0,0442"); el.value = ""; }
      else (stato.saldi[m] = stato.saldi[m] || {})[chiaveBtc(c.id)] = sats;
    }
    salva();
    const ora = satsAMano(c, m);
    el.value = ora === null ? "" : fmtBtc(ora);
    aggiornaCifre();
    return;
  }

  if (el.dataset.importo) {
    const id = el.dataset.importo;
    const testo = el.value.trim();
    if (!testo) {
      if (stato.saldi[mese]) { delete stato.saldi[mese][id]; if (!Object.keys(stato.saldi[mese]).length) delete stato.saldi[mese]; }
    } else {
      const v = leggiImporto(testo);
      if (v === null) { avvisa("Non ho capito quell'importo. Scrivilo come 1234"); el.value = ""; }
      else (stato.saldi[mese] = stato.saldi[mese] || {})[id] = v;
    }
    salva();
    const ora = valoreVoce(id, mese);
    el.value = ora.ereditato || ora.vuoto ? "" : fmtNum(ora.valore);
    el.placeholder = ora.ereditato ? fmtNum(ora.valore) : "0,00";
    el.classList.toggle("riportato", !!ora.ereditato);
    aggiornaCifre();
  }
});

boxConti.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const el = e.target;
  if (el.dataset.prevNome || el.dataset.prevImporto) { e.preventDefault(); el.blur(); return; }
  if (el.dataset.importo) {                   // un mese intero si compila a tastiera
    e.preventDefault();
    const campi = [...boxConti.querySelectorAll(".soldi")];
    const prossimo = campi[campi.indexOf(el) + 1];
    el.blur();
    if (prossimo) { prossimo.focus(); prossimo.select(); }
    return;
  }
  if (el.dataset.nuovoAddr) {
    e.preventDefault();
    boxConti.querySelector(`[data-aggiungi-addr="${el.dataset.nuovoAddr}"]`).click();
    return;
  }
  if (el.dataset.rinomina) { e.preventDefault(); el.blur(); }
});

/* navigazione fra le categorie */
function vaiA(t) {
  if (t === tab) return;
  tab = t;
  if (mese > MESE_OGGI) mese = MESE_OGGI;   // i consuntivi si fermano a oggi
  daEliminare = null;
  grafici.forEach(g => g.sblocca());
  render();
  const aperto = contoDelTab();
  if (aperto && aperto.btc) mostraPrezzo();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("pillole").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) vaiA(b.dataset.tab);
});
boxConti.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) vaiA(b.dataset.tab);
});
$("scelta-tab").addEventListener("change", e => vaiA(e.target.value));

// "toggle" non risale dal <details>: va ascoltato in fase di cattura
boxConti.addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.mano;
  if (!id) return;
  if (e.target.open) manoAperta.add(id); else manoAperta.delete(id);
}, true);
$("elenco-categorie").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) vaiA(b.dataset.tab);
});
$("torta").addEventListener("click", e => {
  const f = e.target.closest("[data-tab]");
  if (f) vaiA(f.getAttribute("data-tab"));
});

$("periodi").addEventListener("click", e => {
  const b = e.target.closest("button[data-periodo]");
  if (!b || b.dataset.periodo === periodo.id) return;
  periodo = PERIODI.find(p => p.id === b.dataset.periodo);
  $("periodi").querySelectorAll("button").forEach(x => {
    const on = x === b;
    x.classList.toggle("on", on);
    x.setAttribute("aria-pressed", on);
  });
  mostraPrezzo();
});

/* mesi */
function vaiAlMese(k) {
  mese = k > ultimoMese() ? ultimoMese() : k;
  daEliminare = null;
  renderPresto();
}
$("mese").addEventListener("change", e => { if (e.target.value) vaiAlMese(e.target.value); });
$("mese-giu").addEventListener("click", () => vaiAlMese(spostaMese(mese, -1)));
$("mese-su").addEventListener("click", () => { if (mese < ultimoMese()) vaiAlMese(spostaMese(mese, 1)); });

$("occhio").addEventListener("click", () => mostraSaldi(!saldiVisibili));

/* nuovo conto */
$("apri-menu").addEventListener("click", () => apriMenu(!menuAperto));
$("zona-nuovo").addEventListener("click", e => { if (e.target.closest("#apri-da-benvenuto")) apriMenu(true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && menuAperto) apriMenu(false); });
document.addEventListener("pointerdown", e => {
  if (menuAperto && !e.target.closest("#pannello") && !e.target.closest("#apri-menu")) apriMenu(false);
});

$("pannello").addEventListener("click", e => {
  const t = e.target.closest("[data-tipo]");
  if (t) { tipoNuovo = t.dataset.tipo; renderSceltaTipi(); $("nuovo-nome").focus(); return; }
  if (e.target.closest("#crea-conto")) creaConto();
});
$("pannello").addEventListener("change", e => {
  const el = e.target;
  if (!el.dataset.rinomina) return;
  const c = trovaConto(el.dataset.rinomina);
  if (!c) return;
  c.nome = el.value.trim() || "Senza nome";
  el.value = c.nome;
  salva(); renderPresto();
});
$("pannello").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "nuovo-nome") { e.preventDefault(); creaConto(); }
});

function creaConto() {
  const btc = tipoNuovo === "btc";
  const c = btc
    ? { id: nuovoId(), nome: NOME_BTC, etichetta: ETICHETTA_PREDEFINITA, btc: true, indirizzi: [] }
    : { id: nuovoId(), nome: ($("nuovo-nome").value || "").trim() || nomeEtichetta(tipoNuovo),
        etichetta: tipoNuovo, voci: [{ id: nuovoId(), nome: "Nuovo sottoconto" }] };
  stato.conti.push(c);
  $("nuovo-nome").value = "";
  if (!btc) daMettereAFuoco = c.voci[0].id;   // il nome del sottoconto si scrive subito
  apriMenu(false);
  tab = btc ? c.id : tipoNuovo;               // si apre subito dove è finita
  salva(); render();
  if (btc) { mostraPrezzo(); aggiornaBitcoin(); }
}

let larghezzaNota = 0, ridisegno = null;
window.addEventListener("resize", () => {
  if (document.body.clientWidth === larghezzaNota) return;
  larghezzaNota = document.body.clientWidth;
  clearTimeout(ridisegno);
  ridisegno = setTimeout(() => grafici.forEach(g => g.ridisegna()), 150);
});

/* ---------- installazione ---------- */
const bottoneInstalla = $("installa");
let eventoInstalla = null;
const giaInstallata = () =>
  matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  eventoInstalla = e;
  if (!giaInstallata()) bottoneInstalla.hidden = false;
});

bottoneInstalla.addEventListener("click", async () => {
  if (eventoInstalla) {
    eventoInstalla.prompt();
    const { outcome } = await eventoInstalla.userChoice;
    eventoInstalla = null;
    if (outcome === "accepted") bottoneInstalla.hidden = true;
    return;
  }
  // su iPhone non esiste beforeinstallprompt: restano le istruzioni
  avvisa("Su iPhone: tocca Condividi in Safari, poi Aggiungi a Home");
});

window.addEventListener("appinstalled", () => { bottoneInstalla.hidden = true; });
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !giaInstallata()) bottoneInstalla.hidden = false;

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // una versione nuova prende il posto di quella vecchia e la pagina si ricarica,
  // ma non alla prima visita: lì il controllo passa a una pagina che non ne aveva
  const primaVolta = !navigator.serviceWorker.controller;
  let ricaricato = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (primaVolta || ricaricato) return;
    ricaricato = true;
    location.reload();
  });
}

/* ---------- avvio ---------- */
async function aggiornaBitcoin() {
  const conti = stato.conti.filter(c => c.btc);
  if (!conti.length) return;
  const aperto = contoDelTab();
  if (aperto && aperto.btc) mostraPrezzo();
  await caricaLivello("lungo");            // serve a rivalutare i mesi passati
  await caricaPrezzoOra();
  render();
  await Promise.all(conti.map(caricaConto));
  render();
}

migra();
// il bottone deve raccontare lo stato che arriva dalla memoria, non quello scritto nel markup
$("occhio").setAttribute("aria-pressed", String(saldiVisibili));
$("occhio").setAttribute("aria-label", saldiVisibili ? "Nascondi i saldi" : "Mostra i saldi");
render();
osserva.observe($("cifrone"));
aggiornaBitcoin();
</script>
