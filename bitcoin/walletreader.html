<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saldo wallet Bitcoin</title>
<meta name="description" content="Saldo, movimenti e andamento storico di un indirizzo Bitcoin, letti direttamente dalla blockchain." />
<link rel="manifest" href="walletreader.webmanifest" />
<meta name="theme-color" content="#d9730d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wallet BTC" />
<link rel="apple-touch-icon" href="walletreader-icons/apple-touch-icon.png" />
<link rel="icon" href="walletreader-icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="walletreader-icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f5f0e6;
    --paper-2: #efe8da;
    --ink: #1b1713;
    --muted: #8c8071;
    --hair: #ddd3c2;
    --amber: #d9730d;
    --amber-soft: #f6e4cd;
    --in: #5d7a4d;
    --out: #b4502f;
    --shadow: 0 1px 0 rgba(27,23,19,.04), 0 18px 40px -28px rgba(27,23,19,.45);
    --display: "Space Grotesk", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--paper-2), var(--paper) 60%);
    color: var(--ink);
    font-family: var(--display);
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px) clamp(14px, 4vw, 24px) 64px;
  }

  .sheet { width: 100%; max-width: 620px; }

  /* ---- header ---- */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .mark {
    width: 26px; height: 26px; flex: none;
    border-radius: 50%;
    background: var(--amber);
    color: var(--paper);
    display: grid; place-items: center;
    font-weight: 700; font-size: 16px;
    font-family: var(--display);
    box-shadow: 0 4px 12px -4px rgba(217,115,13,.7);
  }
  h1 {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 600;
    letter-spacing: -.02em;
    margin: 0 0 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .sub { color: var(--muted); margin: 0 0 26px; font-size: 15px; }

  /* ---- search ---- */
  .search {
    display: flex;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 8px;
    box-shadow: var(--shadow);
  }
  .search input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink);
    padding: 10px 12px;
  }
  .search input::placeholder { color: #b8ad9c; }
  .search input:focus { outline: none; }
  .search button {
    flex: none;
    border: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    padding: 0 18px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .search button:hover { background: #000; }
  .search button:active { transform: translateY(1px); }
  .search:focus-within { border-color: var(--amber); }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 2px 0;
    align-items: center;
  }
  .examples span { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .chip {
    border: 1px dashed var(--hair);
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--amber); color: var(--amber); }

  /* ---- saved addresses ---- */
  #saved:not(:empty) { margin-top: 22px; }
  .saved-head {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 11px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--muted); margin: 0 2px 10px;
  }
  .saved-list { display: flex; flex-direction: column; gap: 8px; }
  .saved-item {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid var(--hair);
    border-radius: 12px; padding: 10px 10px 10px 14px;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  .saved-item.active { border-color: var(--amber); }
  .saved-main { flex: 1; min-width: 0; cursor: pointer; }
  .saved-label {
    border: 0; background: transparent; width: 100%;
    font-family: var(--display); font-weight: 600; font-size: 14px;
    color: var(--ink); padding: 0; margin-bottom: 1px;
  }
  .saved-label::placeholder { color: #b8ad9c; font-weight: 500; }
  .saved-label:focus { outline: none; color: var(--amber); }
  .saved-addr {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .saved-load, .saved-del {
    flex: none; border: 1px solid var(--hair); background: var(--paper);
    border-radius: 8px; cursor: pointer; font-family: var(--mono);
    color: var(--muted); transition: color .15s, border-color .15s;
  }
  .saved-load { font-size: 11px; letter-spacing: .04em; padding: 6px 10px; }
  .saved-load:hover { color: var(--amber); border-color: var(--amber); }
  .saved-del { width: 30px; height: 30px; font-size: 16px; line-height: 1; }
  .saved-del:hover { color: var(--out); border-color: var(--out); }

  .save-btn {
    border: 1px solid var(--hair); background: var(--paper);
    color: var(--muted); font-family: var(--mono);
    font-size: 11px; letter-spacing: .04em; padding: 5px 9px;
    border-radius: 7px; cursor: pointer; flex: none;
  }
  .save-btn:hover { color: var(--ink); border-color: var(--muted); }
  .save-btn.on { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }

  /* ---- states ---- */
  .state {
    margin-top: 30px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .state.error {
    border: 1px solid #e7c4b6;
    background: #fbeee8;
    color: var(--out);
    border-radius: 12px;
    padding: 16px;
    text-align: left;
    font-size: 14px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid var(--hair);
    border-top-color: var(--amber);
    border-radius: 50%;
    margin: 0 auto 10px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- results ---- */
  #out { margin-top: 28px; }
  .reveal { animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 16px;
  }

  .addr-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .addr {
    font-family: var(--mono);
    font-size: 13px;
    word-break: break-all;
    color: var(--muted);
    flex: 1;
    min-width: 0;
  }
  .copy {
    border: 1px solid var(--hair);
    background: var(--paper);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .04em;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    flex: none;
  }
  .copy:hover { color: var(--ink); border-color: var(--muted); }

  .balance-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 6px;
  }
  .balance {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(30px, 9vw, 46px);
    letter-spacing: -.02em;
    line-height: 1;
    word-break: break-word;
  }
  .balance .unit { color: var(--amber); font-size: .5em; margin-left: 8px; letter-spacing: 0; }
  .fiat { color: var(--muted); font-family: var(--mono); font-size: 15px; margin-top: 8px; }
  .pending {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--amber);
    background: var(--amber-soft);
    border-radius: 8px;
    padding: 8px 12px;
    display: inline-block;
  }

  /* receipt-style leader lines (the signature) */
  .lines { display: flex; flex-direction: column; gap: 13px; }
  .line { display: flex; align-items: baseline; gap: 6px; font-size: 14px; }
  .line .k { color: var(--muted); white-space: nowrap; }
  .line .lead { flex: 1; border-bottom: 1.5px dotted var(--hair); transform: translateY(-4px); min-width: 12px; }
  .line .v { font-family: var(--mono); font-weight: 500; white-space: nowrap; }

  .sec-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 2px 0 16px;
  }

  .tx {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-top: 1px solid var(--hair);
  }
  .tx:first-of-type { border-top: 0; padding-top: 0; }
  .tx-ico {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 700; font-size: 15px;
  }
  .tx-ico.in { background: #e7efe2; color: var(--in); }
  .tx-ico.out { background: #f6e3db; color: var(--out); }
  .tx-mid { flex: 1; min-width: 0; }
  .tx-id {
    font-family: var(--mono); font-size: 12px;
    color: var(--ink); text-decoration: none;
    display: inline-block; word-break: break-all;
  }
  .tx-id:hover { color: var(--amber); }
  .tx-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tx-amt { flex: none; text-align: right; font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .tx-amt.in { color: var(--in); }
  .tx-amt.out { color: var(--out); }
  .tx-amt small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .badge-pending {
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
    color: var(--amber); border: 1px solid var(--amber);
    border-radius: 4px; padding: 0 4px; margin-left: 6px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 26px;
    line-height: 1.7;
  }
  footer a { color: var(--muted); }

  /* ---- grafico storico ---- */
  .chart-card { padding: 20px 16px 16px; }
  .chart-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; padding: 0 6px;
  }
  .chart-price {
    font-family: var(--mono); font-weight: 700; font-size: 24px;
    letter-spacing: -.02em; line-height: 1.1;
  }
  .chart-price .muted { color: var(--muted); font-weight: 400; font-size: 13px; }
  .chart-delta { font-family: var(--mono); font-size: 13px; margin-top: 4px; }
  .chart-delta.up { color: var(--in); }
  .chart-delta.down { color: var(--out); }
  .range { display: flex; gap: 4px; flex: none; }
  .range button {
    border: 1px solid var(--hair); background: var(--paper);
    color: var(--muted); font-family: var(--mono); font-size: 11px;
    letter-spacing: .06em; padding: 5px 9px; border-radius: 7px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .range button:hover { color: var(--amber); border-color: var(--amber); }
  .range button.on { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
  .chart-wrap { margin-top: 14px; touch-action: pan-y; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap svg text { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
  .chart-wrap .grid { stroke: var(--hair); stroke-width: 1; }
  .chart-wrap .curve { stroke: var(--amber); stroke-width: 2; fill: none; }
  .chart-wrap .fill { fill: url(#fillAmber); }
  .chart-wrap .stop-a { stop-color: #d9730d; stop-opacity: .22; }
  .chart-wrap .stop-b { stop-color: #d9730d; stop-opacity: 0; }
  .chart-wrap .dot { fill: var(--amber); }
  .chart-wrap .cross-line { stroke: var(--ink); stroke-width: 1; opacity: .45; }
  .chart-wrap .cross-dot { fill: #fff; stroke: var(--amber); stroke-width: 2; }
  .chart-wrap .tip-bg { fill: var(--ink); opacity: .92; }
  .chart-wrap .tip-v { fill: var(--paper); font-weight: 700; }
  .chart-wrap .tip-d { fill: #c9bfae; font-size: 11px; }
  .chart-foot {
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 10px 6px 0; margin-top: 4px; border-top: 1px solid var(--hair);
  }
  .chart-note { color: var(--amber); }
  .chart-state { min-height: 150px; display: grid; place-items: center; }

  /* ---- installazione ---- */
  .btn-install {
    border: 1px solid var(--amber); background: var(--amber-soft);
    color: var(--amber); font-family: var(--mono); font-size: 11px;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 7px 12px; border-radius: 8px; cursor: pointer; flex: none;
    transition: background .15s, color .15s;
  }
  .btn-install:hover { background: var(--amber); color: var(--paper); }
  .btn-install[hidden] { display: none; }
  h1 .btn-install { margin-left: auto; align-self: center; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    font-size: 13px; padding: 11px 16px; border-radius: 10px;
    max-width: min(92vw, 420px); text-align: center; z-index: 20;
    box-shadow: 0 18px 40px -20px rgba(27,23,19,.8);
    animation: rise .25s ease both;
  }
  .toast[hidden] { display: none; }

  @media (max-width: 420px) {
    .card { padding: 18px; }
    .chart-card { padding: 16px 12px 12px; }
    .search button { padding: 0 14px; }
    h1 .btn-install { font-size: 10px; padding: 6px 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .spinner, .toast { animation: none; }
  }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
  <main class="sheet">
    <h1 class="title">
      <span class="mark">₿</span> Saldo wallet Bitcoin
      <button class="btn-install" id="install" hidden>Installa</button>
    </h1>

    <div class="search">
      <input id="addr" type="text" inputmode="text" autocomplete="off" spellcheck="false"
             placeholder="bc1q… · 3… · 1…" aria-label="Indirizzo Bitcoin" />
      <button id="go">Leggi</button>
    </div>

    <div id="saved"></div>

    <div id="out"></div>

    <section class="card chart-card" id="chart-card">
      <div class="chart-head">
        <div>
          <div class="sec-title">Bitcoin · andamento</div>
          <div class="chart-price" id="chart-price"><span class="muted">…</span></div>
          <div class="chart-delta" id="chart-delta"></div>
        </div>
        <div class="range" id="chart-range" role="group" aria-label="Periodo del grafico">
          <button type="button" data-years="1">1A</button>
          <button type="button" data-years="3">3A</button>
          <button type="button" data-years="5" class="on">5A</button>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <div class="state chart-state"><div class="spinner"></div>Carico lo storico…</div>
      </div>
      <div class="chart-foot">
        <span id="chart-range-label"></span>
        <span id="chart-source"></span>
      </div>
    </section>

    <footer>Dati on-chain via Blockstream · prezzi CoinGecko, Kraken, Bitstamp</footer>
  </main>

  <div class="toast" id="toast" hidden></div>

<script>
const API = "https://blockstream.info/api";
const SAT = 1e8;
const out = document.getElementById("out");
const input = document.getElementById("addr");
let priceEur = null;

const fmtBtc = (sats) => (sats / SAT).toLocaleString("it-IT", { minimumFractionDigits: 8, maximumFractionDigits: 8 });
const fmtEur = (v) => v.toLocaleString("it-IT", { style: "currency", currency: "EUR" });
const fmtInt = (n) => n.toLocaleString("it-IT");

function addrType(a) {
  if (a.startsWith("bc1p")) return "Taproot (P2TR)";
  if (a.startsWith("bc1")) return "SegWit nativo (Bech32)";
  if (a.startsWith("3")) return "SegWit annidato (P2SH)";
  if (a.startsWith("1")) return "Legacy (P2PKH)";
  if (a.startsWith("tb1") || a.startsWith("m") || a.startsWith("n") || a.startsWith("2")) return "Testnet";
  return "Sconosciuto";
}

function timeAgo(ts) {
  if (!ts) return "in attesa";
  const s = Math.floor(Date.now() / 1000 - ts);
  if (s < 60) return "ora";
  const m = Math.floor(s / 60); if (m < 60) return `${m} min fa`;
  const h = Math.floor(m / 60); if (h < 24) return `${h} h fa`;
  const d = Math.floor(h / 24); if (d < 30) return `${d} g fa`;
  const mo = Math.floor(d / 30); if (mo < 12) return `${mo} mesi fa`;
  return `${Math.floor(mo / 12)} anni fa`;
}

function txDelta(tx, addr) {
  let v = 0;
  for (const o of tx.vout || []) if (o.scriptpubkey_address === addr) v += o.value;
  for (const i of tx.vin || []) if (i.prevout && i.prevout.scriptpubkey_address === addr) v -= i.prevout.value;
  return v;
}

function showState(html, cls = "") {
  out.innerHTML = `<div class="state ${cls}">${html}</div>`;
}

async function fetchPrice() {
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur");
    if (r.ok) priceEur = (await r.json()).bitcoin.eur;
  } catch (_) { /* prezzo opzionale: si ignora */ }
}

async function lookup(addr) {
  addr = addr.trim();
  if (!addr) { input.focus(); return; }
  input.value = addr;
  showState('<div class="spinner"></div>Lettura dalla blockchain…');

  try {
    const [statsRes, txRes] = await Promise.all([
      fetch(`${API}/address/${addr}`),
      fetch(`${API}/address/${addr}/txs`)
    ]);

    if (statsRes.status === 400 || statsRes.status === 404) {
      showState(`Indirizzo non valido o senza dati on-chain.<br>Controlla di aver incollato un indirizzo Bitcoin mainnet completo.`, "error");
      return;
    }
    if (!statsRes.ok) throw new Error("HTTP " + statsRes.status);

    const stats = await statsRes.json();
    const txs = txRes.ok ? await txRes.json() : [];
    render(addr, stats, txs);
  } catch (e) {
    showState(`Non riesco a contattare il servizio. Verifica la connessione e riprova.<br><small>${e.message}</small>`, "error");
  }
}

function render(addr, s, txs) {
  const c = s.chain_stats, m = s.mempool_stats;
  const confirmed = c.funded_txo_sum - c.spent_txo_sum;
  const pending = m.funded_txo_sum - m.spent_txo_sum;
  const utxo = (c.funded_txo_count - c.spent_txo_count) + (m.funded_txo_count - m.spent_txo_count);
  const txCount = c.tx_count + m.tx_count;

  const fiatLine = priceEur !== null
    ? `<div class="fiat">≈ ${fmtEur(confirmed / SAT * priceEur)} &nbsp;·&nbsp; 1 BTC = ${fmtEur(priceEur)}</div>` : "";

  const pendingLine = pending !== 0
    ? `<div class="pending">In attesa: ${pending > 0 ? "+" : ""}${fmtBtc(pending)} BTC</div>` : "";

  const txList = txs.length ? txs.slice(0, 15).map(tx => {
    const d = txDelta(tx, addr);
    const dir = d >= 0 ? "in" : "out";
    const ts = tx.status && tx.status.block_time;
    const height = tx.status && tx.status.confirmed ? `blocco ${fmtInt(tx.status.block_height)}` : "mempool";
    const pend = !(tx.status && tx.status.confirmed) ? '<span class="badge-pending">PENDING</span>' : "";
    const eur = priceEur !== null ? `<small>${fmtEur(Math.abs(d) / SAT * priceEur)}</small>` : "";
    return `
      <div class="tx">
        <div class="tx-ico ${dir}">${d >= 0 ? "↓" : "↑"}</div>
        <div class="tx-mid">
          <a class="tx-id" href="https://blockstream.info/tx/${tx.txid}" target="_blank" rel="noopener">${tx.txid.slice(0,16)}…${tx.txid.slice(-6)}</a>${pend}
          <div class="tx-meta">${height} · ${timeAgo(ts)}</div>
        </div>
        <div class="tx-amt ${dir}">${d >= 0 ? "+" : "−"}${fmtBtc(Math.abs(d))}${eur}</div>
      </div>`;
  }).join("") : `<div class="state">Nessuna transazione trovata.</div>`;

  out.innerHTML = `
    <div class="reveal">
      <div class="card">
        <div class="addr-row">
          <span class="addr">${addr}</span>
          <button class="save-btn" id="save">★ Salva</button>
          <button class="copy" id="copy">COPIA</button>
        </div>
        <div class="balance-label">Saldo confermato</div>
        <div class="balance">${fmtBtc(confirmed)}<span class="unit">BTC</span></div>
        ${fiatLine}
        ${pendingLine}
      </div>

      <div class="card">
        <div class="lines">
          <div class="line"><span class="k">Totale ricevuto</span><span class="lead"></span><span class="v">${fmtBtc(c.funded_txo_sum)} BTC</span></div>
          <div class="line"><span class="k">Totale inviato</span><span class="lead"></span><span class="v">${fmtBtc(c.spent_txo_sum)} BTC</span></div>
          <div class="line"><span class="k">Transazioni</span><span class="lead"></span><span class="v">${fmtInt(txCount)}</span></div>
          <div class="line"><span class="k">UTXO non spesi</span><span class="lead"></span><span class="v">${fmtInt(utxo)}</span></div>
          <div class="line"><span class="k">Tipo indirizzo</span><span class="lead"></span><span class="v">${addrType(addr)}</span></div>
        </div>
      </div>

      <div class="card">
        <div class="sec-title">Movimenti recenti${txs.length > 15 ? " · ultimi 15" : ""}</div>
        ${txList}
      </div>
    </div>`;

  const copyBtn = document.getElementById("copy");
  copyBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(addr); copyBtn.textContent = "COPIATO"; setTimeout(() => copyBtn.textContent = "COPIA", 1200); } catch (_) {}
  });

  const saveBtn = document.getElementById("save");
  const syncSaveBtn = () => {
    const on = isSaved(addr);
    saveBtn.classList.toggle("on", on);
    saveBtn.textContent = on ? "★ Salvato" : "★ Salva";
  };
  syncSaveBtn();
  saveBtn.addEventListener("click", () => {
    if (isSaved(addr)) removeSaved(addr); else addSaved(addr);
    syncSaveBtn();
    renderSaved();
  });

  renderSaved();
}

/* ---------- indirizzi salvati (persistenza locale) ---------- */
const STORE_KEY = "btc_saved_addresses_v1";
const savedBox = document.getElementById("saved");
let savedList = loadSaved();

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch (_) { return []; }
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(savedList)); }
  catch (_) { /* storage non disponibile: resta valido per la sessione */ }
}
function isSaved(addr) { return savedList.some(x => x.address === addr); }
function addSaved(addr) {
  if (!isSaved(addr)) { savedList.unshift({ address: addr, label: "", ts: Date.now() }); persist(); }
}
function removeSaved(addr) { savedList = savedList.filter(x => x.address !== addr); persist(); }
function renameSaved(addr, label) {
  const it = savedList.find(x => x.address === addr);
  if (it) { it.label = label; persist(); }
}

function renderSaved() {
  if (!savedList.length) { savedBox.innerHTML = ""; return; }
  const current = (input.value || "").trim();
  savedBox.innerHTML = `
    <div class="saved-head"><span>I tuoi indirizzi · ${savedList.length}</span></div>
    <div class="saved-list">
      ${savedList.map(it => `
        <div class="saved-item ${it.address === current ? "active" : ""}" data-a="${it.address}">
          <div class="saved-main">
            <input class="saved-label" value="${(it.label || "").replace(/"/g, "&quot;")}"
                   placeholder="Aggiungi un'etichetta…" aria-label="Etichetta" />
            <div class="saved-addr" title="${it.address}">${it.address.slice(0, 12)}…${it.address.slice(-8)} · ${addrType(it.address)}</div>
          </div>
          <button class="saved-load" data-load="${it.address}">Carica</button>
          <button class="saved-del" data-del="${it.address}" aria-label="Rimuovi">×</button>
        </div>`).join("")}
    </div>`;

  savedBox.querySelectorAll(".saved-label").forEach(inp => {
    const addr = inp.closest(".saved-item").dataset.a;
    inp.addEventListener("change", () => renameSaved(addr, inp.value.trim()));
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
  });
  savedBox.querySelectorAll("[data-load]").forEach(b =>
    b.addEventListener("click", () => lookup(b.dataset.load)));
  savedBox.querySelectorAll(".saved-addr").forEach(el =>
    el.addEventListener("click", () => lookup(el.closest(".saved-item").dataset.a)));
  savedBox.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => { removeSaved(b.dataset.del); renderSaved(); }));
}

document.getElementById("go").addEventListener("click", () => lookup(input.value));
input.addEventListener("keydown", e => { if (e.key === "Enter") lookup(input.value); });

/* ---------- grafico storico del prezzo ---------- */
/* Tre sorgenti in cascata: la prima che risponde con abbastanza storia vince.
   CoinGecko resta per ultima perché il piano gratuito si ferma a un anno. */
const CHART_SOURCES = [
  {
    label: "Kraken (XBT/EUR)",
    url: "https://api.kraken.com/0/public/OHLC?pair=XBTEUR&interval=10080",
    parse(j) {
      if (j.error && j.error.length) throw new Error(j.error[0]);
      const key = Object.keys(j.result || {}).find(k => k !== "last");
      return (j.result[key] || []).map(r => [r[0] * 1000, +r[4]]);
    }
  },
  {
    label: "Bitstamp (BTC/EUR)",
    url: "https://www.bitstamp.net/api/v2/ohlc/btceur/?step=259200&limit=650",
    parse: j => (j.data.ohlc || []).map(c => [+c.timestamp * 1000, +c.close])
  },
  {
    label: "CoinGecko (solo 1 anno)",
    url: "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=eur&days=365&interval=daily",
    parse: j => (j.prices || []).map(p => [p[0], p[1]])
  }
];

const CHART_KEY = "btc_price_history_v1";
const CHART_TTL = 6 * 60 * 60 * 1000;
const ANNO = 365.25 * 24 * 3600 * 1000;

const chartWrap = document.getElementById("chart-wrap");

// il viewBox segue la larghezza reale del contenitore: se lo scalassimo da 720 a
// 360 anche le scritte dentro l'SVG si dimezzerebbero, diventando illeggibili
let W = 720, H = 300, PX0 = 4, PX1 = 664, PY0 = 18, PY1 = 274;
function dimensiona() {
  W = Math.round(Math.min(Math.max(chartWrap.clientWidth || 620, 300), 720));
  H = W < 480 ? 230 : 300;
  PX0 = 4;
  PX1 = W - (W < 480 ? 46 : 56);
  PY0 = 18;
  PY1 = H - 26;
}
const fmtEur0 = v => v.toLocaleString("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const fmtAsse = v => v >= 1000
  ? "€ " + (v / 1000).toLocaleString("it-IT", { maximumFractionDigits: 1 }) + "k"
  : "€ " + Math.round(v);
const fmtMese = ts => new Date(ts).toLocaleDateString("it-IT", { month: "short", year: "numeric" });
const fmtGiorno = ts => new Date(ts).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });

let serie = [];          // storico completo [[ms, prezzo], …]
let fonte = "";
let anni = 5;            // periodo mostrato: la richiesta parte da 5 anni

function pulisci(punti) {
  return punti
    .filter(p => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1]) && p[1] > 0)
    .sort((a, b) => a[0] - b[0]);
}

function leggiCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CHART_KEY));
    if (c && Array.isArray(c.serie) && c.serie.length > 30) return c;
  } catch (_) { /* cache illeggibile: si riparte dalla rete */ }
  return null;
}

async function caricaStorico() {
  const cache = leggiCache();
  if (cache && Date.now() - cache.ts < CHART_TTL) {
    serie = cache.serie; fonte = cache.fonte;
    disegnaTutto();
    return;
  }

  for (const src of CHART_SOURCES) {
    try {
      const r = await fetch(src.url);
      if (!r.ok) continue;
      const punti = pulisci(src.parse(await r.json()));
      if (punti.length < 30) continue;
      serie = punti; fonte = src.label;
      try { localStorage.setItem(CHART_KEY, JSON.stringify({ ts: Date.now(), fonte, serie })); }
      catch (_) { /* storage pieno o negato: il grafico resta valido per la sessione */ }
      disegnaTutto();
      return;
    } catch (_) { /* sorgente muta: si prova la prossima */ }
  }

  if (cache) {                       // rete giù ma qualcosa in cache c'è: meglio del vuoto
    serie = cache.serie; fonte = cache.fonte + " · dati del " + fmtGiorno(cache.ts);
    disegnaTutto();
    return;
  }
  chartWrap.innerHTML = '<div class="state error">Non riesco a scaricare lo storico dei prezzi. Riprova più tardi.</div>';
}

function finestra() {
  const taglio = Date.now() - anni * ANNO;
  const w = serie.filter(p => p[0] >= taglio);
  return w.length >= 2 ? w : serie.slice(-2);
}

function tacche(min, max, n = 4) {
  const span = (max - min) || max || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const norm = span / n / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const t = [];
  for (let v = Math.ceil(min / step) * step; v <= max; v += step) t.push(v);
  return t;
}

function disegnaTutto() {
  const w = finestra();
  disegnaGrafico(w);
  aggiornaTesta(w);
  if (priceEur === null && serie.length) priceEur = serie[serie.length - 1][1];
}

function aggiornaTesta(w) {
  const ultimo = w[w.length - 1][1], primo = w[0][1];
  const varPct = (ultimo - primo) / primo * 100;
  const su = varPct >= 0;
  const mesi = Math.round((w[w.length - 1][0] - w[0][0]) / ANNO * 12);
  const periodo = mesi >= 24 ? `${Math.round(mesi / 12)} anni` : `${mesi} mesi`;

  document.getElementById("chart-price").textContent = fmtEur0(ultimo);
  const delta = document.getElementById("chart-delta");
  delta.className = "chart-delta " + (su ? "up" : "down");
  delta.textContent = `${su ? "▲" : "▼"} ${su ? "+" : "−"}${Math.abs(varPct).toLocaleString("it-IT", { maximumFractionDigits: 1 })}% · ${periodo}`;

  const min = Math.min(...w.map(p => p[1])), max = Math.max(...w.map(p => p[1]));
  document.getElementById("chart-range-label").textContent =
    `${fmtMese(w[0][0])} → ${fmtMese(w[w.length - 1][0])} · min ${fmtEur0(min)} · max ${fmtEur0(max)}`;

  const parziale = anni === 5 && (w[w.length - 1][0] - w[0][0]) < 4.5 * ANNO;
  const src = document.getElementById("chart-source");
  src.className = parziale ? "chart-note" : "";
  src.textContent = parziale ? `storico disponibile: ${periodo} · ${fonte}` : `fonte: ${fonte}`;
}

function disegnaGrafico(w) {
  dimensiona();
  const t0 = w[0][0], t1 = w[w.length - 1][0];
  const lo = Math.min(...w.map(p => p[1])), hi = Math.max(...w.map(p => p[1]));
  const margine = (hi - lo) * .12 || hi * .1;
  const yLo = Math.max(0, lo - margine), yHi = hi + margine;

  const X = t => PX0 + (t - t0) / ((t1 - t0) || 1) * (PX1 - PX0);
  const Y = v => PY1 - (v - yLo) / ((yHi - yLo) || 1) * (PY1 - PY0);
  const r = n => Math.round(n * 10) / 10;

  const punti = w.map(p => [r(X(p[0])), r(Y(p[1]))]);
  const linea = punti.map((p, i) => `${i ? "L" : "M"}${p[0]} ${p[1]}`).join(" ");
  const area = `${linea} L${punti[punti.length - 1][0]} ${PY1} L${punti[0][0]} ${PY1} Z`;

  const griglia = tacche(yLo, yHi).map(v => `
    <line class="grid" x1="${PX0}" y1="${r(Y(v))}" x2="${PX1}" y2="${r(Y(v))}" stroke-dasharray="2 4"/>
    <text x="${PX1 + 7}" y="${r(Y(v)) + 4}">${fmtAsse(v)}</text>`).join("");

  const primoAnno = new Date(t0).getFullYear(), ultimoAnno = new Date(t1).getFullYear();
  const salto = Math.ceil((ultimoAnno - primoAnno + 1) / 6);
  let assi = "";
  for (let a = primoAnno + 1; a <= ultimoAnno; a++) {
    if ((a - primoAnno - 1) % salto) continue;
    const t = Date.UTC(a, 0, 1);
    if (t < t0 || t > t1) continue;
    assi += `
      <line class="grid" x1="${r(X(t))}" y1="${PY0}" x2="${r(X(t))}" y2="${PY1}"/>
      <text x="${r(X(t))}" y="${H - 8}" text-anchor="middle">${a}</text>`;
  }

  const fine = punti[punti.length - 1];
  chartWrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Prezzo di Bitcoin in euro da ${fmtMese(t0)} a ${fmtMese(t1)}">
      <defs>
        <linearGradient id="fillAmber" x1="0" y1="0" x2="0" y2="1">
          <stop class="stop-a" offset="0%"/>
          <stop class="stop-b" offset="100%"/>
        </linearGradient>
      </defs>
      ${assi}${griglia}
      <path class="fill" d="${area}"/>
      <path class="curve" d="${linea}" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${fine[0]}" cy="${fine[1]}" r="3.5"/>
      <g id="cross" style="display:none" pointer-events="none">
        <line class="cross-line" y1="${PY0}" y2="${PY1}" stroke-dasharray="3 3"/>
        <circle class="cross-dot" r="4"/>
        <rect class="tip-bg" rx="6" height="38" width="124"/>
        <text class="tip-v"></text>
        <text class="tip-d"></text>
      </g>
      <rect x="${PX0}" y="${PY0}" width="${PX1 - PX0}" height="${PY1 - PY0}" fill="transparent" id="hit"/>
    </svg>`;

  collegaCrosshair(w, X, Y);
}

function collegaCrosshair(w, X, Y) {
  const svg = chartWrap.querySelector("svg");
  const g = svg.querySelector("#cross");
  const linea = g.querySelector(".cross-line");
  const dot = g.querySelector(".cross-dot");
  const box = g.querySelector(".tip-bg");
  const prezzo = g.querySelector(".tip-v");
  const data = g.querySelector(".tip-d");

  const muovi = e => {
    const box0 = svg.getBoundingClientRect();
    const vx = (e.clientX - box0.left) / box0.width * W;
    let i = 0, best = Infinity;
    w.forEach((p, k) => { const d = Math.abs(X(p[0]) - vx); if (d < best) { best = d; i = k; } });
    const [t, v] = w[i], x = X(t), y = Y(v);

    linea.setAttribute("x1", x); linea.setAttribute("x2", x);
    dot.setAttribute("cx", x); dot.setAttribute("cy", y);
    const bx = Math.min(Math.max(x - 62, PX0), Math.max(PX0, PX1 - 124));
    box.setAttribute("x", bx); box.setAttribute("y", PY0 - 4);
    prezzo.setAttribute("x", bx + 10); prezzo.setAttribute("y", PY0 + 12);
    prezzo.textContent = fmtEur0(v);
    data.setAttribute("x", bx + 10); data.setAttribute("y", PY0 + 27);
    data.textContent = fmtGiorno(t);
    g.style.display = "";
  };

  svg.addEventListener("pointermove", muovi);
  svg.addEventListener("pointerdown", muovi);
  svg.addEventListener("pointerleave", () => { g.style.display = "none"; });
}

// ridisegno quando cambia la larghezza (rotazione dello schermo compresa)
let larghezzaNota = 0, ridisegno = null;
window.addEventListener("resize", () => {
  if (!serie.length || chartWrap.clientWidth === larghezzaNota) return;
  larghezzaNota = chartWrap.clientWidth;
  clearTimeout(ridisegno);
  ridisegno = setTimeout(disegnaTutto, 150);
});

document.getElementById("chart-range").addEventListener("click", e => {
  const b = e.target.closest("button[data-years]");
  if (!b) return;
  anni = +b.dataset.years;
  document.querySelectorAll("#chart-range button").forEach(x => x.classList.toggle("on", x === b));
  if (serie.length) disegnaTutto();
});

/* ---------- installazione dell'app ---------- */
const toastBox = document.getElementById("toast");
let toastTimer = null;
function toast(msg) {
  toastBox.textContent = msg;
  toastBox.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastBox.hidden = true; }, 4200);
}

const btnInstall = document.getElementById("install");
let installEvent = null;
const isStandalone = () =>
  matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installEvent = e;
  if (!isStandalone()) btnInstall.hidden = false;
});

btnInstall.addEventListener("click", async () => {
  if (installEvent) {
    installEvent.prompt();
    const { outcome } = await installEvent.userChoice;
    installEvent = null;
    if (outcome === "accepted") btnInstall.hidden = true;
    return;
  }
  // iPhone e iPad: niente prompt automatico, servono le istruzioni
  toast("Su iPhone: tocca Condividi in Safari, poi Aggiungi a Home");
});

window.addEventListener("appinstalled", () => { btnInstall.hidden = true; });

// su iOS il bottone va mostrato a mano: beforeinstallprompt non esiste
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !isStandalone()) btnInstall.hidden = false;

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("walletreader-sw.js").catch(() => {});
  });
  // quando entra in servizio una versione nuova ricarico, così pagina e cache vanno d'accordo
  let ricaricato = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (ricaricato) return;
    ricaricato = true;
    location.reload();
  });
}

renderSaved();
fetchPrice();
caricaStorico();
</script>
