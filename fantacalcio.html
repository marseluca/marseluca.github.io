<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asta Fantacalcio</title>
  <meta name="description" content="Gestione dell'asta del fantacalcio: crediti, slot per reparto e rosa dal listone ufficiale 2026/27." />
  <link rel="manifest" href="fantacalcio.webmanifest" />
  <meta name="theme-color" content="#0e7c8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Asta" />
  <link rel="apple-touch-icon" href="fantacalcio-icons/apple-touch-icon.png" />
  <link rel="icon" href="fantacalcio-icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" />
  <style>
    :root {
      --bg:      #eef3f6;
      --card:    #ffffff;
      --ink:     #10242e;
      --muted:   #5d727d;
      --line:    #e0e8ec;

      --brand:   #0e7c8a;
      --brand-2: #0f9b6c;
      --deep:    #15507e;
      --gold:    #e8a70c;

      --p: #e8930c;
      --d: #10a171;
      --c: #3b74e8;
      --a: #e0453c;

      --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --radius: 16px;
      --maxw: 720px;
      --shadow: 0 10px 30px rgba(16, 36, 46, 0.08);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--body); font-size: 17px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- testata ---------- */
    .app-head {
      background: linear-gradient(135deg, var(--brand-2) 0%, var(--brand) 52%, var(--deep) 100%);
      color: #fff;
      padding: calc(1.2rem + env(safe-area-inset-top)) clamp(1.1rem, 5vw, 1.8rem) 1.4rem;
    }
    .app-head .top {
      max-width: var(--maxw); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .logo { display: flex; align-items: center; gap: 0.6rem; }
    .logo svg { width: 34px; height: 34px; flex: none; }
    .logo h1 {
      font-family: var(--display); font-weight: 700; letter-spacing: -0.02em;
      font-size: clamp(1.25rem, 5vw, 1.6rem); margin: 0; line-height: 1.1;
    }
    .season { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
    .btn-install {
      font-family: var(--body); font-weight: 600; font-size: 0.85rem; color: #fff;
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.45);
      border-radius: 999px; padding: 0.45rem 0.95rem; cursor: pointer; white-space: nowrap;
    }
    .btn-install:hover { background: rgba(255,255,255,0.28); }
    .btn-install[hidden] { display: none; }

    /* ---------- barra di ricerca, sempre in cima ---------- */
    .searchbar {
      position: sticky; top: 0; z-index: 35;
      background: linear-gradient(180deg, rgba(238,243,246,0.98), rgba(238,243,246,0.94));
      backdrop-filter: blur(8px);
      padding: 0.75rem clamp(1.1rem, 5vw, 1.8rem);
      border-bottom: 1px solid var(--line);
    }
    .searchbar .in { position: relative; max-width: var(--maxw); margin: 0 auto; }
    .searchbar .lens {
      position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none;
    }
    .searchbar input {
      padding-left: 2.55rem; padding-right: 2.4rem;
      background: #fff; box-shadow: var(--shadow); border-color: transparent;
    }
    .searchbar .clear {
      position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
      border: none; background: #eef3f6; color: var(--muted); cursor: pointer;
      width: 28px; height: 28px; border-radius: 50%; font-size: 1.1rem; line-height: 1;
    }
    .searchbar .clear[hidden] { display: none; }

    .suggest {
      position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; right: 0;
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 16px 38px rgba(16, 36, 46, 0.18);
      max-height: min(60vh, 380px); overflow-y: auto; padding: 0.3rem; margin: 0; list-style: none;
    }
    .suggest[hidden] { display: none; }
    .suggest li {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.5rem; border-radius: 10px; cursor: pointer; font-size: 0.95rem;
    }
    .suggest li[aria-selected="true"] { background: #edf5f7; }
    .suggest .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .suggest .cl { color: var(--muted); font-size: 0.82rem; }
    .suggest .qt { font-family: var(--display); font-weight: 700; white-space: nowrap; }
    .suggest .star { color: var(--gold); }
    .suggest .manual { color: var(--muted); font-size: 0.9rem; }

    /* ---------- contenuto ---------- */
    .wrap { max-width: var(--maxw); margin: 0 auto;
            padding: 1.2rem clamp(1.1rem, 5vw, 1.8rem) calc(var(--tabh, 4.2rem) + 1.5rem); }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
    .stat { border-radius: var(--radius); padding: 1rem 1.1rem; color: #fff; box-shadow: var(--shadow); }
    .stat.rosa  { background: linear-gradient(135deg, #6d4bd8, #9b4bd8); }
    .stat.offer { background: linear-gradient(135deg, #0f9b6c, #12b3a0); }
    .stat .n { font-family: var(--display); font-weight: 700; font-size: 1.85rem; line-height: 1; }
    .stat .l { font-size: 0.8rem; opacity: 0.92; margin-top: 0.3rem; }

    .meter { margin: 1.1rem 0 0.5rem; }
    .meter .track { height: 10px; border-radius: 999px; background: #dde6ea; overflow: hidden; }
    .meter .fill { height: 100%; width: 0; border-radius: 999px; transition: width 0.25s ease, background 0.25s ease; }
    .meter .cap { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--muted); margin-top: 0.4rem; }

    .card { background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 1.2rem; box-shadow: var(--shadow); }

    .sec { font-family: var(--display); font-size: 0.76rem; font-weight: 600;
           letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
           margin: 1.8rem 0 0.8rem; }

    label { font-size: 0.76rem; font-weight: 600; color: var(--muted); }
    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    input, select {
      font-family: var(--body); font-size: 1rem; color: var(--ink);
      background: #fbfdfe; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 0.65rem 0.75rem; width: 100%;
    }
    input:focus, select:focus {
      outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14, 124, 138, 0.16);
    }

    .btn {
      font-family: var(--body); font-weight: 600; font-size: 0.95rem;
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 12px; padding: 0.62rem 1.1rem; cursor: pointer;
    }
    .btn:hover { border-color: var(--muted); }
    .btn-block { width: 100%; padding: 0.8rem 1.1rem; font-size: 1rem; }
    .btn-go {
      border: none; color: #fff; background: linear-gradient(135deg, var(--brand-2), var(--brand));
      box-shadow: 0 6px 16px rgba(14, 124, 138, 0.28);
    }
    .btn-go:hover { filter: brightness(1.06); }
    .btn-out {
      border: none; color: #fff; background: linear-gradient(135deg, #e0453c, #f0675a);
      box-shadow: 0 6px 16px rgba(224, 69, 60, 0.28);
    }
    .btn-fav { border: 1.5px solid #f0d9a2; background: #fdf6e6; color: #9a6c05; }
    .btn-fav:hover { background: #fbefd4; border-color: #e8c274; }
    .btn-fav.on { background: var(--gold); border-color: var(--gold); color: #fff; }
    .btn-ghost {
      border: none; background: none; color: #b9c5cb; cursor: pointer;
      font-size: 1.15rem; line-height: 1; padding: 0.2rem 0.4rem;
    }
    .btn-ghost:hover { color: var(--a); }

    .alert { font-size: 0.88rem; border-radius: 12px; padding: 0.55rem 0.8rem;
             background: #fdece9; color: #b23a30; border: 1px solid #f6cfc9; }
    .alert[hidden] { display: none; }

    /* ---------- ruoli ---------- */
    .dot { flex: none; width: 26px; height: 26px; border-radius: 50%;
           display: grid; place-items: center; color: #fff;
           font-family: var(--display); font-weight: 700; font-size: 0.78rem; }
    .dot.big { width: 46px; height: 46px; font-size: 1.15rem; }
    .dot.P { background: var(--p); } .dot.D { background: var(--d); }
    .dot.C { background: var(--c); } .dot.A { background: var(--a); }

    /* ---------- preferiti ---------- */
    #fav-box[hidden] { display: none; }
    .fav-list { padding: 0.4rem 1rem; }
    .fav-list ul { list-style: none; margin: 0; padding: 0; }
    .fav-list li { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; cursor: pointer; }
    .fav-list li + li { border-top: 1px solid var(--line); }
    .fav-list .who { flex: 1; min-width: 0; font-weight: 500; }
    .fav-list .who .cl { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
    .fav-list .qt { font-family: var(--display); font-weight: 700; color: var(--gold); white-space: nowrap; }
    .fav-list .qt small { display: block; font-family: var(--body); font-weight: 500; font-size: 0.7rem; color: var(--muted); }

    /* ---------- rosa ---------- */
    .reparto { border-radius: var(--radius); background: var(--card); border: 1px solid var(--line);
               box-shadow: var(--shadow); overflow: hidden; }
    .reparto + .reparto { margin-top: 0.9rem; }
    .reparto-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1rem; color: #fff; }
    .reparto.P .reparto-head { background: linear-gradient(120deg, #e8930c, #f2ae3d); }
    .reparto.D .reparto-head { background: linear-gradient(120deg, #10a171, #2bbd8c); }
    .reparto.C .reparto-head { background: linear-gradient(120deg, #3b74e8, #5b93f5); }
    .reparto.A .reparto-head { background: linear-gradient(120deg, #e0453c, #f0675a); }
    .reparto-head h2 { font-family: var(--display); font-size: 1rem; margin: 0; flex: 1; }
    .reparto-head .conto { font-size: 0.78rem; font-weight: 600; background: rgba(255,255,255,0.22);
                           border-radius: 999px; padding: 0.15rem 0.6rem; white-space: nowrap; }
    .reparto-head .conto.over { background: rgba(255,255,255,0.92); color: #b23a30; }
    /* in mantra i ruoli sono più lunghi: il pallino diventa una pillola */
    .dot.wide { width: auto; min-width: 26px; padding: 0 0.45rem; border-radius: 999px; font-size: 0.72rem; }
    .reparto ul { list-style: none; margin: 0; padding: 0.35rem 1rem 0.6rem; }
    .reparto li { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; }
    .reparto li[data-open] { cursor: pointer; }
    .reparto li + li { border-top: 1px solid var(--line); }
    .reparto .who { flex: 1; min-width: 0; font-weight: 500; }
    .reparto .who .cl { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
    .reparto .price { font-family: var(--display); font-weight: 700; text-align: right; white-space: nowrap; }
    .reparto .price small { display: block; font-family: var(--body); font-weight: 500; font-size: 0.7rem; color: var(--muted); }
    .reparto .vuoto { color: var(--muted); font-size: 0.87rem; padding: 0.5rem 0; }
    .reparto.P .price { color: var(--p); } .reparto.D .price { color: var(--d); }
    .reparto.C .price { color: var(--c); } .reparto.A .price { color: var(--a); }

    /* ---------- moduli mantra ---------- */
    #moduli-box[hidden] { display: none; }
    .modulo {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 0.7rem 1rem; margin-bottom: 0.6rem;
    }
    .modulo > summary {
      display: flex; align-items: center; gap: 0.6rem; cursor: pointer; list-style: none;
    }
    .modulo > summary::-webkit-details-marker { display: none; }
    .modulo .nome { font-family: var(--display); font-weight: 700; font-size: 1rem; }
    .modulo .quanti {
      font-family: var(--display); font-weight: 700; font-size: 0.8rem;
      border-radius: 999px; padding: 0.15rem 0.6rem; background: #eef3f6; color: var(--muted);
    }
    .modulo.pieno { border-color: #bfe6d5; }
    .modulo.pieno .quanti { background: #e4f4ec; color: #0b7a52; }
    .modulo .undici { list-style: none; margin: 0.8rem 0 0; padding: 0; font-size: 0.9rem; }
    .modulo .undici li { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
    .modulo .undici li + li { border-top: 1px solid var(--line); }
    .modulo .slot {
      font-family: var(--display); font-weight: 700; font-size: 0.72rem;
      background: #eef3f6; color: var(--muted); border-radius: 6px; padding: 0.1rem 0.4rem;
      min-width: 62px; text-align: center;
    }
    .modulo .slot.P { background: #fdf2dd; color: #a8761a; }
    .modulo .slot.D { background: #dff5ec; color: #0b7a52; }
    .modulo .slot.C { background: #e4ecfd; color: #2a55b5; }
    .modulo .slot.A { background: #fce8e6; color: #b23a30; }
    .modulo .chi { flex: 1; min-width: 0; }
    .modulo > summary .quanti { margin-left: auto; }
    .modulo .chi .cl { color: var(--muted); font-size: 0.8rem; }

    /* ---------- consigli ---------- */
    #consigli-box[hidden] { display: none; }
    .cons-ruolo { margin-top: 0.9rem; }
    .cons-ruolo:first-child { margin-top: 0.5rem; }
    .cons-ruolo > .slot { display: inline-block; margin-bottom: 0.2rem; }
    .cons-ruolo ul { list-style: none; margin: 0; padding: 0; font-size: 0.92rem; }
    .cons-ruolo li { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; cursor: pointer; }
    .cons-ruolo li + li { border-top: 1px solid var(--line); }
    .cons-ruolo .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cons-ruolo .who .cl { color: var(--muted); font-size: 0.8rem; }
    .cons-ruolo .who .star { color: var(--gold); }
    .cons-ruolo .val { font-family: var(--display); font-weight: 700; color: #6d4bd8; text-align: right; white-space: nowrap; }
    .cons-ruolo .val small { display: block; font-family: var(--body); font-weight: 500; font-size: 0.7rem; color: var(--muted); }


    /* ---------- barra inferiore e pannelli ---------- */
    .tabbar {
      position: fixed; z-index: 45; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,0.97); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -6px 24px rgba(16, 36, 46, 0.08);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 0.1rem;
      border: none; background: none; cursor: pointer;
      font-family: var(--body); font-size: 0.68rem; font-weight: 600; color: var(--muted);
      padding: 0.5rem 0.15rem 0.55rem; position: relative; white-space: nowrap;
    }
    .tab .ic { font-size: 1.15rem; line-height: 1.1; }
    .tab.on { color: var(--brand); }
    .tab.on::before {
      content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px;
      border-radius: 0 0 3px 3px; background: linear-gradient(90deg, var(--brand-2), var(--brand));
    }
    .tab .pill {
      position: absolute; top: 0.25rem; right: 50%; transform: translateX(150%);
      background: var(--gold); color: #fff; font-size: 0.62rem; font-weight: 700;
      border-radius: 999px; padding: 0 0.3rem; min-width: 15px;
    }
    .tab .pill[hidden] { display: none; }

    .panel { position: fixed; inset: 0; z-index: 44; display: flex; align-items: flex-end; justify-content: center; }
    .panel[hidden] { display: none; }
    .panel-bg { position: absolute; inset: 0; background: rgba(12, 34, 44, 0.45); backdrop-filter: blur(2px); }
    .panel-card {
      position: relative; width: min(720px, 100%);
      height: calc(100dvh - var(--tabh, 4.2rem) - 1.6rem); display: flex; flex-direction: column;
      background: var(--bg); border-radius: 22px 22px 0 0;
      box-shadow: 0 -14px 44px rgba(12, 34, 44, 0.3);
      margin-bottom: var(--tabh, 4.2rem);
    }
    .panel-head {
      display: flex; align-items: center; gap: 1rem; flex: none;
      padding: 1rem clamp(1rem, 4vw, 1.4rem) 0.7rem;
    }
    .panel-head h2 { flex: 1; margin: 0; font-family: var(--display); font-size: 1.15rem; }
    .panel-body {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 clamp(1rem, 4vw, 1.4rem) 1.4rem;
    }

    /* costi dei preferiti */
    .fav-costi { padding: 0.9rem 1rem; margin-bottom: 0.8rem; }
    .fav-costi[hidden] { display: none; }
    .fav-costi .tot b {
      display: block; font-family: var(--display); font-size: 2rem; line-height: 1; color: var(--gold);
    }
    .fav-costi .tot span { font-size: 0.82rem; color: var(--muted); }
    .fav-costi .rip { list-style: none; margin: 1rem 0 0; padding: 0; }
    .fav-costi .rip li { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; }
    .fav-costi .rip li + li { border-top: 1px solid var(--line); }
    .fav-costi .lab { font-size: 0.88rem; font-weight: 600; width: 8.5rem; }
    .fav-costi .lab small { display: block; font-weight: 400; font-size: 0.72rem; color: var(--muted); }
    .fav-costi .barra { flex: 1; height: 8px; border-radius: 999px; background: #eef3f6; overflow: hidden; }
    .fav-costi .barra i { display: block; height: 100%; border-radius: 999px; }
    .fav-costi .barra i.P { background: var(--p); } .fav-costi .barra i.D { background: var(--d); }
    .fav-costi .barra i.C { background: var(--c); } .fav-costi .barra i.A { background: var(--a); }
    .fav-costi .v { font-family: var(--display); font-weight: 700; font-size: 0.95rem; min-width: 3rem; text-align: right; }

    /* elenco di ogni ruolo nei consigli, richiudibile */
    details.cons-ruolo > summary {
      display: flex; align-items: center; gap: 0.5rem; cursor: pointer; list-style: none;
      padding: 0.35rem 0;
    }
    details.cons-ruolo > summary::-webkit-details-marker { display: none; }
    details.cons-ruolo > summary .quanti-r { margin-left: auto; font-size: 0.76rem; color: var(--muted); }


    /* ---------- rosa ideale ---------- */
    .ideale-top { padding: 0.9rem 1rem; margin-bottom: 0.8rem; }
    .ideale-top .cifre { display: flex; flex-wrap: wrap; gap: 1.2rem 1.6rem; }
    .ideale-top .cifre div b {
      display: block; font-family: var(--display); font-size: 1.7rem; line-height: 1;
    }
    .ideale-top .cifre .fvm b { color: #6d4bd8; }
    .ideale-top .cifre .fvm2 b { color: #9b4bd8; }
    .ideale-top .cifre .costo b { color: var(--brand); }
    .ideale-top .cifre span { font-size: 0.78rem; color: var(--muted); }
    .ideale-top .btn { margin-top: 0.9rem; }
    .ideale-top .avviso { margin-top: 0.7rem; font-size: 0.84rem; color: #b23a30; }
    .ideale-top .nota-ideale { margin-top: 0.7rem; font-size: 0.84rem; color: var(--muted); }

    .ideale-rep { margin-bottom: 0.8rem; }
    .ideale-rep > summary .quanti { margin-left: auto; }
    .ideale-rep .riga { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; }
    .ideale-rep .riga + .riga { border-top: 1px solid var(--line); }
    .ideale-rep .chi { flex: 1; min-width: 0; }
    .ideale-rep .chi .cl { color: var(--muted); font-size: 0.8rem; }
    .ideale-rep .num { font-family: var(--display); font-weight: 700; text-align: right; white-space: nowrap; }
    .ideale-rep .num small { display: block; font-family: var(--body); font-weight: 500; font-size: 0.7rem; color: var(--muted); }
    .ideale-rep .num .f { color: #6d4bd8; }
    .caricando { color: var(--muted); font-size: 0.9rem; padding: 0.6rem 0; }

    /* ---------- pannello del giocatore ---------- */
    .sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
    .sheet[hidden] { display: none; }
    .sheet-bg { position: absolute; inset: 0; background: rgba(12, 34, 44, 0.5); backdrop-filter: blur(2px); }
    .sheet-card {
      position: relative; width: min(520px, 100%);
      background: var(--card); border-radius: 22px 22px 0 0;
      padding: 1.2rem clamp(1.1rem, 5vw, 1.5rem) calc(1.4rem + env(safe-area-inset-bottom));
      box-shadow: 0 -12px 40px rgba(12, 34, 44, 0.28);
      max-height: 92vh; overflow-y: auto;
    }
    .sheet-x {
      position: absolute; top: 1rem; right: 1rem;
      border: none; background: #eef3f6; color: var(--muted); cursor: pointer;
      width: 34px; height: 34px; border-radius: 50%; font-size: 1.35rem; line-height: 1;
    }
    .sheet-x:hover { background: #e2eaee; color: var(--ink); }

    .pl-head { display: flex; align-items: center; gap: 0.8rem; padding-right: 2.5rem; }
    .pl-head h2 { font-family: var(--display); font-size: 1.35rem; margin: 0; line-height: 1.15; }
    .pl-head p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .pl-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
    .pl-tags span {
      font-size: 0.74rem; font-weight: 600; border-radius: 999px; padding: 0.2rem 0.6rem;
    }
    .pl-tags .in-rosa { background: #e4f4ec; color: #0b7a52; }
    .pl-tags .in-fav { background: #fdf3dc; color: #9a6c05; }

    .pl-nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin: 1rem 0; }
    .pl-nums div { background: #f5f9fb; border: 1px solid var(--line); border-radius: 12px;
                   padding: 0.6rem 0.5rem; text-align: center; }
    .pl-nums b { display: block; font-family: var(--display); font-size: 1.3rem; line-height: 1.1; }
    .pl-nums small { font-size: 0.7rem; color: var(--muted); }
    .pl-nums .qt b  { color: var(--brand); }
    .pl-nums .fvm b { color: #6d4bd8; }
    .pl-nums .max b { color: var(--brand-2); }

    .pl-manual { display: grid; grid-template-columns: 0.8fr 1.4fr; gap: 0.7rem; margin-bottom: 0.9rem; }
    .pl-manual[hidden] { display: none; }
    .pl-price { margin-bottom: 0.9rem; }
    .pl-price[hidden] { display: none; }
    .price-row { display: grid; grid-template-columns: 52px 1fr 52px; gap: 0.5rem; align-items: stretch; margin-top: 0.25rem; }
    .price-row input {
      text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.5rem;
      padding: 0.35rem 0.4rem; -moz-appearance: textfield;
    }
    .price-row input::-webkit-outer-spin-button,
    .price-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .pm {
      border: 1.5px solid var(--line); background: #f5f9fb; color: var(--brand);
      border-radius: 12px; font-size: 1.5rem; line-height: 1; cursor: pointer;
      display: grid; place-items: center; user-select: none; touch-action: manipulation;
    }
    .pm:hover { background: #e9f2f5; }
    .pm:active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .pm:disabled { opacity: 0.4; cursor: default; }

    .slider {
      -webkit-appearance: none; appearance: none; width: 100%; height: 26px;
      background: none; border: none; padding: 0; margin-top: 0.5rem; cursor: pointer;
    }
    .slider::-webkit-slider-runnable-track {
      height: 6px; border-radius: 999px;
      background: linear-gradient(90deg, var(--brand-2), var(--brand));
    }
    .slider::-moz-range-track { height: 6px; border-radius: 999px; background: #cfe2e6; }
    .slider::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--brand); }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; margin-top: -9px;
      background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 10px rgba(14,124,138,0.35);
    }
    .slider::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 10px rgba(14,124,138,0.35);
    }

    .quick { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .quick button {
      font-family: var(--body); font-size: 0.84rem; font-weight: 600; color: var(--brand);
      background: #eef6f8; border: 1px solid #d8e9ed; border-radius: 999px;
      padding: 0.3rem 0.75rem; cursor: pointer;
    }
    .quick button:hover { background: #e1eff2; }
    .pl-actions { display: grid; gap: 0.6rem; margin-top: 0.9rem; }

    .toast {
      position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
      bottom: calc(1.6rem + env(safe-area-inset-bottom));
      background: #12324a; color: #fff; font-size: 0.9rem; font-weight: 500;
      padding: 0.6rem 1rem; border-radius: 999px; box-shadow: 0 10px 26px rgba(12, 34, 44, 0.35);
      max-width: min(92vw, 420px); text-align: center;
    }
    .toast[hidden] { display: none; }

    /* ---------- fondo pagina ---------- */
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.6rem; }
    details.setup { margin-top: 1.6rem; }
    details.setup summary {
      cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 0.9rem;
      color: var(--muted); padding: 0.3rem 0;
    }
    .setup-card { display: block; }
    #setup-box .setup-card { box-shadow: none; }
    .setup-grid { display: grid; gap: 0.8rem; align-items: end; }
    .setup-grid.due { grid-template-columns: 1fr 1fr; }
    .setup-grid.quattro { grid-template-columns: repeat(4, 1fr); }
    .setup-lab {
      font-size: 0.78rem; font-weight: 600; color: var(--muted);
      margin: 1.2rem 0 0.5rem; display: flex; gap: 0.5rem; align-items: baseline;
    }
    .setup-lab span { font-weight: 500; }
    .setup-lab span.over { color: #b23a30; }

    @media (min-width: 700px) {
      .sheet { align-items: center; }
      .sheet-card { border-radius: 22px; }
    }
    @media (max-width: 700px) {
      .setup-grid.quattro { grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .stats, .meter, .card, .reparto { animation: rise 0.45s ease both; }
      .sheet-card { animation: slide-up 0.22s ease both; }
      .sheet-bg, .toast { animation: fade-in 0.2s ease both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes slide-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>

  <script src="listone-2026-27.js"></script>
  <script>
    const KEY = "luca_fantacalcio_rosa";
    const ROLES = ["P", "D", "C", "A"];
    const ROLE_LABEL = { P: "Portieri", D: "Difensori", C: "Centrocampisti", A: "Attaccanti" };
    const ROLE_ONE = { P: "portiere", D: "difensore", C: "centrocampista", A: "attaccante" };
    // ruoli del listone Mantra
    const MANTRA = {
      Por: "Portiere", Dc: "Difensore centrale", Dd: "Terzino destro", Ds: "Terzino sinistro",
      B: "Braccetto", E: "Esterno", M: "Mediano", C: "Centrale", W: "Ala",
      T: "Trequartista", A: "Attaccante", Pc: "Punta centrale"
    };

    // [id, ruolo, ruoli mantra, nome, squadra, qt classic, fvm classic, qt mantra, fvm mantra]
    // Il formato vecchio (senza mantra) era [id, ruolo, nome, squadra, qt, fvm]: lo riconosco
    // dalla lunghezza, così una copia vecchia in cache non manda in tilt tutti i campi.
    const RIGHE = typeof LISTONE !== "undefined" ? LISTONE : [];
    const VECCHIO = RIGHE.length > 0 && RIGHE[0].length < 9;
    const PLAYERS = RIGHE.map(p => VECCHIO
      ? { id: p[0], role: p[1], mantra: [], name: p[2], club: p[3], qtC: p[4], fvmC: p[5], qtM: p[4], fvmM: p[5] }
      : { id: p[0], role: p[1], mantra: p[2] ? p[2].split(";") : [],
          name: p[3], club: p[4], qtC: p[5], fvmC: p[6], qtM: p[7], fvmM: p[8] });
    const byId = new Map(PLAYERS.map(p => [p.id, p]));

    // Moduli Mantra, edizione 2026/27: ogni casella elenca i ruoli che può ospitare.
    const MODULI = [
      { nome: "3-4-3",   slot: ["POR", "DC", "DC", "DC/B", "E", "M/C", "C", "E", "W/A", "W/A", "A/PC"] },
      { nome: "3-4-1-2", slot: ["POR", "DC", "DC", "DC/B", "E", "M/C", "C", "E", "T", "A/PC", "A/PC"] },
      { nome: "3-4-2-1", slot: ["POR", "DC", "DC", "DC/B", "M", "M/C", "E", "E/W", "T", "T/A", "A/PC"] },
      { nome: "3-5-2",   slot: ["POR", "DC", "DC", "DC/B", "M", "M/C", "E", "E/W", "C", "A/PC", "A/PC"] },
      { nome: "3-5-1-1", slot: ["POR", "DC", "DC", "DC/B", "M", "M", "C", "E/W", "E/W", "T/A", "A/PC"] },
      { nome: "4-3-3",   slot: ["POR", "DD", "DC", "DC", "DS", "M/C", "M", "C", "W/A", "W/A", "A/PC"] },
      { nome: "4-3-1-2", slot: ["POR", "DD", "DC", "DC", "DS", "M/C", "M", "C", "T", "T/A/PC", "A/PC"] },
      { nome: "4-4-2",   slot: ["POR", "DD", "DC", "DC", "DS", "M/C", "C", "E", "E/W", "A/PC", "A/PC"] },
      { nome: "4-1-4-1", slot: ["POR", "DD", "DC", "DC", "DS", "M", "C/T", "T", "E/W", "W", "A/PC"] },
      { nome: "4-4-1-1", slot: ["POR", "DD", "DC", "DC", "DS", "M", "C", "E/W", "E/W", "T/A", "A/PC"] },
      { nome: "4-2-3-1", slot: ["POR", "DD", "DC", "DC", "DS", "M", "M/C", "W/T", "T", "W/A", "A/PC"] }
    ];

    const emptyState = () => ({
      mode: "classic",
      budget: 500,
      slots: { P: 3, D: 8, C: 8, A: 6 },
      rep:   { P: 25, D: 75, C: 150, A: 250 },
      rosa: [], fav: []
    });

    // Storage con fallback in memoria (così funziona anche dove localStorage è bloccato)
    const store = {
      mem: null,
      load() {
        try { return JSON.parse(localStorage.getItem(KEY)) || emptyState(); }
        catch { return this.mem || emptyState(); }
      },
      save(data) {
        this.mem = data;
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
      }
    };

    let state = Object.assign(emptyState(), store.load());
    if (!Array.isArray(state.fav)) state.fav = [];
    if (!state.rep) state.rep = emptyState().rep;
    if (!state.mode) state.mode = "classic";

    let matches = [];    // suggerimenti mostrati
    let active = -1;     // suggerimento evidenziato
    let current = null;  // giocatore aperto nel pannello

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    const isMantra = () => state.mode === "mantra";
    const fvmOf = p => isMantra() ? p.fvmM : p.fvmC;
    // sigla mostrata accanto al nome: in mantra i ruoli veri, in classic il reparto
    const tagOf = p => (isMantra() && p.mantra && p.mantra.length) ? p.mantra.join("/") : p.role;

    const spent = () => state.rosa.reduce((n, p) => n + p.price, 0);
    const rest = () => state.budget - spent();
    const slotsTotal = () => ROLES.reduce((n, r) => n + state.slots[r], 0);
    const taken = role => state.rosa.filter(p => p.role === role).length;
    const spentIn = role => state.rosa.filter(p => p.role === role).reduce((n, p) => n + p.price, 0);
    // con l'ultimo slot devi comunque poter coprire gli altri a 1 credito
    const maxBid = () => Math.max(1, rest() - (slotsTotal() - state.rosa.length - 1));

    const inRosa = pl => state.rosa.find(p =>
      (pl.id && p.id === pl.id) || norm(p.name) === norm(pl.name));
    const isFav = pl => !!pl.id && state.fav.includes(pl.id);

    function alertMsg(msg) {
      $("alert").textContent = msg;
      $("alert").hidden = !msg;
    }

    let toastTimer = null;
    function toast(msg) {
      clearTimeout(toastTimer);
      $("toast").textContent = msg;
      $("toast").hidden = false;
      toastTimer = setTimeout(() => { $("toast").hidden = true; }, 3200);
    }

    // ---------- ricerca nel listone ----------
    function search(q) {
      const n = norm(q);
      if (!n) return [];
      const hits = [];
      for (const p of PLAYERS) {
        const name = norm(p.name), club = norm(p.club);
        // prima i nomi che iniziano così, poi le squadre, poi le corrispondenze in mezzo alla parola
        const rank = name.startsWith(n) ? 0 : club.startsWith(n) ? 1 : name.includes(n) ? 2 : club.includes(n) ? 3 : -1;
        if (rank >= 0) hits.push({ rank, p });
      }
      hits.sort((a, b) => a.rank - b.rank || fvmOf(b.p) - fvmOf(a.p) || a.p.name.localeCompare(b.p.name));
      return hits.slice(0, 10).map(h => h.p);
    }

    function renderSuggest() {
      const box = $("suggest");
      const q = $("q").value.trim();
      if (!q) {
        box.innerHTML = "";
        box.hidden = true;
        $("q").setAttribute("aria-expanded", "false");
        return;
      }
      const rows = matches.map((p, i) => {
        const preso = state.rosa.some(x => x.id === p.id);
        const pref = state.fav.includes(p.id);
        return `
        <li role="option" data-i="${i}" aria-selected="${i === active}">
          <span class="dot ${p.role} wide">${esc(tagOf(p))}</span>
          <span class="nm">${esc(p.name)} <span class="cl">${esc(p.club)}</span>${preso ? ' <span class="cl">· in rosa</span>' : ""}</span>
          ${pref ? '<span class="star">&#9733;</span>' : ""}
          <span class="qt">${fvmOf(p)}</span>
        </li>`;
      });
      // niente nel listone: si può aggiungere lo stesso, a mano
      rows.push(`<li role="option" data-manual="1" aria-selected="${active === matches.length}">
          <span class="dot" style="background:var(--muted)">+</span>
          <span class="nm manual">Aggiungi «${esc(q)}» a mano</span>
        </li>`);
      box.innerHTML = rows.join("");
      box.hidden = false;
      $("q").setAttribute("aria-expanded", "true");
    }

    function closeSuggest() {
      matches = []; active = -1;
      $("suggest").innerHTML = "";
      $("suggest").hidden = true;
      $("q").setAttribute("aria-expanded", "false");
    }

    // ---------- prezzo: stepper, cursore e scorciatoie ----------
    let priceMax = 1;   // tetto: i crediti che puoi ancora impegnare

    function setPrice(v, fromInput) {
      const n = Math.min(priceMax, Math.max(0, Math.round(Number(v) || 0)));
      if (!fromInput) $("p-price").value = n;
      $("p-range").value = n;
      $("p-minus").disabled = n <= 0;
      $("p-plus").disabled = n >= priceMax;
      return n;
    }

    const priceNow = () => Math.min(priceMax, Math.max(0, parseInt($("p-price").value, 10) || 0));

    function setupPrice(pl, preso) {
      priceMax = preso ? preso.price : maxBid();
      $("p-range").max = priceMax;   // il cursore copre tutto: da 0 all'offerta massima
      const base = preso ? preso.price : Math.min(priceMax, (pl.id ? fvmOf(pl) : 0) || 1);
      setPrice(base);
      const rif = pl.id ? fvmOf(pl) : null;
      $("p-quick").querySelector('[data-q="fvm"]').textContent = rif ? `FVM ${rif}` : "FVM";
      $("p-quick").querySelector('[data-q="fvm"]').hidden = !rif;
      $("p-quick").querySelector('[data-q="max"]').textContent = `Massimo ${priceMax}`;
    }

    // tenendo premuto − o + il valore scorre
    function holdable(btn, delta) {
      let t = null, iv = null;
      const step = () => setPrice(priceNow() + delta);
      const stop = () => { clearTimeout(t); clearInterval(iv); t = iv = null; };
      btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        step();
        t = setTimeout(() => { iv = setInterval(step, 90); }, 420);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
    }
    holdable($("p-minus"), -1);
    holdable($("p-plus"), 1);

    $("p-range").addEventListener("input", e => setPrice(e.target.value));
    $("p-price").addEventListener("input", e => setPrice(e.target.value, true));
    $("p-price").addEventListener("blur", () => setPrice(priceNow()));
    $("p-quick").addEventListener("click", e => {
      const btn = e.target.closest("[data-q]");
      if (!btn || !current) return;
      const q = btn.dataset.q;
      if (q === "fvm") setPrice(fvmOf(current) || 1);
      else if (q === "max") setPrice(priceMax);
      else setPrice(priceNow() + Number(q));
    });

    // ---------- pannello del giocatore ----------
    function openPlayer(pl) {
      // niente campo attivo: sul telefono così la tastiera si chiude
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      current = pl;
      const preso = inRosa(pl);
      const manuale = !pl.id;

      $("pl-dot").className = "dot big " + pl.role;
      $("pl-dot").textContent = pl.role;
      $("pl-name").textContent = pl.name;

      const ruoli = isMantra() && pl.mantra && pl.mantra.length
        ? pl.mantra.map(r => MANTRA[r] || r).join(" · ")
        : ROLE_ONE[pl.role].replace(/^./, c => c.toUpperCase());
      $("pl-meta").textContent = manuale && !pl.club ? "Fuori listone" : ruoli + (pl.club ? " · " + pl.club : "");

      $("pl-fvm").textContent = pl.id ? fvmOf(pl) : "—";
      $("pl-max").textContent = maxBid();

      $("pl-tags").innerHTML =
        (preso ? `<span class="in-rosa">In rosa a ${preso.price}</span>` : "") +
        (isFav(pl) ? '<span class="in-fav">&#9733; Nei preferiti</span>' : "");

      $("pl-manual").hidden = !manuale;
      if (manuale) {
        $("p-role").value = pl.role;
        $("p-club").value = pl.club || "";
      }

      $("pl-price").hidden = !!preso;
      if (!preso) setupPrice(pl, null);

      $("add").textContent = preso ? "Togli dalla squadra" : "Aggiungi alla squadra";
      $("add").className = "btn btn-block " + (preso ? "btn-out" : "btn-go");

      $("fav").hidden = manuale;
      $("fav").textContent = isFav(pl) ? "★ Togli dai preferiti" : "Aggiungi ai preferiti";
      $("fav").className = "btn btn-fav btn-block" + (isFav(pl) ? " on" : "");

      alertMsg("");
      $("sheet").hidden = false;
      bloccaScroll();
    }

    function openById(id) {
      const p = byId.get(Number(id));
      if (p) openPlayer(p);
    }

    function closeSheet() {
      $("sheet").hidden = true;
      bloccaScroll();
      current = null;
      alertMsg("");
    }

    // ---------- rosa e preferiti ----------
    function updateStats() {
      $("s-count").textContent = state.rosa.length + "/" + slotsTotal();
      $("s-max").textContent = maxBid();
      const pct = state.budget > 0 ? Math.min(100, Math.round(spent() / state.budget * 100)) : 0;
      $("bar").style.width = pct + "%";
      $("bar").style.background = pct < 60
        ? "linear-gradient(90deg, #0f9b6c, #12b3a0)"
        : pct < 88 ? "linear-gradient(90deg, #e8930c, #f2ae3d)"
                   : "linear-gradient(90deg, #e0453c, #f0675a)";
      $("bar-pct").textContent = pct + "%";

      const somma = ROLES.reduce((n, r) => n + state.rep[r], 0);
      const el = $("rep-sum");
      el.textContent = `si distribuiscono sui ${state.budget} crediti`;
      el.className = somma !== state.budget ? "over" : "";
    }

    function renderFav() {
      const men = state.fav.map(id => byId.get(id)).filter(Boolean)
        .sort((a, b) => ROLES.indexOf(a.role) - ROLES.indexOf(b.role) || fvmOf(b) - fvmOf(a));

      const n = men.length;
      $("tab-fav-n").textContent = n;
      $("tab-fav-n").hidden = n === 0;

      if (!n) {
        $("fav-costi").hidden = true;
        $("fav-costi").innerHTML = "";
        $("fav-list").innerHTML = '<p class="cl" style="margin:0.4rem 0">Nessun preferito: aprine uno dalla ricerca e tocca «Aggiungi ai preferiti».</p>';
        return;
      }

      // quanto valgono i preferiti, secondo il FVM
      const totale = men.reduce((t, p) => t + fvmOf(p), 0);
      const perReparto = ROLES.map(r => {
        const q = men.filter(p => p.role === r);
        return { r, n: q.length, costo: q.reduce((t, p) => t + fvmOf(p), 0) };
      });

      $("fav-costi").hidden = false;
      $("fav-costi").innerHTML = `
        <div class="tot">
          <div><b>${totale}</b><span>FVM dei ${n} preferiti</span></div>
        </div>
        <ul class="rip">${perReparto.map(x => `
          <li>
            <span class="dot ${x.r}">${x.r}</span>
            <span class="lab">${ROLE_LABEL[x.r]}<small>${x.n === 1 ? "1 giocatore" : x.n + " giocatori"}</small></span>
            <span class="barra"><i class="${x.r}" style="width:${totale ? Math.round(x.costo / totale * 100) : 0}%"></i></span>
            <span class="v">${x.costo}</span>
          </li>`).join("")}</ul>`;
      $("fav-list").innerHTML = "<ul>" + men.map(p => `
        <li data-open="${p.id}">
          <span class="dot ${p.role} wide">${esc(tagOf(p))}</span>
          <span class="who">${esc(p.name)} <span class="cl">${esc(p.club)}</span></span>
          <span class="qt">${fvmOf(p)}<small>fvm</small></span>
          <button class="btn-ghost" data-unfav="${p.id}" title="Togli dai preferiti" aria-label="Togli ${esc(p.name)} dai preferiti">&times;</button>
        </li>
      `).join("") + "</ul>";
    }

    // Assegna i giocatori alle caselle del modulo cercando la copertura migliore
    // (un giocatore con più ruoli può liberare la casella di un altro: algoritmo di Kuhn).
    function assegna(slot, rosa) {
      const puo = slot.map(s => {
        const ammessi = s.split("/");
        return rosa.map(p => p.ruoli.some(r => ammessi.includes(r)));
      });
      const preso = new Array(slot.length).fill(-1);   // casella -> indice del giocatore

      function prova(i, visti) {
        for (let j = 0; j < rosa.length; j++) {
          if (!puo[i][j] || visti[j]) continue;
          visti[j] = true;
          const dove = preso.indexOf(j);
          if (dove === -1 || prova(dove, visti)) { preso[i] = j; return true; }
        }
        return false;
      }

      let coperte = 0;
      for (let i = 0; i < slot.length; i++) {
        if (prova(i, new Array(rosa.length).fill(false))) coperte++;
      }
      return { preso, coperte };
    }

    // il colore della casella segue il reparto del suo primo ruolo
    const REPARTO_MANTRA = {
      POR: "P", DC: "D", DD: "D", DS: "D", B: "D",
      E: "C", M: "C", C: "C", W: "A", T: "A", A: "A", PC: "A"
    };
    const repartoDiSlot = sl => REPARTO_MANTRA[sl.split("/")[0]] || "C";

    // i pannelli a fisarmonica si richiudono a ogni ridisegno: mi ricordo quali erano aperti
    const aperti = new Set();
    function ricordaAperti(box) {
      box.addEventListener("toggle", e => {
        const d = e.target;
        if (!d.dataset.chiave) return;
        if (d.open) { aperti.add(d.dataset.chiave); riempiConsiglio(d); }
        else aperti.delete(d.dataset.chiave);
      }, true);
    }

    let esitiModuli = [];

    function renderModuli() {
      if (!isMantra()) {
        esitiModuli = [];
        $("moduli").innerHTML = '<p class="cl">I moduli valgono per la modalità Mantra: puoi cambiarla nelle impostazioni.</p>';
        return;
      }

      // in campo vanno solo i giocatori con un ruolo mantra (chi è aggiunto a mano non ce l'ha)
      const rosa = state.rosa.map(p => {
        const dal = p.id ? byId.get(p.id) : null;
        return { name: p.name, club: p.club, ruoli: (dal ? dal.mantra : []).map(r => r.toUpperCase()) };
      }).filter(p => p.ruoli.length);

      const esiti = MODULI.map(m => {
        const { preso, coperte } = assegna(m.slot, rosa);
        return { m, preso, coperte };
      }).sort((a, b) => b.coperte - a.coperte || a.m.nome.localeCompare(b.m.nome));

      esitiModuli = esiti;
      $("moduli").innerHTML = esiti.map(({ m, preso, coperte }) => {
        const pieno = coperte === m.slot.length;
        const righe = m.slot.map((sl, i) => {
          const p = preso[i] >= 0 ? rosa[preso[i]] : null;
          return `
            <li>
              <span class="slot ${repartoDiSlot(sl)}">${esc(sl)}</span>
              <span class="chi">${p ? `${esc(p.name)} <span class="cl">${esc(p.club)}</span>` : ""}</span>
            </li>`;
        }).join("");

        return `
          <details class="modulo${pieno ? " pieno" : ""}" data-chiave="mod-${m.nome}"${aperti.has("mod-" + m.nome) ? " open" : ""}>
            <summary>
              <span class="nome">${m.nome}</span>
              <span class="quanti">${coperte}/${m.slot.length}</span>
            </summary>
            <ul class="undici">${righe}</ul>
          </details>`;
      }).join("");
    }

    // i nomi con il FVM più alto di tutto il listone che possono occupare quella casella
    function consigli(sl, quanti) {
      const ammessi = sl.split("/");
      return PLAYERS
        .filter(p => p.mantra.some(r => ammessi.includes(r.toUpperCase())))
        .sort((a, b) => fvmOf(b) - fvmOf(a) || a.name.localeCompare(b.name))
        .slice(0, quanti);
    }

    // riga di un consiglio: nome, squadra, eventuale stella e FVM
    function rigaConsiglio(p) {
      return `
        <li data-open="${p.id}">
          <span class="who">${esc(p.name)} <span class="cl">${esc(p.club)}</span>${state.rosa.some(x => x.id === p.id) ? ' <span class="cl">· in rosa</span>' : ""}${state.fav.includes(p.id) ? ' <span class="star">&#9733;</span>' : ""}</span>
          <span class="val">${fvmOf(p)}<small>fvm</small></span>
        </li>`;
    }

    const QUANTI_CONSIGLI = 50;

    function blocco(sigla, elenco) {
      return `
        <details class="cons-ruolo">
          <summary>
            <span class="slot ${repartoDiSlot(sigla)}">${esc(sigla)}</span>
            <span class="quanti-r">${elenco.length} nomi</span>
          </summary>
          <ul>${elenco.map(rigaConsiglio).join("") || '<li class="cl">Nessuno disponibile</li>'}</ul>
        </details>`;
    }

    // le liste sono lunghe: le costruisco solo quando il pannello viene aperto davvero
    function riempiConsiglio(d) {
      const corpo = d.querySelector(".cons-body");
      if (!corpo || corpo.dataset.pieno === "1") return;
      const chiave = d.dataset.chiave || "";

      if (chiave.startsWith("consC-")) {
        const r = chiave.slice(6);
        const elenco = PLAYERS.filter(p => p.role === r)
          .sort((a, b) => fvmOf(b) - fvmOf(a) || a.name.localeCompare(b.name))
          .slice(0, QUANTI_CONSIGLI);
        corpo.innerHTML = blocco(r, elenco);
      } else if (chiave.startsWith("cons-")) {
        const m = MODULI.find(x => x.nome === chiave.slice(5));
        if (!m) return;
        corpo.innerHTML = [...new Set(m.slot)]
          .map(sl => blocco(sl, consigli(sl, QUANTI_CONSIGLI))).join("");
      }
      corpo.dataset.pieno = "1";
    }

    // Classic: niente moduli, i migliori per FVM in ciascun reparto
    function renderConsigliClassic() {
      $("consigli").innerHTML = ROLES.map(r => `
          <details class="modulo" data-chiave="consC-${r}"${aperti.has("consC-" + r) ? " open" : ""}>
            <summary>
              <span class="nome">${ROLE_LABEL[r]}</span>
              <span class="quanti">${taken(r)}/${state.slots[r]}</span>
            </summary>
            <div class="cons-body"></div>
          </details>`).join("");
      $("consigli").querySelectorAll("details[open]").forEach(riempiConsiglio);
    }

    function renderConsigli(esiti) {
      if (!isMantra()) { renderConsigliClassic(); return; }

      $("consigli").innerHTML = esiti.map(({ m, coperte }) => `
          <details class="modulo" data-chiave="cons-${m.nome}"${aperti.has("cons-" + m.nome) ? " open" : ""}>
            <summary>
              <span class="nome">${m.nome}</span>
              <span class="quanti">${coperte}/${m.slot.length}</span>
            </summary>
            <div class="cons-body"></div>
          </details>`).join("");
      $("consigli").querySelectorAll("details[open]").forEach(riempiConsiglio);
    }

    function render() {
      $("rosa").innerHTML = ROLES.map(r => {
        const men = state.rosa.filter(p => p.role === r)
          .sort((a, b) => b.price - a.price || a.name.localeCompare(b.name));
        const usati = spentIn(r);
        const sforato = usati > state.rep[r];
        const rows = men.length ? men.map(p => {
          const dal = p.id ? byId.get(p.id) : null;
          const tag = dal ? tagOf(dal) : p.role;
          const fvm = dal ? fvmOf(dal) : p.fvm;
          return `
          <li${p.id ? ` data-open="${p.id}"` : ""}>
            <span class="dot ${r} wide">${esc(tag)}</span>
            <span class="who">${esc(p.name)}${p.club ? ` <span class="cl">${esc(p.club)}</span>` : ""}</span>
            <span class="price">${p.price}${fvm ? `<small>fvm ${fvm}</small>` : ""}</span>
            <button class="btn-ghost" data-del="${p.key}" title="Togli dalla rosa" aria-label="Togli ${esc(p.name)}">&times;</button>
          </li>`;
        }).join("") : `<li class="vuoto">Ancora nessun ${ROLE_ONE[r]}.</li>`;

        return `
          <section class="reparto ${r}">
            <div class="reparto-head">
              <h2>${ROLE_LABEL[r]}</h2>
              <span class="conto">${men.length}/${state.slots[r]}</span>
              <span class="conto${sforato ? " over" : ""}" title="Crediti spesi sul budget desiderato">${usati}/${state.rep[r]}</span>
            </div>
            <ul>${rows}</ul>
          </section>`;
      }).join("");

      renderFav();
      renderModuli();
      renderConsigli(esitiModuli);
      updateStats();
      if (!$("suggest").hidden) renderSuggest();
    }

    function save() { store.save(state); }

    // ---------- azioni del pannello ----------
    function addOrRemove() {
      if (!current) return;
      const preso = inRosa(current);

      if (preso) {
        state.rosa = state.rosa.filter(p => p.key !== preso.key);
        save(); render();
        toast(`${preso.name} tolto dalla rosa`);
        closeSheet();
        return;
      }

      const manuale = !current.id;
      const role = manuale ? $("p-role").value : current.role;
      const club = manuale ? $("p-club").value.trim() : current.club;
      const price = priceNow();

      if (taken(role) >= state.slots[role]) { alertMsg(`${ROLE_LABEL[role]}: slot già pieni.`); return; }
      if (price > maxBid()) {
        alertMsg(`Offerta troppo alta: con gli slot rimasti puoi arrivare a ${maxBid()} crediti.`);
        return;
      }

      state.rosa.push({
        key: uid(), id: current.id || null, name: current.name,
        club, role, price,
        fvm: current.id ? fvmOf(current) : null
      });
      state.fav = state.fav.filter(id => id !== current.id);

      save(); render();
      const sfora = spentIn(role) > state.rep[role];
      toast(`Preso ${current.name} per ${price} ${price === 1 ? "credito" : "crediti"}` +
            (sfora ? ` · ${ROLE_LABEL[role].toLowerCase()} oltre il budget` : ""));
      closeSheet();
      $("q").value = "";
      $("q-clear").hidden = true;
    }

    function toggleFav() {
      if (!current || !current.id) return;
      if (isFav(current)) {
        state.fav = state.fav.filter(id => id !== current.id);
        toast(`${current.name} tolto dai preferiti`);
      } else {
        state.fav.push(current.id);
        toast(`${current.name} messo tra i preferiti`);
      }
      const prezzo = priceNow();
      save(); render();
      openPlayer(current);   // ridisegna il pannello aggiornato
      setPrice(prezzo);
    }

    // ---------- eventi ----------
    $("q").addEventListener("input", e => {
      const q = e.target.value;
      $("q-clear").hidden = !q;
      matches = search(q);
      active = matches.length ? 0 : -1;
      renderSuggest();
    });

    $("q").addEventListener("keydown", e => {
      const opzioni = $("suggest").hidden ? 0 : matches.length + 1;   // +1 per l'inserimento a mano
      if (opzioni && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : opzioni - 1)) % opzioni;
        renderSuggest();
        return;
      }
      if (e.key === "Escape") {
        if (!$("suggest").hidden) { closeSuggest(); e.stopPropagation(); }
        return;
      }
      if (e.key === "Enter" && opzioni) {
        e.preventDefault();
        if (active >= 0 && active < matches.length) openPlayer(matches[active]);
        else openPlayer({ id: null, role: "C", name: $("q").value.trim(), club: "", mantra: [] });
        closeSuggest();
      }
    });

    $("suggest").addEventListener("mousedown", e => {
      const li = e.target.closest("li");
      if (!li) return;
      e.preventDefault();
      if (li.dataset.manual) openPlayer({ id: null, role: "C", name: $("q").value.trim(), club: "", mantra: [] });
      else openPlayer(matches[Number(li.dataset.i)]);
      closeSuggest();
    });

    $("q-clear").addEventListener("click", () => {
      $("q").value = "";
      $("q-clear").hidden = true;
      closeSuggest();
      $("q").focus();
    });

    document.addEventListener("click", e => {
      if (!e.target.closest(".searchbar")) closeSuggest();
    });

    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (!$("sheet").hidden) closeSheet();
      else if (!$("panel").hidden) apriScheda("rosa");
    });

    $("sheet-close").addEventListener("click", closeSheet);
    $("sheet-bg").addEventListener("click", closeSheet);
    $("add").addEventListener("click", addOrRemove);
    $("fav").addEventListener("click", toggleFav);
    $("p-price").addEventListener("keydown", e => { if (e.key === "Enter") addOrRemove(); });

    $("rosa").addEventListener("click", e => {
      const del = e.target.closest("[data-del]");
      if (del) {
        state.rosa = state.rosa.filter(p => p.key !== del.dataset.del);
        save(); render();
        return;
      }
      const row = e.target.closest("[data-open]");
      if (row) openById(row.dataset.open);
    });

    $("consigli").addEventListener("click", e => {
      const row = e.target.closest("[data-open]");
      if (row) openById(row.dataset.open);
    });
    ricordaAperti($("consigli"));
    ricordaAperti($("moduli"));

    $("fav-list").addEventListener("click", e => {
      const un = e.target.closest("[data-unfav]");
      if (un) {
        state.fav = state.fav.filter(id => id !== Number(un.dataset.unfav));
        save(); render();
        return;
      }
      const row = e.target.closest("[data-open]");
      if (row) openById(row.dataset.open);
    });

    // ---------- impostazioni ----------
    $("mode").addEventListener("change", e => {
      state.mode = e.target.value === "mantra" ? "mantra" : "classic";
      save(); render();
      toast(state.mode === "mantra" ? "Modalità Mantra: ruoli e valori mantra" : "Modalità Classic");
    });

    $("budget").addEventListener("change", e => {
      state.budget = Math.max(1, parseInt(e.target.value, 10) || 1);
      e.target.value = state.budget;
      bilanciaRep(null);   // i reparti si ridistribuiscono sul nuovo totale
      save(); render();
    });

    // Il budget dei reparti deve sempre sommare ai crediti totali: quando se ne tocca
    // uno, gli altri tre si riadattano in proporzione a quanto valevano prima.
    function bilanciaRep(cambiato) {
      const tot = state.budget;
      if (cambiato) state.rep[cambiato] = Math.min(tot, Math.max(0, state.rep[cambiato]));

      const altri = ROLES.filter(r => r !== cambiato);
      const resto = Math.max(0, tot - (cambiato ? state.rep[cambiato] : 0));
      const somma = altri.reduce((n, r) => n + state.rep[r], 0);

      let dato = 0;
      altri.forEach((r, i) => {
        const v = i === altri.length - 1
          ? resto - dato
          : (somma > 0 ? Math.round(state.rep[r] / somma * resto) : Math.round(resto / altri.length));
        state.rep[r] = Math.max(0, v);
        dato += state.rep[r];
      });

      // gli arrotondamenti possono lasciare un credito di scarto: lo assorbe il primo reparto
      const scarto = tot - ROLES.reduce((n, r) => n + state.rep[r], 0);
      if (scarto !== 0) {
        const r = altri[0] || cambiato;
        state.rep[r] = Math.max(0, state.rep[r] + scarto);
      }

      ROLES.forEach(r => { $("rep-" + r).value = state.rep[r]; });
    }

    ROLES.forEach(r => {
      $("slot-" + r).addEventListener("change", e => {
        state.slots[r] = Math.max(0, parseInt(e.target.value, 10) || 0);
        e.target.value = state.slots[r];
        save(); render();
      });
      $("rep-" + r).addEventListener("change", e => {
        state.rep[r] = Math.max(0, parseInt(e.target.value, 10) || 0);
        bilanciaRep(r);
        save(); render();
      });
    });

    $("reset").addEventListener("click", () => {
      if (!confirm("Svuotare la rosa e ripartire da zero?")) return;
      state.rosa = [];
      save(); render();
    });

    // ---------- rosa ideale ----------
    // Nell'asta il prezzo di un giocatore è il suo FVM: quindi il FVM è insieme il
    // valore da massimizzare e il costo che consuma il budget.

    function assegnaPesata(slot, pool, peso) {
      const compat = slot.map(sl => {
        const amm = sl.split("/");
        return pool.map(p => p.mantra.some(r => amm.includes(r.toUpperCase())));
      });
      const preso = new Array(slot.length).fill(-1);
      const ordine = pool.map((_, j) => j).sort((a, b) => peso(pool[b]) - peso(pool[a]));

      function prova(j, visti) {
        for (let i = 0; i < slot.length; i++) {
          if (!compat[i][j] || visti[i]) continue;
          visti[i] = true;
          if (preso[i] === -1 || prova(preso[i], visti)) { preso[i] = j; return true; }
        }
        return false;
      }
      for (const j of ordine) prova(j, new Array(slot.length).fill(false));
      return preso;
    }

    const somma = lista => lista.reduce((t, p) => t + fvmOf(p), 0);
    const gruppo = scelti => ({ scelti, fvm: somma(scelti) });

    // Undici del modulo con il FVM più alto che sta nel budget.
    function undiciOttimo(m, budget) {
      const tutti = PLAYERS.filter(p => p.mantra.length);
      const leggi = (preso, pool) => ({
        preso, pool,
        scelti: preso.filter(j => j >= 0).map(j => pool[j]),
        completo: preso.every(j => j >= 0)
      });

      let esito = leggi(assegnaPesata(m.slot, tutti, fvmOf), tutti);
      if (somma(esito.scelti) <= budget) return { ...esito, fvm: somma(esito.scelti) };

      // tetto sul singolo giocatore: il più alto che fa rientrare la somma
      let lo = 0, hi = Math.max(...tutti.map(fvmOf)), sol = null;
      for (let it = 0; it < 20; it++) {
        const cap = (lo + hi) / 2;
        const pool = tutti.filter(p => fvmOf(p) <= cap);
        const e = leggi(assegnaPesata(m.slot, pool, fvmOf), pool);
        if (e.completo && somma(e.scelti) <= budget) { sol = e; lo = cap; } else hi = cap;
      }
      if (!sol) return { ...esito, fvm: somma(esito.scelti) };

      // con quello che avanza provo a migliorare una casella per volta
      const scelti = sol.preso.map(j => (j >= 0 ? sol.pool[j] : null));
      let tot = somma(scelti.filter(Boolean));
      for (let giro = 0; giro < 40; giro++) {
        let meglio = null;
        m.slot.forEach((sl, i) => {
          const amm = sl.split("/");
          const ora = scelti[i];
          const val = ora ? fvmOf(ora) : 0;
          for (const p of tutti) {
            if (scelti.includes(p) || !p.mantra.some(r => amm.includes(r.toUpperCase()))) continue;
            const nuovoTot = tot - val + fvmOf(p);
            if (fvmOf(p) > val && nuovoTot <= budget &&
                (!meglio || fvmOf(p) - val > meglio.guadagno)) {
              meglio = { i, p, guadagno: fvmOf(p) - val, nuovoTot };
            }
          }
        });
        if (!meglio) break;
        scelti[meglio.i] = meglio.p;
        tot = meglio.nuovoTot;
      }

      const preso = scelti.map(p => (p ? tutti.indexOf(p) : -1));
      return { preso, pool: tutti, scelti: scelti.filter(Boolean), completo: scelti.every(Boolean), fvm: tot };
    }

    // Zaino per reparto: quanti giocatori, quanto FVM speso, quanto FVM guadagnato
    // (qui costo e valore coincidono: si tratta di avvicinarsi al budget senza superarlo).
    const NEG = -1e9;
    function tabellaDP(pool, kMax, budget) {
      const larg = budget + 1;
      let dp = new Float64Array((kMax + 1) * larg).fill(NEG);
      dp[0] = 0;
      const scelta = new Uint8Array(pool.length * (kMax + 1) * larg);
      pool.forEach((p, idx) => {
        const c = fvmOf(p);
        if (c > budget) return;
        const nuovo = dp.slice();
        const base = idx * (kMax + 1) * larg;
        for (let k = kMax - 1; k >= 0; k--) {
          const riga = k * larg, dopo = (k + 1) * larg;
          for (let sp = 0; sp + c <= budget; sp++) {
            const da = dp[riga + sp];
            if (da === NEG) continue;
            const pos = dopo + sp + c;
            if (da + c > nuovo[pos]) { nuovo[pos] = da + c; scelta[base + pos] = 1; }
          }
        }
        dp = nuovo;
      });
      return { dp, scelta, larg, kMax, pool };
    }

    function estraiDP(t, k, spesa) {
      const scelti = [];
      let kk = k, sp = spesa;
      for (let idx = t.pool.length - 1; idx >= 0 && kk > 0; idx--) {
        if (t.scelta[idx * (t.kMax + 1) * t.larg + kk * t.larg + sp]) {
          scelti.push(t.pool[idx]);
          sp -= fvmOf(t.pool[idx]);
          kk--;
        }
      }
      return scelti;
    }

    function combinaCurve(curve, budget) {
      let acc = new Float64Array(budget + 1).fill(NEG);
      acc[0] = 0;
      const scelte = [];
      curve.forEach(cur => {
        const nuovo = new Float64Array(budget + 1).fill(NEG);
        const quale = new Int16Array(budget + 1).fill(-1);
        for (let tot = 0; tot <= budget; tot++) {
          for (let q = 0; q <= tot; q++) {
            const a = acc[tot - q], b = cur[q];
            if (a === NEG || b === NEG) continue;
            if (a + b > nuovo[tot]) { nuovo[tot] = a + b; quale[tot] = q; }
          }
        }
        acc = nuovo;
        scelte.push(quale);
      });

      let migliore = -1, spesa = 0;
      for (let c = 0; c <= budget; c++) if (acc[c] > migliore) { migliore = acc[c]; spesa = c; }
      if (migliore < 0) return null;

      const parti = new Array(curve.length).fill(0);
      let resto = spesa;
      for (let i = curve.length - 1; i >= 0; i--) {
        parti[i] = scelte[i][resto];
        resto -= parti[i];
      }
      return { fvm: migliore, parti };
    }

    // Esattamente bisogno[r] giocatori per reparto, con il FVM più alto entro il budget
    function gruppoOttimo(bisogno, budget, esclusi) {
      const usati = ROLES.filter(r => bisogno[r] > 0);
      if (!usati.length) return gruppo([]);

      const tabelle = usati.map(r => {
        const pool = PLAYERS.filter(p => p.role === r && !(esclusi && esclusi.has(p.id)));
        return { r, t: tabellaDP(pool, bisogno[r], budget) };
      });
      const curve = tabelle.map(({ r, t }) => t.dp.slice(bisogno[r] * t.larg, bisogno[r] * t.larg + budget + 1));
      const mix = combinaCurve(curve, budget);
      if (!mix) return { ...gruppo([]), impossibile: true };

      return gruppo(tabelle.flatMap(({ r, t }, i) => estraiDP(t, bisogno[r], mix.parti[i])));
    }

    // Rosa Classic: prima l'undici (scegliendo anche il modulo), poi le riserve
    const MODULI_CLASSIC = [[3,4,3], [3,5,2], [4,3,3], [4,4,2], [4,5,1], [5,3,2], [5,4,1]];

    // A parità di FVM speso ci sono tante combinazioni equivalenti: fra queste scelgo
    // quella che tiene più alto il valore del titolare più debole, per non ritrovarsi
    // in campo dei riempitivi solo per far quadrare la somma.
    function undiciClassic(budget) {
      const moduli = MODULI_CLASSIC.filter(([d, c, a]) =>
        state.slots.P >= 1 && state.slots.D >= d && state.slots.C >= c && state.slots.A >= a);
      if (!moduli.length) return null;

      const cerca = soglia => {
        const tabelle = {};
        ROLES.forEach(r => {
          const pool = PLAYERS.filter(p => p.role === r && fvmOf(p) >= soglia);
          tabelle[r] = tabellaDP(pool, 5, budget);
        });
        let best = null;
        for (const [d, c, a] of moduli) {
          const bisogno = { P: 1, D: d, C: c, A: a };
          const usati = ROLES.filter(r => bisogno[r] > 0);
          const curve = usati.map(r => {
            const t = tabelle[r];
            return t.dp.slice(bisogno[r] * t.larg, bisogno[r] * t.larg + budget + 1);
          });
          const mix = combinaCurve(curve, budget);
          if (!mix) continue;
          const scelti = usati.flatMap((r, i) => estraiDP(tabelle[r], bisogno[r], mix.parti[i]));
          if (scelti.length !== 11) continue;
          if (!best || mix.fvm > best.e.fvm) best = { modulo: `${d}-${c}-${a}`, e: gruppo(scelti) };
        }
        return best;
      };

      let migliore = cerca(0);
      if (!migliore) return null;

      // alzo il valore minimo del titolare finché la rosa resta componibile
      let lo = 0, hi = Math.floor(budget / 11);
      for (let it = 0; it < 8 && hi - lo > 1; it++) {
        const m = Math.floor((lo + hi) / 2);
        const prova = cerca(m);
        if (prova && prova.e.scelti.length === 11) { migliore = prova; lo = m; } else hi = m;
      }
      return migliore;
    }

    function rosaClassic() {
      const panchina = Math.max(0, slotsTotal() - 11);
      const budgetTit = Math.max(11, state.budget - panchina);   // un punto a testa per le riserve

      const miglior = undiciClassic(budgetTit);
      if (!miglior) return null;

      const presi = new Set(miglior.e.scelti.map(p => p.id));
      const conta = r => miglior.e.scelti.filter(p => p.role === r).length;
      const bisogno = { P: state.slots.P - conta("P"), D: state.slots.D - conta("D"),
                        C: state.slots.C - conta("C"), A: state.slots.A - conta("A") };
      const panca = gruppoOttimo(bisogno, Math.max(0, state.budget - miglior.e.fvm), presi);

      return { modulo: miglior.modulo, titolari: miglior.e, panca };
    }

    // ---------- disegno della rosa ideale ----------    // ---------- disegno della rosa ideale ----------    // ---------- disegno della rosa ideale ----------
    let ideale = null;   // ultimo calcolo, per il pulsante "Metti in rosa"

    const rigaIdeale = (p, sigla) => `
      <div class="riga">
        ${sigla ? `<span class="slot ${repartoDiSlot(sigla)}">${esc(sigla)}</span>`
                : `<span class="dot ${p.role} wide">${esc(tagOf(p))}</span>`}
        <span class="chi">${p ? `${esc(p.name)} <span class="cl">${esc(p.club)}</span>` : ""}</span>
        <span class="num">${p ? `<span class="f">${fvmOf(p)}</span><small>fvm</small>` : ""}</span>
      </div>`;

    function testataIdeale(fvmTit, fvmTot, avviso) {
      const sfora = fvmTot > state.budget;
      return `
        <div class="card ideale-top">
          <div class="cifre">
            <div class="fvm"><b>${fvmTit}</b><span>FVM titolari</span></div>
            <div class="fvm2"><b>${fvmTot}</b><span>FVM rosa · budget ${state.budget}</span></div>
          </div>
          ${avviso ? `<div class="nota-ideale">${esc(avviso)}</div>` : ""}
          ${sfora ? `<div class="avviso">Sfora il budget di ${fvmTot - state.budget}.</div>` : ""}
          <button class="btn btn-go" id="usa-ideale">Metti in rosa</button>
        </div>`;
    }

    function blocchiPanca(panca) {
      if (!panca || !panca.scelti.length) return "";
      return ROLES.map(r => {
        const men = panca.scelti.filter(p => p.role === r).sort((a, b) => fvmOf(b) - fvmOf(a));
        if (!men.length) return "";
        return `
          <details class="modulo ideale-rep">
            <summary>
              <span class="nome">Riserve ${ROLE_LABEL[r].toLowerCase()}</span>
              <span class="quanti">${men.reduce((t, p) => t + fvmOf(p), 0)} fvm</span>
            </summary>
            ${men.map(p => rigaIdeale(p)).join("")}
          </details>`;
      }).join("");
    }

    function renderIdealeClassic() {
      const r = rosaClassic();
      if (!r) { $("ideale").innerHTML = '<p class="caricando">Con questi crediti non si riesce a comporre un undici.</p>'; return; }

      const fvmTot = r.titolari.fvm + r.panca.fvm;
      ideale = { giocatori: [...r.titolari.scelti, ...r.panca.scelti] };

      const perReparto = ROLES.map(r2 => {
        const men = r.titolari.scelti.filter(p => p.role === r2).sort((a, b) => fvmOf(b) - fvmOf(a));
        return men.length ? `
          <details class="modulo ideale-rep" open>
            <summary>
              <span class="nome">${ROLE_LABEL[r2]}</span>
              <span class="quanti">${men.length} titolari · ${men.reduce((t, p) => t + fvmOf(p), 0)} fvm</span>
            </summary>
            ${men.map(p => rigaIdeale(p)).join("")}
          </details>` : "";
      }).join("");

      $("ideale").innerHTML =
        testataIdeale(r.titolari.fvm, fvmTot,
          `Undici col FVM più alto dentro il budget: modulo ${r.modulo}.`) +
        perReparto + blocchiPanca(r.panca);
    }

    function renderIdealeMantra() {
      const panchina = Math.max(0, slotsTotal() - 11);
      const budgetTit = Math.max(11, state.budget - panchina);

      const esiti = MODULI.map(m => ({ m, e: undiciOttimo(m, budgetTit) }))
        .sort((a, b) => b.e.fvm - a.e.fvm);
      const top = esiti[0];

      // le riserve completano i reparti con quello che resta del budget
      const presi = new Set(top.e.scelti.map(p => p.id));
      const conta = r => top.e.scelti.filter(p => p.role === r).length;
      const bisogno = { P: Math.max(0, state.slots.P - conta("P")), D: Math.max(0, state.slots.D - conta("D")),
                        C: Math.max(0, state.slots.C - conta("C")), A: Math.max(0, state.slots.A - conta("A")) };
      const panca = gruppoOttimo(bisogno, Math.max(0, state.budget - top.e.fvm), presi);

      ideale = { giocatori: [...top.e.scelti, ...panca.scelti] };

      $("ideale").innerHTML =
        testataIdeale(top.e.fvm, top.e.fvm + panca.fvm,
          `Undici col FVM più alto dentro il budget: ${top.m.nome}. Le riserve completano la rosa.`) +
        esiti.map(({ m, e }, i) => `
          <details class="modulo ideale-rep"${i === 0 ? " open" : ""}>
            <summary>
              <span class="nome">${m.nome}</span>
              <span class="quanti">${e.fvm} fvm</span>
            </summary>
            ${m.slot.map((sl, k) => rigaIdeale(e.preso[k] >= 0 ? e.pool[e.preso[k]] : null, sl)).join("")}
          </details>`).join("") +
        blocchiPanca(panca);
    }

    function renderIdeale() {
      $("ideale").innerHTML = '<p class="caricando">Sto cercando la rosa migliore…</p>';
      // lascio disegnare il messaggio prima di metterci a calcolare
      setTimeout(() => {
        isMantra() ? renderIdealeMantra() : renderIdealeClassic();
      }, 30);
    }

    $("ideale").addEventListener("click", e => {
      if (!e.target.closest("#usa-ideale") || !ideale) return;
      if (!confirm("Sostituire la rosa attuale con questa proposta? I giocatori vengono inseriti al loro FVM.")) return;
      state.rosa = ideale.giocatori.map(p => ({
        key: uid(), id: p.id, name: p.name, club: p.club, role: p.role,
        price: fvmOf(p), fvm: fvmOf(p)
      }));
      save(); render();
      toast(`Rosa sostituita: ${state.rosa.length} giocatori`);
      apriScheda("rosa");
    });

    // ---------- barra inferiore e pannelli ----------
    const SCHEDE = {
      setup:    { tit: "Impostazioni asta", box: "setup-box" },
      fav:      { tit: "Preferiti", box: "fav-box" },
      moduli:   { tit: "Moduli", box: "moduli-box" },
      consigli: { tit: "Consigli", box: "consigli-box" },
      ideale:   { tit: "Rosa ideale", box: "ideale-box" }
    };
    let schedaAperta = "rosa";

    function bloccaScroll() {
      const fermo = !$("sheet").hidden || !$("panel").hidden;
      document.body.style.overflow = fermo ? "hidden" : "";
    }

    function apriScheda(nome) {
      if (nome === "rosa" || nome === schedaAperta) {
        schedaAperta = "rosa";
        $("panel").hidden = true;
      } else {
        schedaAperta = nome;
        const s = SCHEDE[nome];
        Object.values(SCHEDE).forEach(x => { $(x.box).hidden = x.box !== s.box; });
        $("panel-tit").textContent = nome === "moduli" && !isMantra() ? "Moduli (solo in Mantra)" : s.tit;
        if (nome === "ideale") renderIdeale();
        $("panel").hidden = false;
        $("panel").querySelector(".panel-body").scrollTop = 0;
      }
      document.querySelectorAll(".tab").forEach(t =>
        t.classList.toggle("on", t.dataset.tab === schedaAperta));
      bloccaScroll();
    }

    function misuraBarra() {
      const h = document.querySelector(".tabbar").offsetHeight;
      document.documentElement.style.setProperty("--tabh", h + "px");
    }
    misuraBarra();
    addEventListener("resize", misuraBarra);
    addEventListener("orientationchange", misuraBarra);

    document.querySelectorAll(".tab").forEach(t =>
      t.addEventListener("click", () => apriScheda(t.dataset.tab)));
    $("panel-close").addEventListener("click", () => apriScheda("rosa"));
    $("panel-bg").addEventListener("click", () => apriScheda("rosa"));

    // ---------- installazione dell'app ----------
    let installEvent = null;
    const isStandalone = () =>
      matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      installEvent = e;
      if (!isStandalone()) $("install").hidden = false;
    });

    $("install").addEventListener("click", async () => {
      if (installEvent) {
        installEvent.prompt();
        const { outcome } = await installEvent.userChoice;
        installEvent = null;
        if (outcome === "accepted") $("install").hidden = true;
        return;
      }
      // iPhone e iPad: niente prompt automatico, servono le istruzioni
      toast("Su iPhone: tocca Condividi in Safari, poi Aggiungi a Home");
    });

    window.addEventListener("appinstalled", () => { $("install").hidden = true; });

    // su iOS il bottone va mostrato a mano: non esiste beforeinstallprompt
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIOS && !isStandalone()) $("install").hidden = false;

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("fantacalcio-sw.js").catch(() => {});
      });
      // quando entra in servizio una versione nuova ricarico, così pagina e dati vanno d'accordo
      let ricaricato = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (ricaricato) return;
        ricaricato = true;
        location.reload();
      });
    }

    if (VECCHIO) toast("Sto aggiornando il listone: se i ruoli sembrano sbagliati, ricarica la pagina");

    $("mode").value = state.mode;
    $("budget").value = state.budget;
    ROLES.forEach(r => {
      $("slot-" + r).value = state.slots[r];
      $("rep-" + r).value = state.rep[r];
    });
    if (ROLES.reduce((n, r) => n + state.rep[r], 0) !== state.budget) { bilanciaRep(null); save(); }
    render();
  </script>
</body>
</html>
